<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" role="img" aria-label="Goa-AI architecture: Design DSL compiles into generated typed packages, executed by the Runtime over In-Memory or Temporal engines and model/tool adapters">
  <style>
    .bg { fill: #f3f6fa; stroke: #dce3ec; stroke-width: 1.5; }
    .panel { fill: #ffffff; stroke: #dce3ec; stroke-width: 1.5; }
    .panel-accent { fill: #eaf0fd; stroke: #2255c5; stroke-width: 1.5; }
    .head { fill: #2255c5; }
    .head-ink { fill: #ffffff; font: 700 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .chip { fill: #f3f6fa; stroke: #dce3ec; stroke-width: 1; }
    .ink { fill: #172b45; font: 600 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #526278; font: 500 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { fill: #293f75; font: 600 11.5px "SFMono-Regular", Consolas, monospace; }
    .wire { stroke: #2255c5; stroke-width: 1.75; fill: none; }
    .arrow { fill: #2255c5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #192a40; stroke: #35475e; }
      .panel { fill: #1b2d43; stroke: #35475e; }
      .panel-accent { fill: #293f60; stroke: #a9c5ff; }
      .head { fill: #293f60; }
      .head-ink { fill: #edf2f9; }
      .chip { fill: #142133; stroke: #35475e; }
      .ink { fill: #edf2f9; }
      .muted { fill: #b0bfd1; }
      .mono { fill: #c2d5ff; }
      .wire { stroke: #a9c5ff; }
      .arrow { fill: #a9c5ff; }
    }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="912" height="372" rx="12" class="bg"/>

  <!-- Column 1: Design -->
  <rect x="28" y="28" width="184" height="292" rx="8" class="panel"/>
  <rect x="28" y="28" width="184" height="36" rx="8" class="head"/>
  <text x="120" y="51" text-anchor="middle" class="head-ink">1. Design (design/*.go)</text>

  <rect x="42" y="78" width="156" height="34" rx="5" class="chip"/>
  <text x="120" y="99" text-anchor="middle" class="ink">Agent &amp; SystemPrompt</text>

  <rect x="42" y="122" width="156" height="34" rx="5" class="chip"/>
  <text x="120" y="143" text-anchor="middle" class="ink">Toolset &amp; BindTo</text>

  <rect x="42" y="166" width="156" height="34" rx="5" class="chip"/>
  <text x="120" y="187" text-anchor="middle" class="ink">BoundedResult &amp; Inject</text>

  <rect x="42" y="210" width="156" height="34" rx="5" class="chip"/>
  <text x="120" y="231" text-anchor="middle" class="ink">RunPolicy &amp; Confirmation</text>

  <rect x="42" y="254" width="156" height="34" rx="5" class="chip"/>
  <text x="120" y="275" text-anchor="middle" class="ink">MCP &amp; Evaluations</text>

  <text x="120" y="308" text-anchor="middle" class="muted">You &amp; coding agent edit</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="216" y1="174" x2="254" y2="174" class="wire" marker-end="url(#arr)"/>
  <text x="235" y="164" text-anchor="middle" class="mono">goa gen</text>

  <!-- Column 2: Generated -->
  <rect x="260" y="28" width="192" height="292" rx="8" class="panel"/>
  <rect x="260" y="28" width="192" height="36" rx="8" class="head"/>
  <text x="356" y="51" text-anchor="middle" class="head-ink">2. Generated (gen/)</text>

  <rect x="274" y="78" width="164" height="34" rx="5" class="chip"/>
  <text x="356" y="99" text-anchor="middle" class="ink">JSON Schemas &amp; Codecs</text>

  <rect x="274" y="122" width="164" height="34" rx="5" class="chip"/>
  <text x="356" y="143" text-anchor="middle" class="ink">Service &amp; MCP Adapters</text>

  <rect x="274" y="166" width="164" height="34" rx="5" class="chip"/>
  <text x="356" y="187" text-anchor="middle" class="ink">Workflow &amp; Activity Specs</text>

  <rect x="274" y="210" width="164" height="34" rx="5" class="chip"/>
  <text x="356" y="231" text-anchor="middle" class="ink">Completion &amp; Prompt Render</text>

  <rect x="274" y="254" width="164" height="34" rx="5" class="chip"/>
  <text x="356" y="275" text-anchor="middle" class="mono">AGENTS_QUICKSTART.md</text>

  <text x="356" y="308" text-anchor="middle" class="muted">Never hand-edited</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="456" y1="174" x2="488" y2="174" class="wire" marker-end="url(#arr)"/>

  <!-- Column 3: Runtime -->
  <rect x="494" y="28" width="184" height="292" rx="8" class="panel-accent"/>
  <rect x="494" y="28" width="184" height="36" rx="8" class="head"/>
  <text x="586" y="51" text-anchor="middle" class="head-ink">3. Runtime &amp; Planner</text>

  <rect x="508" y="78" width="156" height="34" rx="5" class="panel"/>
  <text x="586" y="99" text-anchor="middle" class="ink">Your Planner Logic</text>

  <rect x="508" y="122" width="156" height="34" rx="5" class="panel"/>
  <text x="586" y="143" text-anchor="middle" class="ink">Validated Tool Executor</text>

  <rect x="508" y="166" width="156" height="34" rx="5" class="panel"/>
  <text x="586" y="187" text-anchor="middle" class="ink">Policy &amp; Budget Guard</text>

  <rect x="508" y="210" width="156" height="34" rx="5" class="panel"/>
  <text x="586" y="231" text-anchor="middle" class="ink">Child-Agent Run Trees</text>

  <rect x="508" y="254" width="156" height="34" rx="5" class="panel"/>
  <text x="586" y="275" text-anchor="middle" class="ink">Typed Stream Events</text>

  <text x="586" y="308" text-anchor="middle" class="muted">Coordinates turns &amp; tools</text>

  <!-- Arrows 3 -> 4 -->
  <line x1="682" y1="106" x2="714" y2="106" class="wire" marker-end="url(#arr)"/>
  <line x1="682" y1="242" x2="714" y2="242" class="wire" marker-end="url(#arr)"/>

  <!-- Column 4 Top: Engines -->
  <rect x="720" y="28" width="172" height="136" rx="8" class="panel"/>
  <rect x="720" y="28" width="172" height="36" rx="8" class="head"/>
  <text x="806" y="51" text-anchor="middle" class="head-ink">Execution Engine</text>

  <rect x="734" y="76" width="144" height="32" rx="5" class="chip"/>
  <text x="806" y="96" text-anchor="middle" class="ink">In-Memory (local dev)</text>

  <rect x="734" y="116" width="144" height="32" rx="5" class="chip"/>
  <text x="806" y="136" text-anchor="middle" class="ink">Temporal (durable)</text>

  <!-- Column 4 Bottom: Providers & Infra -->
  <rect x="720" y="180" width="172" height="140" rx="8" class="panel"/>
  <rect x="720" y="180" width="172" height="36" rx="8" class="head"/>
  <text x="806" y="203" text-anchor="middle" class="head-ink">Models &amp; Tool Infra</text>

  <rect x="734" y="226" width="144" height="26" rx="5" class="chip"/>
  <text x="806" y="243" text-anchor="middle" class="muted">OpenAI · Anthropic</text>

  <rect x="734" y="258" width="144" height="26" rx="5" class="chip"/>
  <text x="806" y="275" text-anchor="middle" class="muted">Bedrock · Vertex AI</text>

  <rect x="734" y="290" width="144" height="22" rx="5" class="chip"/>
  <text x="806" y="305" text-anchor="middle" class="muted">Pulse Streams · Registry</text>

  <text x="460" y="354" text-anchor="middle" class="muted">Static contracts stay in design/*.go; generated codecs, schemas, and bindings live in gen/; application code owns planners and services.</text>
</svg>
