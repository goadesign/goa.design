highbay_compare_heading: "Comment Highbay se situe"
highbay_compare_solo: "Mode Plan et fichiers de règles"
highbay_compare_solo_text: "Les règles Markdown dérivent au fil des PR, et le même agent juge toujours son propre code."
highbay_compare_speckit: "SDK d’agents orientés code"
highbay_compare_speckit_text: "Les schémas vivent dans l’application. Highbay compile HTTP, OpenAPI 3 et MCP depuis un contrat."
highbay_compare_workspaces: "Lanceurs parallèles de worktrees"
highbay_compare_workspaces_text: "Plutôt que de comparer des branches concurrentes à la main, bâtisseur et testeur partagent un contrat."
highbay_faq_scope_q: "Des apps Python, TypeScript ou web peuvent-elles appeler Highbay ?"
highbay_faq_scope_a: "Oui. Highbay compile des binaires Go standards exposant HTTP, OpenAPI 3 et MCP pour tout client."
highbay_faq_holdouts_q: "Qu’est-ce qui empêche le bâtisseur d’éditer le contrat ou les tests ?"
highbay_faq_holdouts_a: "Highbay régénère `design/` depuis votre révision confirmée et rejette tout commit modifiant `design/` ou `eval/`."
highbay_faq_local_q: "Faut-il un compte cloud ou une clé API modèle ?"
highbay_faq_local_a: "Non. Les agents utilisent leurs connexions CLI existantes et `eval/` tourne par défaut sur des doublures déterministes."
highbay_faq_sandbox_q: "Fonctionne-t-il sur des dépôts existants et comment tournent les tests ?"
highbay_faq_sandbox_a: "Il crée des services ou étend des dépôts Goa, exécute les contrôles dans Docker et fusionne dans votre branche ou PR. Voir [Architecture et configuration](../docs/3-ecosystem/highbay/#architecture)."
