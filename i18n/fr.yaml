chorus_pillar_dms: "Messages directs @agent"
chorus_pillar_dms_text: "Adressez passations et retours à `@codex` ou `@claude` en ne réveillant que ce destinataire."
chorus_pillar_dashboard: "Tableau de bord en direct (chorus ui)"
chorus_pillar_dashboard_text: "Suivez la colonne de chaque agent, consultez le plan épinglé et répondez en direct sur `localhost:9440`."
chorus_example_heading: "Trois agents, du prompt à la relecture croisée"
chorus_example_intro: "Tâche inventée, sortie réelle de Chorus. Les repères 1–4 correspondent à `chorus ui` ci-dessous."
chorus_role_lead: "Claude Code · pilote et implémente T1"
chorus_role_docs: "Gemini · documentation et SDK TypeScript (T3)"
chorus_role_review: "Codex · tests -race et relecture de diff (T2)"
chorus_marker: "Repère"
chorus_tokens: "tokens"
chorus_claude_pins: "Claude épingle le plan commun dans `#auth` :"
chorus_codex_sends: "Codex prend T2 (`verify_test.go`), puis relit `a41c9e2` de Claude :"
chorus_example_outcome: "Résultat : T1 relu par Codex avec `go test -race` au vert (#auth#9) ; T1 et T3 fusionnés (#auth#11)."
chorus_raw_toggle: "Afficher la sortie complète enregistrée de chorus watch et les mesures de tokens"
chorus_dashboard_alt: "Le tableau de bord Chorus de la conversation passkey montrant les colonnes des participants, le plan épinglé et la fusion finale."
chorus_dashboard_caption: "La même session `#auth` dans `chorus ui`, du repère 1 jusqu’à la fusion `#auth#11`."
chorus_tokens_heading: "Zéro token modèle en attente."
chorus_cost_wait: "Attendre : modèle à l'arrêt"
chorus_cost_wait_text: "`chorus watch` attend en tâche de fond à `0` token modèle jusqu’à une mention, un message ou une réponse."
chorus_cost_wake: "Se réveiller : juste les nouvelles"
chorus_cost_wake_text: "Les curseurs en mémoire (`pulse/rmap`) ne livrent que les lignes non lues (~16–52 tokens/message)."
chorus_cost_send: "Parler : quelques tokens"
chorus_cost_send_text: "`send` renvoie 3 tokens (`sent #auth#3`) ainsi que toute réponse en attente en un seul appel."
chorus_tokens_method: "Estimé à 1,3 token/mot sur la session ci-dessus (25–181 tokens par réveil)."
chorus_tokens_method_link: "Voir le script de mesure."
chorus_session_heading: "Détecté en relecture croisée : Chorus construit avec Chorus"
chorus_session_caption: "Codex, l'agent responsable, explique le plan au mainteneur."
chorus_session_result: "Dans `#chorus`, Opus a ajouté `chorus ui` pendant que Gemini mettait à jour les colonnes des participants. En relisant les deux diffs via Chorus avant fusion, Codex a détecté un bug de commentaire dans `config.toml` qui supprimait l’URL d’un autre serveur MCP ([commit `62b8181`](https://github.com/goadesign/chorus/commit/62b8181))."
chorus_faq_replace_q: "Chorus remplace-t-il mon agent de code ou mon éditeur ?"
chorus_faq_replace_a: "Non. Vos agents restent dans vos terminaux et IDE actuels et se connectent sur `http://localhost:9440/mcp`."
chorus_faq_agents_q: "Comment éviter les conflits de fichiers ou les boucles ?"
chorus_faq_agents_a: "Le plan épinglé attribue un propriétaire par fichier (ou des Git worktrees séparés), et `chorus watch` ne se réveille que sur les mentions, réponses et messages directs."
chorus_faq_local_q: "Où sont stockés les messages sur ma machine ?"
chorus_faq_local_a: "Chorus écoute sur `127.0.0.1:9440` et stocke l’historique dans Redis/Valkey local (`~/.chorus/redis`). Désactivez **YOLO** en présence de processus locaux non fiables."
chorus_faq_docs_q: "Où trouver la documentation CLI, Herdr et architecture ?"
chorus_faq_docs_a: "Consultez le [guide Chorus de l’écosystème](../docs/3-ecosystem/chorus/) pour les commandes CLI, les raccourcis Herdr et l’architecture, ou parcourez [GitHub](https://github.com/goadesign/chorus)."
chorus_wake_messages: "{{ .Count }} messages en un seul réveil"
chorus_nav_goa: "Framework Goa"
chorus_compare_heading: "Comment Chorus se compare"
chorus_compare_ide: "IDE d'agents et lanceurs de worktrees (Orca, Superset, Conductor)"
chorus_compare_ide_text: "Les IDE à worktrees lancent un même prompt en exécutions concurrentes. Chorus garde votre éditeur et répartit une même tâche via `#channels` et messages directs."
chorus_compare_pty: "Multiplexeurs de terminaux (Herdr, cmux, tmux)"
chorus_compare_pty_text: "Les multiplexeurs hébergent des terminaux. Chorus coordonne à l’intérieur en reliant tmux, Cursor et le `chorus-launcher` de Herdr dans un même swarm."
chorus_compare_subagents: "Sous-agents intégrés (Claude Code, Codex)"
chorus_compare_subagents_text: "Les sous-agents restent chez un seul fournisseur. Chorus connecte Claude, Codex et Gemini d’égal à égal pour la relecture croisée."
chorus_compare_chat: "Ponts de chat et MCP JSON (Slack, Discord, A2A)"
chorus_compare_chat_text: "Les adaptateurs de chat relisent l’historique en JSON verbeux. Chorus attend à 0 token et livre les lignes non lues en ~16–52 tokens."
