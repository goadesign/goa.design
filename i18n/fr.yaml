highbay_contrast_intro: "Comparez une session d’agent en roue libre sur ce prompt avec le guide et le compilateur de contrats de Highbay :"
highbay_solo_title: "Agent de code en roue libre"
highbay_solo_chip_gate: "Code ad hoc · une seule fenêtre de contexte"
highbay_solo_row_1_title: "Dérive d’architecture entre dépôts"
highbay_solo_row_1_text: "Câble routeurs, middlewares et journaux différemment dans chaque service — forçant l’agent à relire une plomberie sur mesure à chaque tour."
highbay_solo_row_2_title: "Synchronisation manuelle de quatre fichiers"
highbay_solo_row_2_text: "Ajouter un champ oblige à modifier à la main le gestionnaire, le validateur, la spec OpenAPI et le schéma JSON MCP en tokens de sortie."
highbay_solo_row_3_title: "Passe sur 20 lignes, casse à 50 Mo"
highbay_solo_row_3_text: "Des tableaux de logs non bornés et des attentes en mémoire passent les tests unitaires, puis saturent le contexte ou disparaissent au redémarrage."
highbay_solo_row_4_title: "Suppositions figées dans des tests au vert"
highbay_solo_row_4_text: "Si les règles de rôle sur `/runs/{id}/approval` restent implicites, une seule session suppose *tout utilisateur connecté* et écrit des tests verts pour son hypothèse."
highbay_with_title: "Avec Highbay"
highbay_with_suite: "Guide partagé · contrat compilé · vérification séparée"
highbay_with_row_1_title: "Structure de service standardisée"
highbay_with_row_1_text: "Chaque service démarre avec la même organisation et des conventions intégrées pour l’authentification, les traces, les streams et les workers."
highbay_with_row_2_title: "Modifiez un contrat, compilez les quatre"
highbay_with_row_2_text: "`highbay gen` régénère HTTP, schémas MCP et OpenAPI 3 sans tokens modèle ; la compilation signale les gestionnaires obsolètes."
highbay_with_row_3_title: "Bornes et portes d’approbation compilées"
highbay_with_row_3_text: "`Inject(\"org_id\")` fournit les labels d’exécution de confiance (les gestionnaires vérifient l’accès tenant), `BoundedResult` + limites de page bornent les curseurs et `Confirmation` suspend `rollback_production` (durablement avec Temporal)."
highbay_with_row_4_title: "Change Card + copie de tests séparée"
highbay_with_row_4_text: "Vous confirmez les règles staging vs prod sur une **Change Card** d’une page, et un second agent vérifie `viewer → 403`."
