chorus_example_heading: "Trois agents, du prompt à la relecture croisée"
chorus_example_intro: "Tâche inventée, sortie réelle de Chorus. Scénario passkey scénarisé avec sortie d’outils Chorus capturée et estimation des tokens par message (`-wait 30s` ; la skill utilise `-wait 24h` par défaut) ; les repères 1–4 correspondent à `chorus ui` ci-dessous."
chorus_role_lead: "Claude Code · pilote et implémente T1"
chorus_role_docs: "Gemini · documentation et SDK TypeScript (T3)"
chorus_role_review: "Codex · tests -race et relecture de diff (T2)"
chorus_marker: "Repère"
chorus_tokens: "tokens"
chorus_claude_pins: "Claude épingle le plan commun dans `#auth` :"
chorus_codex_sends: "Codex prend T2 (`verify_test.go`), puis relit `a41c9e2` de Claude :"
chorus_example_outcome: "Résultat : T1 relu par Codex avec `go test -race` au vert (#auth#9) ; T1 et T3 fusionnés (#auth#11)."
chorus_raw_toggle: "Afficher la sortie complète enregistrée de chorus watch et les mesures de tokens"
chorus_dashboard_alt: "Le tableau de bord Chorus de la conversation passkey montrant les colonnes des participants, le plan épinglé et la fusion finale."
chorus_dashboard_caption: "La même session `#auth` dans `chorus ui` — les repères 1–4 correspondent aux terminaux ci-dessus, jusqu’à la relecture `#auth#9` et la fusion `#auth#11`."
chorus_tokens_heading: "Zéro token modèle en attente. Messages texte brut en activité."
chorus_cost_wait: "Attendre : modèle à l'arrêt"
chorus_cost_wait_text: "Pendant que `chorus watch` bloque dans une tâche shell d’arrière-plan, `0` token modèle n’est consommé. Seuls un message direct, une `@mention`, une réponse ou l’expiration du délai `-wait` réveillent l’agent."
chorus_cost_wake: "Se réveiller : juste les nouvelles"
chorus_cost_wake_text: "Chorus maintient les curseurs de lecture par agent en mémoire (`pulse/rmap`) et ne livre que les lignes non lues comme `#auth#4 @gemini:` (~16–52 tokens/message dans cette session)."
chorus_cost_send: "Parler : quelques tokens"
chorus_cost_send_text: "`send` renvoie une confirmation de 3 tokens (`sent #auth#3`) accompagnée des réponses non lues en attente pour l’appelant en un seul aller-retour."
chorus_tokens_method: "Estimé sur la session passkey scénarisée ci-dessus à 1,3 token/mot (19 à 77 selon les octets ; 25 à 181 tokens par réveil multi-messages). Le coût total dépend de vos modèles et de la taille de la tâche."
chorus_tokens_method_link: "Voir le script de mesure."
chorus_session_heading: "Détecté en relecture croisée : Chorus construit avec Chorus"
chorus_session_caption: "Codex, l'agent responsable, explique le plan au mainteneur."
chorus_session_result: "Dans `#chorus`, Opus a intégré l’enregistrement des agents à `chorus up` et ajouté `chorus ui`, tandis que Gemini a corrigé le tableau de bord pour afficher les nouveaux participants avant leur premier message. En relisant les deux diffs via Chorus avant fusion, Codex a repéré un bug du parseur `config.toml` où un en-tête de table TOML suivi d’un commentaire pouvait supprimer silencieusement l’URL d’un autre serveur MCP ([commit `62b8181`](https://github.com/goadesign/chorus/commit/62b8181)) — le type d’angle mort qu’un modèle évaluant son propre code laisse régulièrement passer."
chorus_faq_replace_q: "Chorus remplace-t-il mon agent de code ou mon éditeur ?"
chorus_faq_replace_a: "Non. Vos agents restent dans les terminaux et IDE que vous utilisez déjà ; Chorus les connecte via un point de terminaison MCP local unique (`http://localhost:9440/mcp` ou `chorus stdio`)."
chorus_faq_agents_q: "Comment les agents évitent-ils de modifier le même fichier ou de boucler indéfiniment ?"
chorus_faq_agents_a: "Le tableau épinglé par le responsable attribue un seul propriétaire par fichier ou package (en cas de modifications qui se recoupent, lancez les agents dans des git worktrees distincts sur le même `swarm` explicite). `chorus watch` ne se réveille que sur les mentions, réponses et messages directs (`-mentions`), et `chorus down` arrête le serveur local Chorus (Redis persistant et tout processus `chorus stdio` autonome tournent séparément)."
chorus_faq_local_q: "Où vont les messages et quel est le modèle de confiance sur localhost ?"
chorus_faq_local_a: "Par défaut, Chorus écoute sur `127.0.0.1:9440` et stocke les messages dans une instance locale de Redis ou Valkey (`~/.chorus/redis` ou un conteneur local). Comme tout processus tournant sous votre compte utilisateur local peut joindre `127.0.0.1`, gardez les options **YOLO** désactivées lorsque du code local non fiable s’exécute, et configurez `REDIS_PASSWORD` ainsi que des contrôles réseau avant d’utiliser un Redis distant."
chorus_faq_docs_q: "Où trouver la documentation complète sur la CLI, Herdr et l’architecture ?"
chorus_faq_docs_a: "Consultez le [guide Chorus de l’écosystème](../docs/3-ecosystem/chorus/) pour le démarrage rapide en deux minutes, le format des cinq outils MCP, le lanceur Herdr et l’architecture Goa-AI + Pulse, ou parcourez le code source sur [GitHub](https://github.com/goadesign/chorus)."
chorus_wake_messages: "{{ .Count }} messages en un seul réveil"
chorus_nav_goa: "Framework Goa"
chorus_compare_heading: "Comment Chorus se compare"
chorus_compare_ide: "IDE d'agents et lanceurs de worktrees (Orca, Superset, Conductor)"
chorus_compare_ide_text: "Les IDE basés sur des worktrees remplacent votre éditeur pour diffuser un même prompt dans des exécutions solo isolées et comparer des résultats concurrents. Chorus conserve vos éditeurs existants et donne aux agents des `#channels`, un plan épinglé et des messages directs `@agent` pour se répartir une même tâche."
chorus_compare_pty: "Multiplexeurs de terminaux (Herdr, cmux, tmux)"
chorus_compare_pty_text: "Les multiplexeurs hébergent des panneaux CLI dans des PTY. Chorus est le bus de coordination MCP qui tourne *à l’intérieur* — reliant sessions tmux, agents d’IDE (Cursor, Antigravity) et le `chorus-launcher` intégré à Herdr (onglets **Chorus · projet**) au sein d’un même swarm."
chorus_compare_subagents: "Sous-agents intégrés (Claude Code, Codex)"
chorus_compare_subagents_text: "Les sous-agents intégrés lancent des tâches filles au sein d’un seul fournisseur et d’une même famille de modèles. Chorus connecte des sessions paires indépendantes entre Claude, Codex et Gemini afin qu’une seconde famille de modèles relise les diffs avant fusion."
chorus_compare_chat: "Ponts de chat et MCP JSON (Slack, Discord, A2A)"
chorus_compare_chat_text: "Les adaptateurs de chat humain relisent l’historique et renvoient du JSON verbeux à chaque requête. Chorus suit les curseurs de lecture en mémoire, joint les réponses non lues aux appels `send`, reste à 0 token modèle au repos dans `chorus watch` et utilise ~16–52 tokens/message."
chorus_serverdex_alt: "Chorus — référencé sur Serverdex"

highbay_eyebrow: ""
highbay_heading: "Une architecture cohérente sur toute la plateforme que construit votre agent de code."
highbay_heading_second: "Services, serveurs MCP et agents IA — ~70 % du code généré, pas demandé par prompt."
highbay_intro: "Laissés seuls, les agents de code câblent chaque dépôt et fonctionnalité différemment — transformant une plateforme en croissance en services disparates. Votre agent rédige un court contrat ; vous le confirmez. Highbay le compile en serveurs, validations et schémas d’outils — sans modèle dans la boucle. Votre agent n’écrit que les gestionnaires, dans un service Go standard que vos applications Python, TypeScript ou web peuvent appeler."
highbay_hero_point_1: "**Une structure et un guide communs :** Règles partagées pour l’authentification, les traces OpenTelemetry, les flux d’événements et les pools de workers dans chaque dépôt."
highbay_hero_point_2: "**Compilé depuis le contrat :** Serveurs HTTP et MCP, validation des requêtes, schémas d’outils et spécifications OpenAPI 3 (~70 % du code Go hors tests du [service de référence Orders](https://github.com/goadesign/highbay/tree/main/examples/orders))."
highbay_hero_point_3: "**Vérifié avant approbation :** Un second agent de code écrit des tests de scénario depuis votre contrat dans sa propre copie de travail."
highbay_fit_agents: "**Fonctionne dans votre agent :** Enregistre `/highbay` dans Claude Code, Codex, Cursor, Antigravity, Gemini CLI, Windsurf, Copilot et VS Code — sans clé API modèle."
highbay_fit_scope: "**Du Go standard que vous gardez :** Crée de nouveaux services ou étend les projets construits sur le même modèle — gestionnaires dans `internal/`, sans dépendance d’exécution Highbay."
highbay_fit_local: "**Open source et local :** Highbay est sous licence MIT et tourne sur `127.0.0.1` ; chaque service généré est livré en un seul binaire (Temporal ou Redis uniquement si déclarés)."
