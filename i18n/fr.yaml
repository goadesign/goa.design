home_faq_heading: "Avant de commencer"

home_faq_codegen_q: "Pourquoi utiliser Goa si un agent peut écrire le code ?"

home_faq_codegen_a: "Un agent écrit du code par inférence ; Goa dérive le code des contrats du design. Serveurs, clients, codecs et schémas générés sont autant de code que le modèle n’a pas à écrire séparément. Le design concentre le contexte, la structure reste cohérente et le compilateur repère les implémentations incompatibles après une modification. L’agent écrit toujours la logique métier et les tests."

home_faq_difference_q: "Quelle est la différence entre Goa et Goa-AI ?"

home_faq_difference_a: "Goa conçoit et génère les API de services Go : HTTP, gRPC, JSON-RPC, clients, validation et spécifications. Goa-AI étend le même DSL et générateur avec des outils typés, agents IA, complétions structurées, évaluations et serveurs MCP. Il fournit aussi un runtime d’agents et un serveur de registre à héberger. Vous pouvez commencer par l’un ou l’autre ; Goa-AI n’exige pas de service Goa déployé séparément."

home_faq_tokens_q: "Comment la génération réduit-elle le travail du LLM ?"

home_faq_tokens_a: "Goa génère le code de transport et des contrats sans demander au LLM de composer ces fichiers. Une catégorie de travail en tokens de sortie disparaît. L’économie totale dépend de la tâche, du modèle, du contexte et des itérations : comparez des changements complets, tests et revue inclus, pour mesurer l’effet dans votre projet."

home_faq_mcp_q: "Puis-je utiliser Goa-AI uniquement pour créer un serveur MCP ?"

home_faq_mcp_a: "Oui. Ajoutez des déclarations MCP à un service Goa pour générer un serveur exposant outils, ressources et modèles de prompts. Implémentez les méthodes derrière les adaptateurs générés. Aucun agent Goa-AI n’est nécessaire pour servir MCP."

