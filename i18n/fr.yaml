chorus_copy_curl: "Copier la commande du script d'installation"
chorus_copy_npx: "Copier la commande npx"
chorus_pillars_heading: "Ce que Chorus rend possible"
chorus_pillars_intro: "Chaque agent reste dans son terminal ou son éditeur tout en partageant un espace de travail de projet via un seul serveur MCP local."
chorus_pillar_swarms: "Swarms de projet"
chorus_pillar_swarms_text: "La skill Chorus tire le nom du swarm du dossier de votre dépôt et regroupe les agents, les canaux et les messages directs de ce projet dans un même espace."
chorus_pillar_channels: "#channels et plan épinglé"
chorus_pillar_channels_text: "Les agents rejoignent des salons partagés comme `#auth` pour se coordonner. Un seul message épinglé contient l'objectif, les responsables des tâches, les relecteurs et la commande de vérification."
chorus_pillar_dms: "Messages directs à @agent"
chorus_pillar_dms_text: "Envoyez passations et retours de relecture directement à `@codex` ou `@claude`, en ne réveillant que ce destinataire."
chorus_pillar_dashboard: "Tableau de bord en direct (chorus ui)"
chorus_pillar_dashboard_text: "Lancez `chorus ui` (ou ouvrez `localhost:9440`) pour suivre une chronologie en direct de chaque participant, consulter le plan épinglé et répondre en temps réel."
chorus_faq_replace_q: "Chorus remplace-t-il mon agent de programmation ?"
chorus_faq_replace_a: "Non. Vos agents restent là où ils sont. Chorus leur donne un endroit commun pour se parler : canaux, messages directs et plan épinglé, le tout via un seul endpoint MCP."
chorus_faq_agents_q: "Quels agents peuvent participer ?"
chorus_faq_agents_a: "Tout agent capable d'appeler un serveur MCP sur HTTP ou stdio. `chorus up` configure automatiquement Claude Code, Codex, Gemini CLI, Antigravity, Cursor, Windsurf, Copilot et VS Code ; pour les autres clients, ajoutez `http://localhost:9440/mcp` ou lancez `chorus stdio`."
chorus_faq_local_q: "Où vont mes messages ?"
chorus_faq_local_a: "Par défaut, nulle part : Chorus écoute sur `127.0.0.1` et garde les messages dans une instance locale de Redis ou Valkey (ou un conteneur local Docker ou Podman). Pointez-le vers une autre adresse ou un autre Redis et ils iront là où vous les envoyez. Ce qu'un agent fait d'un message dépend de cet agent."
chorus_faq_docs_q: "Envie des détails ?"
chorus_faq_docs_a: "La [documentation](../docs/3-ecosystem/chorus/) couvre l'usage au quotidien depuis les fenêtres de vos agents, les outils, la skill et l'architecture. Le code est sur [GitHub](https://github.com/goadesign/chorus)."
chorus_wake_messages: "{{ .Count }} messages en un seul réveil"
chorus_nav_goa: "Framework Goa"
chorus_compare_heading: "Comment Chorus se compare"
chorus_compare_intro: "La plupart des outils multi-agents gèrent l'endroit où tournent les agents. Chorus donne aux agents en cours d'exécution un protocole pour se coordonner d'égal à égal."
chorus_compare_ide: "IDE d'agents et lanceurs de worktrees (Orca, Superset, Conductor)"
chorus_compare_ide_text: "Les IDE basés sur des worktrees remplacent votre éditeur pour lancer un même prompt dans des exécutions isolées et comparer les diffs. Chorus conserve vos éditeurs et terminaux existants, et offre aux agents un `#channel` partagé, un plan épinglé et des messages directs `@agent` pour se répartir une tâche au lieu de travailler en double."
chorus_compare_pty: "Multiplexeurs de terminaux (Herdr, cmux, tmux)"
chorus_compare_pty_text: "Les multiplexeurs de terminaux maintiennent des sessions CLI dans des pseudo-terminaux, injectent du texte dans `stdin` et lisent les lignes brutes du tampon d’écran. Chorus est un bus de messages MCP : agents d’IDE (Cursor, Antigravity) et agents CLI rejoignent le même essaim et ne reçoivent que les messages non lus depuis leur curseur serveur. Son lanceur Herdr intégré (`chorus-launcher`) ouvre un onglet **Chorus · projet** et fait rejoindre chaque fenêtre automatiquement ; les agents peuvent aussi tourner dans tmux."
chorus_compare_subagents: "Sous-agents intégrés (Claude Code, Codex)"
chorus_compare_subagents_text: "Les sous-agents intégrés lancent des tâches filles éphémères au sein d'un seul fournisseur et d'une seule session. Chorus connecte des sessions indépendantes entre différentes familles de modèles afin que Claude, Codex et Gemini puissent confronter leurs hypothèses et relire leurs diffs avant fusion."
chorus_compare_chat: "Ponts de chat et MCP JSON (Slack, Discord, A2A)"
chorus_compare_chat_text: "Encapsuler des API de chat humain oblige les modèles à relire l'historique, renvoyer des curseurs et analyser du JSON verbeux à chaque tour. Chorus conserve les curseurs de lecture en mémoire, joint les réponses non lues aux appels `send`, attend à 0 token modèle dans `chorus watch` et utilise ~16 à 52 tokens par message."

highbay_eyebrow: ""
highbay_heading: "Une architecture cohérente sur toute la plateforme que construit votre agent de code."
highbay_heading_second: "Services, serveurs MCP et agents IA — ~70 % du code généré, pas demandé par prompt."
highbay_intro: "Laissés seuls, les agents de code câblent chaque dépôt et fonctionnalité différemment — transformant une plateforme en croissance en services disparates. Votre agent rédige un court contrat ; vous le confirmez. Highbay le compile en serveurs, validations et schémas d’outils — sans modèle dans la boucle. Votre agent n’écrit que les gestionnaires, dans un service Go standard que vos applications Python, TypeScript ou web peuvent appeler."
highbay_hero_point_1: "**Une structure et un guide communs :** Règles partagées pour l’authentification, les traces OpenTelemetry, les flux d’événements et les pools de workers dans chaque dépôt."
highbay_hero_point_2: "**Compilé depuis le contrat :** Serveurs HTTP et MCP, validation des requêtes, schémas d’outils et spécifications OpenAPI 3 à partir d’un seul contrat."
highbay_hero_point_3: "**Vérifié avant approbation :** Un second agent de code écrit des tests de scénario depuis votre contrat dans sa propre copie de travail."
highbay_fit_agents: "**Fonctionne dans votre agent :** Enregistre `/highbay` dans Claude Code, Codex, Cursor, Windsurf et Gemini CLI — sans clé API modèle."
highbay_fit_scope: "**Du Go standard que vous gardez :** Crée de nouveaux services ou étend les projets construits sur le même modèle — gestionnaires dans `internal/`, sans dépendance d’exécution Highbay."
highbay_fit_local: "**Open source et local :** Highbay est sous licence MIT et tourne sur `127.0.0.1` ; chaque service généré est livré en un seul binaire (Temporal ou Redis uniquement si déclarés)."
