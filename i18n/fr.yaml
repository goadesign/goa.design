highbay_walkthrough_heading: "Une structure. Des contrats compilés. Des frontières appliquées."
highbay_walkthrough_intro: "Chaque service partage `design/`, `gen/`, `internal/` et `eval/` afin que développeurs et agents passent d’un dépôt à l’autre sans réapprendre les conventions."
highbay_role_guide: "1. Contrat · design/"
highbay_role_guide_caption: "Rédigé par votre agent, confirmé par vous :"
highbay_card_choice: "Définit les API, outils MCP, l’architecture (`design/model.go`) et les flux exécutables (`design/story.go`)."
highbay_role_codegen: "2. Généré · gen/"
highbay_role_codegen_caption: "Compilé par [Goa](/fr/) et [Goa-AI](/fr/docs/2-goa-ai/) (générateurs Go open source) — jamais modifié à la main :"
highbay_codegen_check: "Produit interfaces typées, serveurs HTTP/MCP, spécifications OpenAPI 3 et `AGENTS_QUICKSTART.md` ; les gestionnaires résident dans `internal/`."
highbay_role_tests: "3. Vérification séparée · eval/"
highbay_role_tests_caption: "Écrite dans une copie `.highbay-tests` distincte à partir de votre accord :"
highbay_builder_check: "Highbay rejette les rapports modifiant des fichiers hors d’`eval/` ainsi que les commits du bâtisseur altérant `design/` ou les tests."
highbay_cap_kicker: ""
highbay_cap_heading: "Modèles intégrés pour l’infrastructure de production"
highbay_cap_intro: "Les services HTTP et MCP sans état tournent en un seul binaire ; lorsqu’ils sont déclarés, `highbay://golden-path` donne aux agents une façon unique de câbler :"
highbay_cap_auth_title: "Authentification et identité ([Goa](/fr/) · sans état)"
highbay_cap_auth_body: "Validation JWT, OAuth2 et clés API en bordure avec principaux vérifiés dans un `context.Context` typé."
highbay_cap_obs_title: "Observabilité et journaux ([Clue](/fr/docs/3-ecosystem/clue/) · OpenTelemetry)"
highbay_cap_obs_body: "Traces et métriques OpenTelemetry, journaux tamponnés émis en cas d’erreur et sondes `/healthz`."
highbay_cap_stream_title: "Streams, files et workers ([Pulse](/fr/docs/3-ecosystem/pulse/) · Redis)"
highbay_cap_stream_body: "Redis Streams typés, pools de workers à hachage cohérent avec bascule et tables distribuées de limitation de débit."
highbay_cap_durable_title: "Agents et workflows durables ([Goa-AI](/fr/docs/2-goa-ai/) · Temporal)"
highbay_cap_durable_body: "Adaptateurs Anthropic, OpenAI, Bedrock, Vertex et passerelles, plafonds `RunPolicy`, pauses `Confirmation` tolérantes aux pannes et budgets de prompt à l’exécution ([`TestSeededPayloadBloatFailsTheBudget`](https://github.com/goadesign/highbay/blob/main/examples/orders-eval/acceptance/acceptance_test.go#L36-L60))."
highbay_proof_codegen_title: "~70 % généré ([inspecter `gen/`](https://github.com/goadesign/highbay/tree/main/gen))"
highbay_proof_codegen_body: "Mesuré sur les propres services de Highbay, `gen/` représente ~70 % du code Go hors tests sans sortie LLM."
highbay_proof_playbook_title: "Guide en 12 sections ([`GOLDEN_PATH.md`](https://github.com/goadesign/highbay/blob/main/internal/goldenpath/GOLDEN_PATH.md))"
highbay_proof_playbook_body: "Servi via MCP (`highbay://golden-path`) pour que Claude, Codex et Gemini suivent un même standard d’un dépôt à l’autre."
highbay_proof_suite_title: "Vérification pannes et rôles ([`orders-eval`](https://github.com/goadesign/highbay/tree/main/examples/orders-eval/acceptance))"
highbay_proof_suite_body: "Les suites de référence envoient `SIGKILL` aux workers en cours d’exécution, redémarrent l’API pendant une approbation en attente et rejettent les appels non autorisés (`403`)."
highbay_compare_heading: "Comment Highbay se situe"
highbay_compare_intro: "Ce qui distingue les workflows d’agents de code et les frameworks d’agents."
highbay_compare_solo: "Mode Plan seul et .cursorrules"
highbay_compare_solo_text: "Le mode plan et les règles Markdown clarifient l’intention initiale, mais les conventions en prose dérivent au fil des PR et une seule session juge toujours son propre code."
highbay_compare_speckit: "SDK d’agents Python/TS (LangGraph, Agents SDK)"
highbay_compare_speckit_text: "Les SDK orientés code câblent les chaînes dans le code applicatif ; Highbay compile d’abord les contrats HTTP, OpenAPI 3 et MCP et associe un vérificateur séparé."
highbay_compare_workspaces: "Lanceurs de worktrees parallèles"
highbay_compare_workspaces_text: "Les lanceurs parallèles exécutent un même prompt sur des branches concurrentes à comparer à la main ; Highbay coordonne un bâtisseur et un rédacteur de tests sur un même contrat."
highbay_faq_scope_q: "Comment Highbay s’intègre-t-il aux dépôts existants, à gRPC et aux flux PR/CI ?"
highbay_faq_scope_a: "Highbay initialise de nouveaux services (appelables en HTTP, OpenAPI 3 ou MCP depuis Python, TypeScript, Go ou le web) ou étend des dépôts Goa existants ; il ne convertit pas d’autres routeurs sur place. `highbay gen` refuse `GRPC` (`protoc` n’est pas embarqué ; `goa gen` autonome prend en charge gRPC), et les commits approuvés peuvent être fusionnés directement ou sur une branche de PR pour la CI."
highbay_faq_holdouts_q: "Qu’est-ce qui empêche le bâtisseur de modifier le contrat ou les tests ?"
highbay_faq_holdouts_a: "Highbay écrase `design/` depuis votre révision confirmée lors de la génération et rejette les commits qui altèrent `design/` ou les tests écrits dans `eval/`. Des évaluateurs externes (`highbay verification set`) peuvent aussi exécuter des scénarios holdout masqués."
highbay_faq_local_q: "Highbay nécessite-t-il un compte cloud ou une clé API modèle ?"
highbay_faq_local_a: "Ni l’un ni l’autre : les agents utilisent leurs connexions CLI existantes, et les scénarios `eval/` utilisent des doublures de modèles scénarisées (`0` clé API externe sauf test d’appels en direct)."
highbay_faq_sandbox_q: "Comment les processus locaux et les permissions sont-ils encadrés ?"
highbay_faq_sandbox_a: "Des jetons MCP par rôle réservent la confirmation, l’approbation et la fusion à l’utilisateur, et les contrôles du bâtisseur tournent dans un conteneur Docker Linux local. Les agents et binaires candidats s’exécutent comme des processus ordinaires sous votre compte utilisateur (pas un bac à sable VM) ; voir le [guide de l’écosystème](../docs/3-ecosystem/highbay/#architecture)."
highbay_bottom_heading: "Construisez votre premier service"
highbay_bottom_intro: "Lancez l’installation une fois, ouvrez un nouveau dossier de service dans votre agent de code et invoquez `/highbay`."
