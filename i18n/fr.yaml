home_mcp_result_client: "Clients typés"
home_mcp_result_client_text: "Invoquez des outils MCP et lisez des ressources via les méthodes Go générées."
home_mcp_result_schemas: "Schémas des outils"
home_mcp_result_schemas_text: "Schémas JSON d’entrée et de sortie dérivés de `LookupPayload`."
home_mcp_result_validation: "Validation et codecs"
home_mcp_result_validation_text: "Rejetez les arguments malformés avec des indices de correction avant votre gestionnaire."
home_mcp_humans: "Un contrat à relire"
home_mcp_humans_text: "Vérifiez les types et la sécurité dans `design/catalog.go`, implémentez `Lookup` une fois et régénérez `gen/` quand les règles évoluent."
home_mcp_llms: "Un périmètre clair pour les agents de code"
home_mcp_llms_text: "Votre agent de code modifie `design/` et `internal/` tandis que `gen/` reste en lecture seule, transformant tout écart en erreur Go."
home_mcp_capabilities: "Prend en charge les serveurs de ressources OAuth, les saisies interactives, les Tasks durables, les MCP Apps et les Skills."

home_registry_heading: "Hébergez un registre pour vos outils."
home_registry_text: "Publiez vos toolsets sur une passerelle en cluster via Redis et [Pulse](/fr/docs/3-ecosystem/pulse/) pour charger les schémas à la demande."
home_registry_cta: "Héberger un registre d’outils"
home_registry_flow: "Les fournisseurs d’outils se connectent aux agents via un registre"
home_registry_node: "Votre registre d’outils"
home_registry_node_text: "Découvrir les schémas · Router les appels · Suivre la santé"
home_registry_consumers: "Vos agents et applications"

home_compare_heading: "Comment Goa et Goa-AI se situent"
home_compare_specs: "Chaînes d’outils Protobuf et OpenAPI (buf/Connect, oapi-codegen)"
home_compare_specs_text: "`buf` cible `.proto` et `oapi-codegen` cible YAML. Goa compile HTTP, gRPC, JSON-RPC, OpenAPI 3.2 et les toolsets MCP depuis un seul package Go."
home_compare_mcp_sdk: "SDK MCP Go câblés à la main (go-sdk, mcp-go)"
home_compare_mcp_sdk_text: "Les gestionnaires à tags de structs dupliquent les règles de votre API. Ajouter `MCP(...)` réutilise les mêmes types validés et gestionnaires."
home_compare_agent_sdk: "SDK d’agents Python/TS (LangGraph, OpenAI Agents SDK)"
home_compare_agent_sdk_text: "Goa-AI compile des codecs Go typés, le contexte injecté, les portes d’approbation et les activités Temporal dans un binaire Go statique."

home_faq_heading: "Questions avant de commencer"
home_faq_codegen_q: "Puis-je adopter Goa progressivement et dois-je versionner gen/ ?"
home_faq_codegen_a: "Oui aux deux. `goa gen` produit du code standard `net/http` et `google.golang.org/grpc` à monter à côté de vos routes existantes et versionner dans `gen/`."
home_faq_difference_q: "Comment appeler Goa hors Go, et quand ajouter Goa-AI ?"
home_faq_difference_a: "TypeScript, Python et le mobile consomment les spécifications OpenAPI 3.2 et `.proto` générées. Ajoutez Goa-AI pour exposer MCP ou des agents produit."
home_faq_tokens_q: "Quand Goa n’est-il pas adapté, et comment l’évaluer ?"
home_faq_tokens_a: "Évitez Goa pour les scripts jetables. Sur un vrai service, comparez une fonctionnalité complète à partir de la [visite guidée du catalogue](/fr/docs/ai-development/#one-design-two-entry-points)."
home_faq_mcp_q: "Puis-je utiliser Goa-AI uniquement pour exposer un serveur MCP ?"
home_faq_mcp_a: "Oui. Ajoutez `MCP(...)` et `Tool(...)` à un service Goa pour générer les schémas JSON et les gestionnaires HTTP Streamable sans boucle d’agent."

