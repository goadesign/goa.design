highbay_contrast_heading: "Sans Highbay vs. avec Highbay"
highbay_solo_title: "Agent en roue libre"
highbay_with_title: "Avec Highbay"
highbay_solo_row_1_title: "Câblage différent dans chaque dépôt"
highbay_solo_row_1_text: "Chaque session choisit son propre routeur, middleware d’auth et format d’erreur."
highbay_with_row_1_title: "Même architecture Go dans chaque dépôt"
highbay_with_row_1_text: "Des règles intégrées standardisent l’authentification, le traçage, les erreurs et la structure dans chaque service."
highbay_solo_row_2_title: "Quatre fichiers par modification"
highbay_solo_row_2_text: "Un nouveau champ impose d’éditer à la main gestionnaires, validateurs, OpenAPI et JSON MCP."
highbay_with_row_2_title: "Modifiez le contrat une fois"
highbay_with_row_2_text: "`highbay gen` recompile serveurs, spécifications et schémas avec zéro token."
highbay_solo_row_3_title: "L’agent note ses propres suppositions"
highbay_solo_row_3_text: "Une seule session invente des règles d’accès et écrit des tests qui les valident."
highbay_with_row_3_title: "Contrat verrouillé et testeur séparé"
highbay_with_row_3_text: "Highbay rejette toute modification du contrat ou des tests par le bâtisseur, et un second agent vérifie les handlers dans son propre worktree."
highbay_walkthrough_heading: "Dans chaque dépôt"
highbay_walkthrough_intro: "Votre contrat, le code serveur généré et les tests d’acceptation vivent dans des paquets Go distincts, comme dans l’[exemple Orders](https://github.com/goadesign/highbay/tree/main/examples/orders)."
highbay_role_guide: "1. Contrat dans design/"
highbay_role_guide_caption: "Votre agent rédige les types de requête, l’isolation client et les règles d’approbation humaine ; vous les confirmez."
highbay_role_codegen: "2. Go généré dans gen/"
highbay_role_codegen_caption: "Compile serveurs HTTP et MCP, spécifications OpenAPI, validation et pagination avec zéro token."
highbay_role_tests: "3. Tests de scénario dans eval/"
highbay_role_tests_caption: "Un second agent écrit des tests d’acceptation dans un worktree Git séparé que le bâtisseur ne peut pas modifier."
highbay_cap_heading: "Ce que câble le playbook Go intégré"
highbay_cap_intro: "Les agents suivent une même base Go de production et ajoutent Redis ou Temporal uniquement quand une fonctionnalité l’exige."
highbay_cap_auth_title: "Authentification et isolation des clients"
highbay_cap_auth_body: "Valide JWT, OAuth2 et clés API sur la passerelle et lie côté serveur l’identifiant client pour empêcher toute usurpation via le prompt."
highbay_cap_obs_title: "Traçage, métriques et sondes de santé"
highbay_cap_obs_body: "Instrumente les appels HTTP, gRPC et modèles avec des traces OpenTelemetry, des journaux structurés et des sondes de disponibilité dès le premier commit."
highbay_cap_stream_title: "Flux d’événements et limites de débit"
highbay_cap_stream_body: "Partage limites de débit de tokens, flux d’événements et pools de workers sur Redis lorsque votre service dépasse une instance."
highbay_cap_durable_title: "Approbations humaines et exécutions durables"
highbay_cap_durable_body: "Plafonne les appels d’outils et les réponses volumineuses, suspend les actions sensibles jusqu’à validation humaine et reprend les tâches longues après redémarrage."
