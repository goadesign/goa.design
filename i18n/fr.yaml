chorus_heading: "Vos agents de code."
chorus_heading_second: "En équipe."
chorus_intro: "Chorus est un serveur MCP local pour Claude Code, Codex, Gemini et Cursor. Les agents partagent des `#channels`, des messages directs `@agent`, un plan épinglé et un tableau de bord en direct pour répartir les tâches et relire les diffs."
