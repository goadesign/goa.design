home_benefits_heading: "Pourquoi la génération sur contrat"
home_benefit_tokens: "54 lignes de DSL → 57 fichiers générés"
home_benefit_tokens_text: "Dans la [visite guidée du catalogue](/fr/docs/ai-development/#one-design-two-entry-points), 54 lignes de `design/catalog.go` compilent plus de 5 000 lignes de transports Go, OpenAPI, Protobuf et schémas d’outils en zéro token LLM."
home_benefit_context: "Un seul contrat à charger dans le contexte"
home_benefit_context_text: "Types, validations et routes vivent dans `design/*.go`. Votre agent lit un seul contrat au lieu de parcourir quatre couches manuelles."
home_benefit_feedback: "Les erreurs de compilation détectent immédiatement les écarts"
home_benefit_feedback_text: "Modifiez `design/` et relancez `goa gen`. Go signale chaque gestionnaire, client et outil dont la signature a changé."

home_frameworks_heading: "Goa pour les services. Goa-AI pour les agents et MCP."
home_service_title: "Un contrat. Tous les transports."
home_service_text: "Déclarez une fois vos charges utiles, validations et erreurs en Go. Générez des serveurs `net/http` standard, gRPC et JSON-RPC, des clients typés et les spécifications OpenAPI 3 / Protobuf."
home_service_docs: "Découvrir Goa"
home_service_transports: "Serveurs, clients Go typés et clients CLI compilés depuis une même conception."
home_service_streams: "Streaming intégré à la conception"
home_service_contracts: "Validation en bordure de transport"
home_service_contracts_text: "Champs requis, motifs, plages de valeurs, codes d’état d’erreur, OpenAPI 3.2 et Protocol Buffers."

home_agent_title: "Agents typés, serveurs MCP et exécutions durables."
home_agent_text: "Créez des agents IA outillés et des serveurs MCP avec le même DSL Go. Testez localement en mémoire, puis exécutez sur OpenAI, Anthropic, Bedrock, Vertex AI ou Temporal."
home_agent_docs: "Découvrir Goa-AI"
home_agent_contracts: "Validation de service et contexte masqué"
home_agent_contracts_text: "Liez vos méthodes Goa en outils (`BindTo`), injectez les ID de tenant côté serveur (`Inject`) et plafonnez les pages (`BoundedResult`)."
home_agent_composition: "Arbres multi-agents et évaluations déterministes"
home_agent_composition_text: "Composez des agents enfants à budget borné et testez leurs trajectoires de façon déterministe sans appels LLM réels."
home_agent_execution: "Portes d’approbation, streaming et MCP autonome"
home_agent_execution_text: "Mettez en pause les outils sensibles pour approbation humaine (`Confirmation`), diffusez des événements typés ou exposez MCP seul."

home_mcp_heading: "Créez des serveurs MCP à partir de vos services."
home_mcp_cta: "Créer un serveur MCP"
home_mcp_caption: "L’expression régulière de LookupPayload est compilée à la fois dans les décodeurs HTTP/gRPC et dans l’inputSchema de tools/list en MCP."
