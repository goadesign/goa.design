# Shared Goa ecosystem presentation
home_heading: "Les agents raisonnent."
home_heading_second: "Goa génère."
home_intro: "Goa est un framework Go qui donne aux agents de code moins de code à écrire et un contrat unique sur lequel raisonner. Compilez une conception Go en serveurs HTTP, gRPC et JSON-RPC, clients typés, validations et spécifications OpenAPI 3, ou utilisez Goa-AI pour créer des agents IA produit, des serveurs MCP et des registres d’outils."
home_hero_point_1: "**Services (`Goa`) :** Compilez un seul `design/*.go` en serveurs `net/http`, gRPC et JSON-RPC, clients typés, validations et OpenAPI 3.2."
home_hero_point_2: "**Agents et MCP (`Goa-AI`) :** Liez vos méthodes en outils typés (`BindTo`), exposez des serveurs MCP et exécutez en mémoire ou sur Temporal."
home_hero_point_3: "**Conçu pour les agents :** Régénérez `gen/` avec zéro token de sortie LLM ; le compilateur Go signale aussitôt tout écart."
