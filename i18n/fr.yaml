home_benefits_heading: "Pourquoi la génération sur contrat surpasse la plomberie écrite à la main"
home_benefit_tokens: "54 lignes de DSL → 57 fichiers générés"
home_benefit_tokens_text: "Dans l’[exemple de référence du catalogue](/fr/docs/ai-development/#one-design-two-entry-points), un fichier `design/catalog.go` de 54 lignes compile plus de 5 000 lignes de transports Go, OpenAPI, Protobuf et schémas JSON d’outils dans `gen/` (versionné dans Git, zéro token de sortie LLM)."
home_benefit_context: "Un seul contrat à charger dans le contexte"
home_benefit_context_text: "Types de données, règles d’expressions régulières et de bornes, descriptions et routes de transport résident dans `design/*.go`. Votre agent de code lit le contrat et l’interface `gen/` au lieu de parcourir quatre couches maintenues à la main."
home_benefit_feedback: "Les erreurs de compilation détectent immédiatement les écarts"
home_benefit_feedback_text: "Modifiez un champ ou une méthode dans `design/` et relancez `goa gen`. Go signale chaque gestionnaire, client et exécuteur d’outil dont la signature ne correspond plus."

home_frameworks_heading: "Goa pour les services. Goa-AI pour les agents et MCP."
home_service_title: "Un contrat. Tous les transports."
home_service_text: "Déclarez une seule fois les charges utiles, validations et erreurs en Go. Générez des serveurs `net/http` standard, gRPC et JSON-RPC, des clients typés et des spécifications OpenAPI 3 / Protobuf — le routage, le décodage et la validation sont du code Go généré, pas un framework piloté par réflexion."
home_service_docs: "Découvrir Goa"
home_service_transports: "Serveurs, clients Go typés et clients CLI compilés depuis la même conception de service."
home_service_streams: "Streaming intégré à la conception"
home_service_contracts: "Validation en bordure de transport"
home_service_contracts_text: "Champs requis, motifs, plages de valeurs, codes d’état d’erreur, OpenAPI 3.2 et Protocol Buffers."

home_agent_title: "Agents typés, serveurs MCP et exécutions durables."
home_agent_text: "Étendez le même DSL Go aux agents IA outillés et aux serveurs MCP. Testez localement en mémoire sans clé API, puis connectez OpenAI, Anthropic, AWS Bedrock ou Google Vertex AI et exécutez durablement sur Temporal."
home_agent_docs: "Découvrir Goa-AI"
home_agent_contracts: "Validation de service et contexte masqué"
home_agent_contracts_text: "Réutilisez vos méthodes Goa comme outils (`BindTo`), masquez au modèle les identifiants de tenant fournis par le serveur (`Inject`) et plafonnez les pages (`BoundedResult`)."
home_agent_composition: "Arbres multi-agents et évaluations déterministes"
home_agent_composition_text: "Composez des agents enfants sous forme d’outils à budget borné et testez leurs trajectoires d’outils de façon déterministe sans appels LLM réels."
home_agent_execution: "Portes d’approbation, streaming et MCP autonome"
home_agent_execution_text: "Mettez en pause les outils sensibles pour approbation humaine (`Confirmation`), diffusez des événements typés vers vos interfaces, ou exposez MCP sans boucle d’agent."

home_mcp_heading: "Créez des serveurs MCP à partir de vos services."
home_mcp_text: "Ajoutez `MCP(...)` à n’importe quel service Goa pour exposer ses méthodes sous forme d’outils MCP validés, de ressources et de modèles de prompts."
home_mcp_cta: "Créer un serveur MCP"
home_mcp_caption: "La règle d’expression régulière de LookupPayload est compilée à la fois dans les décodeurs HTTP/gRPC et dans l’inputSchema de tools/list en MCP."
home_mcp_design: "Votre conception Goa"
home_mcp_generated: "Interface MCP générée"
home_mcp_contract: "Un contrat typé unique"
home_mcp_result_server: "Serveur HTTP"
home_mcp_result_server_text: "Gestionnaires MCP HTTP Streamable reliés directement à vos endpoints Goa."
home_mcp_result_client: "Clients typés"
home_mcp_result_client_text: "Invoquez des outils MCP et lisez des ressources via les méthodes Go générées."
home_mcp_result_schemas: "Schémas des outils"
home_mcp_result_schemas_text: "Schémas JSON d’entrée et de sortie dérivés des mêmes règles `LookupPayload`."
home_mcp_result_validation: "Validation et codecs"
home_mcp_result_validation_text: "Rejetez les arguments malformés du modèle avec des indices de correction avant l’exécution de votre gestionnaire."
home_mcp_humans: "Un contrat à relire"
home_mcp_humans_text: "Vérifiez les types, la validation et la sécurité dans `design/catalog.go`. Implémentez `Lookup` une fois en Go et régénérez `gen/` lorsque les exigences évoluent."
home_mcp_llms: "Un périmètre clair pour les agents de code"
home_mcp_llms_text: "Votre agent de code modifie `design/` et `internal/` tandis que `gen/` reste intouchable, transformant tout écart de schéma en erreur immédiate du compilateur Go."
home_mcp_capabilities: "Prend en charge les serveurs de ressources OAuth, les saisies interactives, les Tasks durables, les MCP Apps et les Skills."

home_registry_heading: "Hébergez un registre pour vos outils."
home_registry_text: "Exécutez le serveur de registre en cluster de Goa-AI comme catalogue partagé et passerelle d’invocation. Les services publient des toolsets, les agents recherchent et chargent les schémas à la demande au lieu d’alourdir chaque prompt, et les appels sont routés vers les fournisseurs sains via Redis et [Pulse](/fr/docs/3-ecosystem/pulse/) (la bibliothèque Goa de flux Redis et de cartes répliquées)."
home_registry_cta: "Héberger un registre d’outils"
home_registry_flow: "Les fournisseurs d’outils se connectent aux agents via un registre"
home_registry_node: "Votre registre d’outils"
home_registry_node_text: "Découvrir les schémas · Router les appels · Suivre la santé"
home_registry_consumers: "Vos agents et applications"

home_compare_heading: "Comment Goa et Goa-AI se situent"
home_compare_specs: "Chaînes d’outils Protobuf et OpenAPI (buf/Connect, oapi-codegen)"
home_compare_specs_text: "`buf` + ConnectRPC génère HTTP/gRPC depuis `.proto` tandis qu’`oapi-codegen` cible OpenAPI YAML. Goa exprime un routage HTTP riche, gRPC, JSON-RPC, OpenAPI 3.2 et des toolsets MCP/agents dans un seul package Go — générant directement en Go le routage et la validation sur `net/http` et `grpc`."
home_compare_mcp_sdk: "SDK MCP Go câblés à la main (go-sdk, mcp-go)"
home_compare_mcp_sdk_text: "Les gestionnaires MCP fondés sur des tags de structs dupliquent les règles de paramètres déjà écrites pour votre API HTTP/gRPC. Ajouter `MCP(...)` et `Tool(...)` à un service Goa réutilise les mêmes types de données validés et la même implémentation de service."
home_compare_agent_sdk: "SDK d’agents Python/TS (LangGraph, OpenAI Agents SDK)"
home_compare_agent_sdk_text: "Les SDK de graphes câblent l’orchestration dans du code applicatif à typage dynamique. Goa-AI compile des codecs d’outils Go typés, le contexte injecté côté serveur, la pagination par curseur, les portes d’approbation et les activités de workflow Temporal dans un unique binaire Go statique."

home_faq_heading: "Questions avant de commencer"
home_faq_codegen_q: "Puis-je adopter Goa progressivement dans un dépôt Go existant, et dois-je versionner gen/ ?"
home_faq_codegen_a: "Oui aux deux. `goa gen` génère des gestionnaires `net/http` standard et des serveurs `google.golang.org/grpc` (sans routeur piloté par réflexion), ce qui permet de monter un service Goa à côté de vos routes Go existantes, d’y brancher des middlewares standard et de versionner `gen/` pour auditer chaque évolution du contrat en revue de code."
home_faq_difference_q: "Comment des clients non-Go appellent-ils un service Goa, et quand ajouter Goa-AI ?"
home_faq_difference_a: "Les clients TypeScript, Python et mobiles consomment directement les spécifications OpenAPI 3.2 et `.proto` générées. Commencez avec Goa pour vos API HTTP/gRPC/JSON-RPC ; ajoutez Goa-AI pour exposer des outils MCP ou exécuter des agents produit (testables localement sans clé API avant de connecter des modèles réels ou Temporal)."
home_faq_tokens_q: "Quand Goa n’est-il pas adapté, et comment l’évaluer ?"
home_faq_tokens_a: "Évitez Goa pour les scripts jetables ou les très petits prototypes où un package `design/` distinct ajoute du cérémonial. Sur des services multi-endpoints ou en équipe avec des agents de code, comparez une vraie fonctionnalité de bout en bout (tokens, diffs de revue et défauts) à partir de la [visite guidée du catalogue](/fr/docs/ai-development/#one-design-two-entry-points)."
home_faq_mcp_q: "Puis-je utiliser Goa-AI uniquement pour exposer un serveur MCP ?"
home_faq_mcp_a: "Oui. Ajoutez les déclarations `MCP(...)` et `Tool(...)` à un service Goa pour générer les schémas JSON `tools/list`, les indices de correction de validation et les gestionnaires HTTP Streamable sans exécuter de boucle d’agent."

home_community_heading: "Bibliothèques compagnes et outils multi-agents"
home_community_intro: "Goa et Goa-AI s’associent à des bibliothèques Go open source pour l’observabilité, les flux d’événements Redis, les diagrammes C4 et le développement multi-agents."
home_ecosystem: "Explorer tous les guides de l’écosystème"
home_examples: "Exemples exécutables"
home_discussions: "GitHub Discussions"
home_contribute: "Guide de contribution"
home_eco_chorus: "Bus de messages MCP local (`#channels`, messages directs `@agent`, plans épinglés et `chorus ui`) permettant à Claude Code, Codex et Gemini de se coordonner d’égal à égal à 0 token au repos."
home_eco_highbay: "Plan de contrôle piloté par contrat qui associe un agent bâtisseur et un agent rédacteur de tests distinct dans des copies de travail séparées avant fusion dans le navigateur."
home_eco_libs: "Flux Redis, pools de workers et cartes répliquées (`Pulse`), traçage OpenTelemetry et journaux vidés sur erreur (`Clue`), et diagrammes d’architecture C4 sous forme de code (`Model`)."

