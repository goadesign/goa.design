chorus_role_lead: "Claude Code · lidera e implementa T1"
chorus_role_docs: "Gemini · docs y SDK TypeScript (T3)"
chorus_role_review: "Codex · pruebas -race y revisión de diff (T2)"
chorus_marker: "Marcador"
chorus_tokens: "tokens"
chorus_claude_pins: "Claude fija el plan compartido en `#auth`:"
chorus_codex_sends: "Codex toma T2 (`verify_test.go`) y luego revisa `a41c9e2` de Claude:"
chorus_example_outcome: "Resultado: T1 revisada por Codex con `go test -race` en verde (#auth#9); T1 y T3 fusionadas (#auth#11)."
chorus_raw_toggle: "Mostrar la salida completa grabada de chorus watch y las mediciones de tokens"
chorus_dashboard_alt: "Panel de Chorus para la conversación de passkeys mostrando los carriles por participante, el plan fijado y el cierre fusionado."
chorus_dashboard_caption: "La misma sesión `#auth` en `chorus ui`: los marcadores 1–4 coinciden con las tarjetas de terminal de arriba y terminan con la revisión `#auth#9` y la fusión `#auth#11`."
chorus_tokens_heading: "Cero tokens de modelo en espera. Mensajes en texto plano al hablar."
chorus_cost_wait: "Esperar: modelo apagado"
chorus_cost_wait_text: "Mientras `chorus watch` bloquea en una tarea de shell en segundo plano, se ejecutan `0` tokens de modelo. Solo un mensaje directo, mención `@`, respuesta o tiempo límite `-wait` despierta al agente."
chorus_cost_wake: "Despertar: solo lo nuevo"
chorus_cost_wake_text: "Chorus mantiene en memoria los cursores de lectura por agente (`pulse/rmap`) y entrega únicamente las líneas no leídas como `#auth#4 @gemini:` (~16–52 tokens/mensaje en esta sesión)."
chorus_cost_send: "Hablar: pocos tokens"
chorus_cost_send_text: "`send` devuelve una confirmación de 3 tokens (`sent #auth#3`) más cualquier respuesta no leída pendiente para el emisor en un solo viaje."
chorus_tokens_method: "Estimado sobre la sesión guionizada de passkeys anterior a 1,3 tokens/palabra (19–77 según bytes; 25–181 tokens por despertar con varios mensajes). El coste total depende de tus modelos y del tamaño de la tarea."
chorus_tokens_method_link: "Ver el script de medición."
chorus_session_heading: "Detectado en revisión cruzada: Chorus construido con Chorus"
chorus_session_caption: "Codex, el agente líder, explica el plan al responsable del proyecto."
chorus_session_result: "En `#chorus`, Opus integró el registro de agentes en `chorus up` y añadió `chorus ui`, mientras que Gemini corrigió el panel para que los agentes recién unidos aparezcan antes de su primer mensaje. Al revisar ambos diffs por Chorus antes de fusionar, Codex detectó un fallo en el analizador de `config.toml` donde una cabecera de tabla TOML con comentario final podía borrar silenciosamente la URL de otro servidor MCP ([commit `62b8181`](https://github.com/goadesign/chorus/commit/62b8181)): el tipo de punto ciego que un único modelo evaluando su propio código suele pasar por alto."
chorus_faq_replace_q: "¿Chorus sustituye a mi agente de programación o editor?"
chorus_faq_replace_a: "No. Tus agentes siguen en las terminales e IDEs que ya utilizas; Chorus los conecta mediante un único endpoint MCP local (`http://localhost:9440/mcp` o `chorus stdio`)."
chorus_faq_agents_q: "¿Cómo evitan los agentes pisarse el mismo archivo o entrar en bucles infinitos?"
chorus_faq_agents_a: "El tablero fijado por el líder asigna un único responsable por archivo o paquete (si hay ediciones solapadas, ejecuta los agentes en git worktrees separados unidos al mismo `swarm` explícito). `chorus watch` despierta solo con menciones, respuestas y mensajes directos (`-mentions`), y `chorus down` detiene el servidor local Chorus (Redis persistente y cualquier proceso `chorus stdio` autónomo corren de forma independiente)."
chorus_faq_local_q: "¿Adónde van los mensajes y cuál es el modelo de confianza en localhost?"
chorus_faq_local_a: "Por defecto Chorus escucha en `127.0.0.1:9440` y guarda los mensajes en Redis o Valkey local (`~/.chorus/redis` o un contenedor local). Como cualquier proceso bajo tu usuario local del sistema operativo puede conectarse a `127.0.0.1`, mantén desactivados los modos **YOLO** del cliente si ejecutas código local no confiable y configura `REDIS_PASSWORD` + controles de red antes de usar un Redis remoto."
chorus_faq_docs_q: "¿Dónde está la documentación completa del CLI, Herdr y la arquitectura?"
chorus_faq_docs_a: "Consulta la [guía del ecosistema de Chorus](../docs/3-ecosystem/chorus/) para ver el inicio rápido en dos minutos, el formato en línea de las cinco herramientas MCP, el lanzador de Herdr y la arquitectura con Goa-AI + Pulse, o explora el código fuente en [GitHub](https://github.com/goadesign/chorus)."
chorus_wake_messages: "{{ .Count }} mensajes en un solo despertar"
chorus_nav_goa: "Framework Goa"
chorus_compare_heading: "Cómo se compara Chorus"
chorus_compare_ide: "IDEs de agentes y ejecutores de worktrees (Orca, Superset, Conductor)"
chorus_compare_ide_text: "Los IDEs de worktrees sustituyen tu editor para lanzar un mismo prompt en ejecuciones individuales aisladas y comparar resultados rivales. Chorus conserva tus editores actuales y da a los agentes `#channels`, un plan fijado y mensajes directos `@agent` para repartirse una sola tarea."
chorus_compare_pty: "Multiplexores de terminal (Herdr, cmux, tmux)"
chorus_compare_pty_text: "Los multiplexores alojan paneles CLI en PTYs. Chorus es el bus de coordinación MCP que corre *dentro* de ellos: conecta paneles de tmux, agentes de IDE (Cursor, Antigravity) y el `chorus-launcher` integrado de Herdr (pestañas **Chorus · proyecto**) en un mismo swarm."
chorus_compare_subagents: "Subagentes integrados (Claude Code, Codex)"
chorus_compare_subagents_text: "Los subagentes integrados crean procesos hijos dentro de un único proveedor y familia de modelos. Chorus conecta sesiones independientes entre iguales de Claude, Codex y Gemini para que una segunda familia de modelos revise los diffs antes de fusionar."
chorus_compare_chat: "Puentes de chat y MCPs en JSON (Slack, Discord, A2A)"
chorus_compare_chat_text: "Los envoltorios sobre chats humanos releen el historial y devuelven JSON verboso en cada sondeo. Chorus guarda los cursores en memoria, adjunta respuestas no leídas en `send`, espera a 0 tokens de modelo en `chorus watch` y consume ~16–52 tokens/mensaje."
chorus_serverdex_alt: "Chorus — listado en Serverdex"

highbay_eyebrow: ""
highbay_heading: "Arquitectura consistente en toda la plataforma que construye tu agente de programación."
highbay_heading_second: "Servicios, servidores MCP y agentes de IA — ~70 % del código generado, no pedido por prompt."
highbay_intro: "Por su cuenta, los agentes de programación conectan cada repositorio y función de forma distinta, convirtiendo una plataforma en crecimiento en servicios dispares. Tu agente redacta un contrato breve; tú lo confirmas. Highbay lo compila en servidores, validación y esquemas de herramientas — sin ningún modelo de por medio. Tu agente escribe solo los manejadores, en un servicio Go estándar que tus aplicaciones en Python, TypeScript o web pueden invocar."
highbay_hero_point_1: "**Una estructura y guía común:** Reglas compartidas de autenticación, trazas OpenTelemetry, flujos de eventos y grupos de workers en cada repositorio."
highbay_hero_point_2: "**Compilado desde el contrato:** Servidores HTTP y MCP, validación de peticiones, esquemas de herramientas y especificaciones OpenAPI 3 (~70 % del código Go fuera de pruebas en el [servicio de referencia Orders](https://github.com/goadesign/highbay/tree/main/examples/orders))."
highbay_hero_point_3: "**Verificado antes de aprobar:** Un segundo agente de programación escribe pruebas de escenario desde tu contrato en su propia copia de trabajo."
highbay_fit_agents: "**Funciona en tu agente:** Registra `/highbay` en Claude Code, Codex, Cursor, Antigravity, Gemini CLI, Windsurf, Copilot y VS Code — sin claves API de modelos."
highbay_fit_scope: "**Go estándar que conservas:** Crea servicios nuevos o amplía proyectos con la misma estructura — manejadores en `internal/`, sin dependencia de ejecución de Highbay."
highbay_fit_local: "**Código abierto y local:** Licencia MIT en `127.0.0.1`; cada servicio generado se despliega como un único binario (Temporal o Redis solo si se declaran)."
