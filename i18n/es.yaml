highbay_approve_pin_2: "**Flujos y sus pruebas:** Asocia cada flujo `Story` terminado (`instant_credit`, `manager_review`) con su resultado."
highbay_approve_pin_3: "**Informe por commit exacto:** Ejecuta el commit de pruebas aceptado contra el commit del constructor (`3 de 3` en este ejemplo)."
highbay_approve_alt: "Vista Approve de Highbay con los escenarios Story superados, cobertura declarada, aprobación registrada y el botón Merge into current branch."
