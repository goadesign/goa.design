highbay_showcase_method: "Cómo se generan estas capturas"
highbay_walkthrough_heading: "El acuerdo es código"
highbay_walkthrough_intro: "Lo que acordaste se convierte en tres pequeñas piezas de Go: el mismo pedido de `$48.00 + $4.32` y los mismos números."
highbay_role_guide: "Los flujos · design/story.go"
highbay_role_guide_caption: "Redactado por tu agente junto al diseño Goa y confirmado por ti:"
highbay_card_choice: "Todo flujo finalizado en `Story` debe tener una prueba de escenario correspondiente para que un build cuente."
highbay_role_tests: "La prueba · test writer"
highbay_role_tests_caption: "Escrita en una copia de trabajo separada a partir de tu respuesta confirmada:"
highbay_tests_check: "Highbay compila el módulo de pruebas, comprueba que no se tocó ningún archivo del servicio y bloquea el commit de pruebas."
highbay_role_builder: "La regla · builder"
highbay_role_builder_caption: "Escrita contra los tipos e interfaces generados por Goa:"
highbay_builder_check: "Highbay ejecuta el commit de pruebas aceptado contra el commit del constructor antes de que revises, apruebes y fusiones."
highbay_codegen_heading: "Genera la infraestructura. Gasta tokens en la lógica."
highbay_codegen_intro: "Si un agente escribe enrutadores y esquemas a mano, gasta tokens en un trabajo que Goa puede generar. Highbay integra esa generación en el build acordado."
highbay_codegen_left_title: "Lo que leen y escriben los agentes"
highbay_codegen_zero: "Escrito por el compilador, no un modelo"
highbay_codegen_right_title: "Qué se genera"
highbay_codegen_out_transports: "gen/ del servicio · desde este método"
highbay_codegen_out_transports_text: "Manejador `POST /chat`, cliente tipado, códecs, especificación OpenAPI y comprobaciones `MinLength(1)` / `Required`."
highbay_codegen_out_agents: "Herramientas Goa-AI · cuando se declaran"
highbay_codegen_out_agents_text: "Esquemas JSON de herramientas, enlaces a métodos, campos inyectados por el servidor y declaraciones de confirmación."
highbay_codegen_out_eval: "Arnés de escenarios · eval/"
highbay_codegen_out_eval_text: "Highbay escribe la tabla de flujos obligatorios en `eval/design/` y genera el ejecutor Go en `eval/gen/`."
highbay_codegen_caption: "Tomado del [ejemplo Orders](https://github.com/goadesign/highbay/tree/main/examples/orders) de Highbay. `generate_code` escribe el diseño acordado y reemplaza `gen/` del servicio; Highbay prepara la tabla de escenarios en `eval/` y la verificación rechaza cualquier commit candidato cuyo `design/` difiera del acuerdo."
highbay_codegen_tokens: "Ningún modelo escribe la infraestructura"
highbay_codegen_tokens_text: "Goa escribe los archivos generados sin tokens de salida del modelo, y cada edición parte del diseño y las interfaces relevantes. El ahorro total depende del cambio."
highbay_codegen_consistency: "La misma forma con cualquier modelo"
highbay_codegen_consistency_text: "Los transportes, validaciones y esquemas de herramientas generados tienen la misma estructura tanto si la lógica la escribió Claude como Codex o Gemini."
highbay_codegen_compiler: "Una interfaz cambiada detecta código desfasado"
highbay_codegen_compiler_text: "Cambia el tipo de resultado de un método y regenera: un manejador con el tipo antiguo deja de compilar, y Highbay comprueba aparte que `eval/` compile y liste todos los escenarios obligatorios."
highbay_codegen_cta: "Leer la guía de flujo con agentes de programación"
highbay_compare_heading: "Cómo se compara Highbay"
highbay_compare_intro: "Highbay parte de una sola regla: quien escribe el código no decide si funciona."
highbay_compare_solo: "Un solo agente de programación"
highbay_compare_solo_text: "Una sesión puede planificar, programar y probar, y a menudo basta. El problema es lo que dejaste sin decir: responde esas dudas por su cuenta y después prueba sus propias respuestas. Highbay te las plantea primero, encarga las pruebas de escenario a un segundo agente y ejecuta esas pruebas por sí mismo."
highbay_compare_speckit: "Flujos de especificaciones (Spec Kit, OpenSpec)"
highbay_compare_speckit_text: "Ponen el acuerdo por escrito antes del código, que es el instinto correcto, produciendo especificaciones estructuradas y tareas para el agente. Highbay convierte los flujos acordados y el diseño de API en contratos Go y escenarios obligatorios: el diseño compila, Goa genera las interfaces y esquemas de herramientas, y cada flujo terminado exige una prueba antes de que un build cuente."
highbay_compare_workspaces: "Espacios paralelos de agentes (Conductor y otros)"
highbay_compare_workspaces_text: "Ejecutan varios agentes a la vez en copias aisladas y te entregan sus ramas para revisar. Highbay coordina dos agentes sobre un único cambio acordado con trabajos distintos y te entrega un resultado: los escenarios ejecutados sobre los commits exactos que vas a fusionar."
highbay_compare_summary: "Una decisión confirmada por ti. Transportes y esquemas generados desde Go. Pruebas escritas por otro agente. Un resultado ejecutado por Highbay y vinculado al acuerdo y a ambos commits."
highbay_faq_scope_q: "¿Qué puedo construir con él?"
highbay_faq_scope_a: "Servicios Go y agentes de IA diseñados con Goa y Goa-AI: APIs HTTP y JSON-RPC, servidores MCP y agentes con herramientas tipadas. Otros lenguajes quedan fuera de alcance, y los diseños con transporte gRPC se rechazan hoy."
highbay_faq_tdd_q: "¿Por qué no pedir a un solo agente que escriba primero las pruebas?"
highbay_faq_tdd_a: "Escribir primero las pruebas cambia el orden, no el autor. El mismo agente sigue respondiendo las dudas abiertas y nada le impide retocar una prueba que le estorbe. En Highbay las dudas van a ti, un segundo agente escribe los escenarios en su propia copia y Highbay ejecuta el commit de pruebas aceptado contra el commit del constructor."
highbay_faq_existing_q: "¿Puedo usarlo en un proyecto que ya tengo?"
highbay_faq_existing_a: "Sí, si es un proyecto Goa o Goa-AI con al menos un commit Git. Highbay necesita pruebas que pueda ejecutar: un módulo de pruebas en su formato o tu propio programa de pruebas registrado con `hbay verification set` (que Highbay ejecuta en cada cambio sin iniciar un autor de pruebas)."
highbay_faq_holdouts_q: "¿Puede el constructor leer las pruebas y programar a medida para ellas?"
highbay_faq_holdouts_a: "Puede leer las pruebas que escribió el autor de pruebas; todo se ejecuta en tu máquina. Para la verificación, Highbay selecciona la suite desde el commit de pruebas que aceptó, y el constructor solo aporta su commit de código. Con un evaluador gestionado por separado, las pruebas holdout aparecen en el informe del constructor únicamente como un resultado bajo un nombre anónimo."
highbay_faq_local_q: "¿Necesita una cuenta o una clave de API?"
highbay_faq_local_a: "Ninguna de las dos cosas: sin cuenta, sin clave y sin servicio en la nube. Tus agentes siguen usando sus propias sesiones y suscripciones, y solo añades una clave de proveedor de modelos si tu servicio o sus pruebas llaman a un modelo en vivo."
highbay_faq_sandbox_q: "¿Los agentes se ejecutan en un sandbox?"
highbay_faq_sandbox_a: "No. A partir de Build, los agentes, las pruebas y el servicio que construyen se ejecutan en tu máquina como programas ordinarios con tu acceso a archivos y red. Los roles limitan qué puede hacer cada agente dentro de Highbay: solo tú puedes confirmar, aprobar o fusionar, y la comprobación de compilación y pruebas unitarias del constructor corre en un contenedor Docker local. Lee la [guía de Highbay](../docs/3-ecosystem/highbay/) o explora el código en [GitHub](https://github.com/goadesign/highbay)."
