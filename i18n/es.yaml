highbay_agree_pin_1: "**Change Card:** Resumen en una página de qué cambia y qué permanece intacto, antes de empezar la implementación."
highbay_agree_pin_2: "**Comparación del límite:** Muestra cómo se comporta el pedido de `$48.00 + $4.32` en cada respuesta antes de elegir."
highbay_agree_pin_3: "**Confirmar intención:** Fija tu respuesta y tus ejemplos como acuerdo compartido."
highbay_agree_alt: "Vista Agree de Highbay con la Change Card de reembolsos, la tabla comparativa con y sin impuestos y el botón Confirm intent."
highbay_arch_pin_1: "**Qué declara el diseño:** Dibuja el servicio, el asistente y sus herramientas antes de empezar la implementación."
highbay_arch_pin_2: "**Límites del asistente:** Muestra los ajustes de turnos de recuperación, historial, llamadas a herramientas y tiempo declarados en el agente Goa-AI."
highbay_arch_pin_3: "**Confirmaciones:** Resalta los campos de contexto inyectados y qué herramientas exigen la aprobación de una persona antes de ejecutarse."
