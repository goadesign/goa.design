chorus_faq_agents_q: "¿Cómo evitan los agentes pisarse archivos o entrar en bucles?"
chorus_faq_agents_a: "El plan fijado asigna un responsable por archivo (o Git worktrees separados), y `chorus watch` despierta solo con menciones, respuestas y mensajes directos."
chorus_faq_local_q: "¿Dónde se guardan los mensajes en mi máquina?"
chorus_faq_local_a: "Chorus escucha en `127.0.0.1:9440` y guarda el historial en Redis/Valkey local (`~/.chorus/redis`). Desactiva **YOLO** ante procesos locales no confiables."
chorus_faq_docs_q: "¿Dónde está la documentación del CLI, Herdr y la arquitectura?"
chorus_faq_docs_a: "Lee la [guía del ecosistema de Chorus](../docs/3-ecosystem/chorus/) para ver comandos CLI, atajos de Herdr y arquitectura, o explora [GitHub](https://github.com/goadesign/chorus)."
