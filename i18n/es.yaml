home_benefits_heading: "Por qué generar desde un contrato"
home_benefit_tokens: "54 líneas de DSL → 57 archivos generados"
home_benefit_tokens_text: "En el [recorrido del catálogo](/es/docs/ai-development/#one-design-two-entry-points), 54 líneas en `design/catalog.go` compilan más de 5.000 líneas de transportes Go, OpenAPI, Protobuf y esquemas de herramientas con cero tokens de LLM."
home_benefit_context: "Un único contrato en el contexto"
home_benefit_context_text: "Tipos, validaciones y rutas viven en `design/*.go`. Tu agente lee un solo contrato en lugar de rastrear cuatro capas manuales."
home_benefit_feedback: "El compilador detecta las divergencias al instante"
home_benefit_feedback_text: "Cambia `design/` y ejecuta `goa gen`. Go señala al instante cualquier manejador, cliente o herramienta cuya firma haya cambiado."

home_frameworks_heading: "Goa para servicios. Goa-AI para agentes y MCP."
home_service_title: "Un contrato. Cada transporte."
home_service_text: "Declara entradas, validaciones y errores una vez en Go. Genera servidores `net/http` estándar, gRPC y JSON-RPC, clientes tipados y especificaciones OpenAPI 3 / Protobuf."
home_service_docs: "Explorar Goa"
home_service_transports: "Servidores, clientes Go tipados y clientes CLI compilados desde un único diseño."
home_service_streams: "Streaming integrado en el diseño"
home_service_contracts: "Validación en el borde del transporte"
home_service_contracts_text: "Campos obligatorios, patrones, rangos, códigos de estado de error, OpenAPI 3.2 y Protocol Buffers."

home_agent_title: "Agentes tipados, servidores MCP y ejecuciones duraderas."
home_agent_text: "Crea agentes de IA con herramientas y servidores MCP con el mismo DSL en Go. Prueba en memoria local y ejecuta sobre OpenAI, Anthropic, Bedrock, Vertex AI o Temporal."
home_agent_docs: "Explorar Goa-AI"
home_agent_contracts: "Validación del servicio y contexto oculto"
home_agent_contracts_text: "Vincula métodos Goa como herramientas (`BindTo`), inyecta IDs de tenant en servidor (`Inject`) y acota páginas (`BoundedResult`)."
home_agent_composition: "Árboles multiagente y evaluaciones deterministas"
home_agent_composition_text: "Compón agentes hijos con presupuestos acotados y prueba trayectorias de forma determinista sin llamadas reales al LLM."
home_agent_execution: "Puertas de aprobación, streaming y MCP autónomo"
home_agent_execution_text: "Pausa herramientas sensibles para aprobación humana (`Confirmation`), transmite eventos tipados o expón MCP por separado."

