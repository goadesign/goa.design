home_mcp_humans: "Un contrato para revisar"
home_mcp_humans_text: "Revisa tipos y seguridad en `design/catalog.go`, implementa `Lookup` una vez y regenera `gen/` cuando cambien las reglas."
home_mcp_llms: "Trabajo claro para agentes de programación"
home_mcp_llms_text: "Tu agente de programación edita `design/` e `internal/` mientras `gen/` es de solo lectura, convirtiendo desajustes en errores de compilación Go."
home_mcp_capabilities: "Admite servidores de recursos OAuth, intercambios interactivos de entrada, Tasks duraderas, MCP Apps y Skills."

home_registry_heading: "Aloja un registro para tus herramientas."
home_registry_text: "Publica toolsets en una pasarela en clúster sobre Redis y [Pulse](/es/docs/3-ecosystem/pulse/) para que los agentes carguen esquemas bajo demanda."
home_registry_cta: "Alojar un registro de herramientas"
home_registry_flow: "Los proveedores de herramientas se conectan a los agentes mediante un registro"
home_registry_node: "Tu registro de herramientas"
home_registry_node_text: "Descubre esquemas · Enruta llamadas · Supervisa salud"
home_registry_consumers: "Tus agentes y aplicaciones"

home_compare_heading: "Cómo se comparan Goa y Goa-AI"
home_compare_specs: "Cadenas de herramientas Protobuf y OpenAPI (buf/Connect, oapi-codegen)"
home_compare_specs_text: "`buf` parte de `.proto` y `oapi-codegen` de YAML. Goa compila HTTP, gRPC, JSON-RPC, OpenAPI 3.2 y toolsets MCP desde un único paquete Go."
home_compare_mcp_sdk: "SDKs MCP en Go cableados a mano (go-sdk, mcp-go)"
home_compare_mcp_sdk_text: "Los manejadores con etiquetas de structs duplican reglas ya definidas en tu API. Añadir `MCP(...)` reutiliza los mismos tipos validados y manejadores."
home_compare_agent_sdk: "SDKs de agentes en Python/TS (LangGraph, OpenAI Agents SDK)"
home_compare_agent_sdk_text: "Goa-AI compila códecs Go tipados, contexto inyectado, puertas de aprobación y actividades Temporal en un único binario estático."

home_faq_heading: "Preguntas antes de empezar"
home_faq_codegen_q: "¿Puedo adoptar Goa gradualmente y debo versionar gen/?"
home_faq_codegen_a: "Sí a ambas. `goa gen` emite código estándar `net/http` y `google.golang.org/grpc` que puedes montar junto a tus rutas actuales y versionar en `gen/`."
home_faq_difference_q: "¿Cómo llaman a Goa los clientes fuera de Go y cuándo añado Goa-AI?"
home_faq_difference_a: "TypeScript, Python y móvil consumen las especificaciones OpenAPI 3.2 y `.proto` generadas. Añade Goa-AI para exponer MCP o agentes de producto."
home_faq_tokens_q: "¿Cuándo no encaja Goa y cómo evaluarlo?"
home_faq_tokens_a: "Descártalo para scripts desechables. En servicios reales, compara una funcionalidad de principio a fin desde el [recorrido del catálogo](/es/docs/ai-development/#one-design-two-entry-points)."
home_faq_mcp_q: "¿Puedo usar Goa-AI solo para exponer un servidor MCP?"
home_faq_mcp_a: "Sí. Añade `MCP(...)` y `Tool(...)` a un servicio Goa para generar JSON Schemas y manejadores HTTP Streamable sin bucle de agente."

