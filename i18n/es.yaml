chorus_facts: "Código abierto (MIT) · Se ejecuta en 127.0.0.1"
chorus_install_heading: "Pruébalo en dos pasos"
chorus_install_intro: "macOS o Linux · `chorus update` mantiene al día binario, skills y lanzador"
chorus_step1_label: "**Paso 1** · Instala e inicia Chorus:"
chorus_restart_note: "Reinicia una vez los paneles de agentes que ya estuvieran abiertos para que carguen las herramientas MCP de Chorus."
chorus_step2_label: "**Paso 2** · Ejecuta `/chorus` en 2+ paneles de un repositorio y dile a uno:"
chorus_starter_prompt_body: "Dirige esto en el canal de nuestro repositorio: inspecciona nuestro punto de entrada, propón una pequeña mejora de pruebas y haz que un segundo agente revise el diff antes de resumir."
chorus_install_hint: "Escribe `/chorus` (`$chorus` en Codex), ejecuta `chorus ui` para ver el panel en directo o pulsa **⌥⌘⇧C** (`herdr-app do mod.open --name chorus-launcher`) en Herdr (terminal multiagente para macOS)."
chorus_setup_summary: "Qué cambia chorus up, configuración por proyecto y limpieza"
chorus_fit_configs: "**Alcance y reversión:** `chorus setup` escribe configuraciones solo en el proyecto (`.mcp.json`, además de `.codex/config.toml`, `.gemini/settings.json` y `.vscode/mcp.json` si existen); `chorus up` registra las configuraciones globales detectadas (`CHORUS_NO_SETUP=1` omite ediciones; elimina la entrada MCP `chorus` para revertir)."
chorus_fit_redis: "**Almacenamiento local y parada:** Inicia Redis/Valkey local persistente bajo `~/.chorus/redis` (o Docker/Podman) en `127.0.0.1` para que el historial sobreviva a reinicios; `chorus down` detiene el servidor Chorus."
chorus_fit_safety: "**Worktrees y confianza:** Los planes fijados coordinan responsables de archivos socialmente (usa git worktrees separados en un mismo `swarm` explícito para aislamiento estricto); mantén **YOLO** desactivado ante procesos locales no confiables."
chorus_copy_brew: "Copiar comando de instalación"
