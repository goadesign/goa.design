home_mcp_humans_text: "Revisa tipos y seguridad en `design/catalog.go`, implementa `Lookup` una vez y regenera `gen/` cuando cambien las reglas."
home_mcp_llms: "Trabajo claro para agentes de programación"
home_mcp_llms_text: "Tu agente de programación edita `design/` e `internal/` mientras `gen/` es de solo lectura, convirtiendo desajustes en errores de compilación Go."
home_mcp_capabilities: "Admite servidores de recursos OAuth, intercambios interactivos de entrada, Tasks duraderas, MCP Apps y Skills."

home_registry_heading: "Aloja un registro para tus herramientas."
home_registry_text: "Publica toolsets en una pasarela en clúster sobre Redis y [Pulse](/es/docs/3-ecosystem/pulse/) para que los agentes carguen esquemas bajo demanda."
