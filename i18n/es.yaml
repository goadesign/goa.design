home_registry_consumers: "Tus agentes y aplicaciones"

home_compare_heading: "Cómo se comparan Goa y Goa-AI"
home_compare_specs: "Cadenas de herramientas Protobuf y OpenAPI (buf/Connect, oapi-codegen)"
home_compare_specs_text: "`buf` + ConnectRPC genera HTTP/gRPC desde `.proto` mientras que `oapi-codegen` parte de OpenAPI YAML. Goa expresa enrutamiento HTTP rico, gRPC, JSON-RPC, OpenAPI 3.2 y toolsets MCP/de agentes en un único paquete Go — generando directamente en Go el enrutamiento y la validación sobre `net/http` y `grpc`."
home_compare_mcp_sdk: "SDKs MCP en Go cableados a mano (go-sdk, mcp-go)"
home_compare_mcp_sdk_text: "Los manejadores MCP basados en etiquetas de structs duplican reglas de parámetros ya escritas para tu API HTTP/gRPC. Añadir `MCP(...)` y `Tool(...)` a un servicio Goa reutiliza los mismos tipos validados y la misma implementación."
home_compare_agent_sdk: "SDKs de agentes en Python/TS (LangGraph, OpenAI Agents SDK)"
home_compare_agent_sdk_text: "Los SDKs de grafos conectan la orquestación en código de aplicación con tipado dinámico. Goa-AI compila códecs Go tipados, contexto inyectado desde el servidor, paginación con cursor, puertas de aprobación y actividades de workflows Temporal en un único binario estático de Go."

home_faq_heading: "Preguntas antes de empezar"
home_faq_codegen_q: "¿Puedo adoptar Goa de forma incremental en un repositorio Go existente, y debo versionar gen/?"
home_faq_codegen_a: "Sí a ambas. `goa gen` genera manejadores `net/http` estándar y servidores `google.golang.org/grpc` (no un router basado en reflexión), así que puedes montar un servicio Goa junto a tus rutas Go existentes, añadir middleware estándar y versionar `gen/` para auditar cada cambio de contrato en revisión de código."
home_faq_difference_q: "¿Cómo llaman a un servicio Goa los clientes que no usan Go, y cuándo añado Goa-AI?"
home_faq_difference_a: "Los clientes en TypeScript, Python y móvil consumen directamente las especificaciones OpenAPI 3.2 y `.proto` generadas. Empieza con Goa para APIs HTTP/gRPC/JSON-RPC; añade Goa-AI cuando expongas herramientas MCP o ejecutes agentes de producto (que puedes probar en local sin claves de API antes de conectar modelos reales o Temporal)."
home_faq_tokens_q: "¿Cuándo no encaja Goa y cómo deberíamos evaluarlo?"
home_faq_tokens_a: "Descarta Goa para scripts desechables o prototipos diminutos donde un paquete `design/` separado añada ceremonia. En servicios con múltiples endpoints o equipos con agentes de programación, compara una funcionalidad real de extremo a extremo (tokens, diffs de revisión y defectos) partiendo del [recorrido del catálogo](/es/docs/ai-development/#one-design-two-entry-points)."
home_faq_mcp_q: "¿Puedo usar Goa-AI solo para exponer un servidor MCP?"
home_faq_mcp_a: "Sí. Añade declaraciones `MCP(...)` y `Tool(...)` a un servicio Goa para generar JSON Schemas de `tools/list`, pistas de reintento de validación y manejadores HTTP Streamable sin ejecutar un bucle de agente."

home_community_heading: "Bibliotecas complementarias y herramientas multiagente"
home_community_intro: "Goa y Goa-AI se combinan con bibliotecas Go de código abierto para observabilidad, streams de eventos en Redis, diagramas C4 y desarrollo multiagente."
