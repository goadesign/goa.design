home_benefits_heading: "Por qué generar desde un contrato supera escribir fontanería a mano"
home_benefit_tokens: "54 líneas de DSL → 57 archivos generados"
home_benefit_tokens_text: "En el [ejemplo de referencia del catálogo](/es/docs/ai-development/#one-design-two-entry-points), las 54 líneas de `design/catalog.go` compilan más de 5.000 líneas de transportes Go, OpenAPI, Protobuf y esquemas JSON de herramientas en `gen/` (versionado en Git, cero tokens de salida del LLM)."
home_benefit_context: "Un único contrato en el contexto"
home_benefit_context_text: "Los tipos de entrada, reglas de rango y regex, descripciones y rutas de transporte viven en `design/*.go`. Tu agente de programación lee el contrato y la interfaz de `gen/` en lugar de rastrear cuatro capas mantenidas a mano."
home_benefit_feedback: "El compilador detecta las divergencias al instante"
home_benefit_feedback_text: "Cambia un campo o método en `design/` y vuelve a ejecutar `goa gen`. Go señala cada manejador, cliente y ejecutor de herramientas cuya firma haya dejado de coincidir."

home_frameworks_heading: "Goa para servicios. Goa-AI para agentes y MCP."
home_service_title: "Un contrato. Cada transporte."
home_service_text: "Declara entradas, validaciones y errores una sola vez en Go. Genera servidores `net/http` estándar, gRPC y JSON-RPC, clientes tipados y especificaciones OpenAPI 3 / Protobuf — el enrutamiento, la decodificación y la validación son código Go generado, no un framework basado en reflexión."
home_service_docs: "Explorar Goa"
home_service_transports: "Servidores, clientes Go tipados y clientes CLI compilados desde el mismo diseño de servicio."
home_service_streams: "Streaming integrado en el diseño"
home_service_contracts: "Validación en el borde del transporte"
home_service_contracts_text: "Campos obligatorios, patrones, rangos, códigos de estado de error, OpenAPI 3.2 y Protocol Buffers."

home_agent_title: "Agentes tipados, servidores MCP y ejecuciones duraderas."
home_agent_text: "Amplía el mismo DSL en Go a agentes de IA con herramientas y servidores MCP. Prueba en memoria local sin claves de API, conecta luego OpenAI, Anthropic, AWS Bedrock o Google Vertex AI y ejecuta de forma duradera sobre Temporal."
home_agent_docs: "Explorar Goa-AI"
home_agent_contracts: "Validación del servicio y contexto oculto"
home_agent_contracts_text: "Reutiliza métodos de servicios Goa como herramientas (`BindTo`), oculta al modelo los IDs de tenant fijados en el servidor (`Inject`) y acota respuestas paginadas (`BoundedResult`)."
home_agent_composition: "Árboles multiagente y evaluaciones deterministas"
home_agent_composition_text: "Compón agentes hijos como herramientas con presupuestos acotados y prueba trayectorias de herramientas de forma determinista sin llamadas reales al LLM."
home_agent_execution: "Puertas de aprobación, streaming y MCP autónomo"
home_agent_execution_text: "Pausa herramientas sensibles para aprobación humana (`Confirmation`), transmite eventos tipados a interfaces de usuario o expón MCP sin ejecutar un bucle de agente."

home_mcp_heading: "Crea servidores MCP desde tus servicios."
home_mcp_text: "Añade `MCP(...)` a cualquier servicio Goa para exponer sus métodos como herramientas MCP validadas, recursos y plantillas de prompts."
home_mcp_cta: "Crear un servidor MCP"
home_mcp_caption: "La regla regex de LookupPayload se compila tanto en los decodificadores HTTP/gRPC como en el inputSchema de tools/list en MCP."
home_mcp_design: "Tu diseño Goa"
home_mcp_generated: "Interfaz MCP generada"
