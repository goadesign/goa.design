home_faq_heading: "Preguntas antes de empezar"
home_faq_codegen_q: "¿Puedo adoptar Goa gradualmente y debo versionar gen/?"
home_faq_codegen_a: "Sí a ambas. `goa gen` emite código estándar `net/http` y `google.golang.org/grpc` que puedes montar junto a tus rutas actuales y versionar en `gen/`."
home_faq_difference_q: "¿Cómo llaman a Goa los clientes fuera de Go y cuándo añado Goa-AI?"
home_faq_difference_a: "TypeScript, Python y móvil consumen las especificaciones OpenAPI 3.2 y `.proto` generadas. Añade Goa-AI para exponer MCP o agentes de producto."
home_faq_tokens_q: "¿Cuándo no encaja Goa y cómo evaluarlo?"
home_faq_tokens_a: "Descártalo para scripts desechables. En servicios reales, compara una funcionalidad de principio a fin desde el [recorrido del catálogo](/es/docs/ai-development/#one-design-two-entry-points)."
home_faq_mcp_q: "¿Puedo usar Goa-AI solo para exponer un servidor MCP?"
home_faq_mcp_a: "Sí. Añade `MCP(...)` y `Tool(...)` a un servicio Goa para generar JSON Schemas y manejadores HTTP Streamable sin bucle de agente."

