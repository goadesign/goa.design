home_benefits_heading: "Por qué generar desde un contrato"
home_benefit_tokens: "54 líneas de DSL → 57 archivos generados"
home_benefit_tokens_text: "En el [recorrido del catálogo](/es/docs/ai-development/#one-design-two-entry-points), 54 líneas en `design/catalog.go` compilan más de 5.000 líneas de transportes Go, OpenAPI, Protobuf y esquemas de herramientas con cero tokens de LLM."
home_benefit_context: "Un único contrato en el contexto"
home_benefit_context_text: "Tipos, validaciones y rutas viven en `design/*.go`. Tu agente lee un solo contrato en lugar de rastrear cuatro capas manuales."
home_benefit_feedback: "El compilador detecta las divergencias al instante"
home_benefit_feedback_text: "Cambia `design/` y ejecuta `goa gen`. Go señala al instante cualquier manejador, cliente o herramienta cuya firma haya cambiado."

home_frameworks_heading: "Goa para servicios. Goa-AI para agentes y MCP."
home_service_title: "Un contrato. Cada transporte."
home_service_text: "Declara entradas, validaciones y errores una vez en Go. Genera servidores `net/http` estándar, gRPC y JSON-RPC, clientes tipados y especificaciones OpenAPI 3 / Protobuf."
