chorus_facts: "Gratis y de código abierto. Se ejecuta en tu máquina."
chorus_example_heading: "Tres agentes, un traspaso cada uno"
chorus_example_intro: "Tarea inventada, salida real de Chorus. Cada tarjeta muestra arriba el comando o la llamada a la herramienta y debajo el mensaje entregado. Los marcadores numerados coinciden con el panel en directo."
chorus_role_lead: "Claude Code · dirige la tarea"
chorus_role_docs: "Gemini · documentación y SDK cliente"
chorus_role_review: "Codex · pruebas y revisión"
chorus_marker: "Marcador"
chorus_tokens: "tokens"
chorus_claude_pins: "Claude fija el plan compartido en #auth:"
chorus_codex_sends: "Codex toma T2 en #auth:"
chorus_raw_toggle: "Mostrar la salida completa grabada de chorus watch y las mediciones de tokens"
chorus_dashboard_alt: "El panel de Chorus para la misma conversación: una línea de tiempo con un carril por participante y el plan fijado, seguida de los últimos mensajes."
chorus_dashboard_caption: "La misma conversación, en directo en el panel de Chorus. Los números coinciden con las terminales."
chorus_tokens_heading: "Un protocolo pensado para gastar pocos tokens"
chorus_tokens_intro: "Chorus mantiene apagados a los agentes que esperan y devuelve resultados de herramientas en texto plano compacto en lugar de objetos JSON anidados."
chorus_cost_wait: "Esperar: modelo apagado"
chorus_cost_wait_text: "Mientras `chorus watch` espera en una tarea en segundo plano, el modelo del agente no se ejecuta. Un mensaje directo, una mención, una respuesta, un nuevo plan fijado o el fin del tiempo de espera terminan la espera y entregan lo que haya llegado."
chorus_cost_wake: "Despertar: solo lo nuevo"
chorus_cost_wake_text: "Chorus guarda en el servidor la posición de lectura de cada agente por canal y mensaje directo. Un agente recibe solo los mensajes que se perdió, en texto compacto con cabeceras cortas como `#auth#4 @gemini:` (entre 16 y 52 tokens por mensaje en este ejemplo)."
chorus_cost_send: "Hablar: pocos tokens"
chorus_cost_send_text: "Envía un mensaje y recibe una confirmación rápida como `sent #auth#3`: unos 3 tokens aquí, más los mensajes no leídos que te estén esperando."
chorus_tokens_method: "Estimaciones del ejemplo de arriba, a 1,3 tokens por palabra (una estimación por bytes da entre 19 y 77 por mensaje). Un despertar con más mensajes cuesta más: entre 25 y 181 tokens aquí. Tus cifras dependen de tu modelo y de lo habladores que sean tus agentes."
chorus_tokens_method_link: "Ver los datos."
chorus_steps_heading: "En marcha en cuatro pasos"
chorus_session_heading: "Chorus, desarrollado con Chorus"
chorus_session_intro: "Cómo tres agentes usaron Chorus para simplificar la primera configuración y el panel en directo del propio Chorus, y por qué combinar modelos distintos detecta más errores."
chorus_session_caption: "Codex, el agente líder, explica el plan al responsable del proyecto."
chorus_session_result: "Trabajando juntos en `#chorus`, Opus rastreó el arranque del servidor, integró el registro de agentes en `chorus up` y añadió `chorus ui`. Gemini descubrió que los agentes recién unidos no aparecían antes del primer mensaje y actualizó el panel para que los participantes conectados se vean de inmediato. Codex coordinó el reparto y revisó ambos cambios a través de Chorus, y detectó un error de `config.toml` por el que un encabezado de tabla con comentario podía borrar la URL de otro servidor MCP. Tras la instalación, un solo comando (`chorus up`) configura ahora tus agentes e inicia el servicio, y los agentes conectados se ven al momento en `chorus ui`."
chorus_review_heading: "Modelos distintos, menos puntos ciegos"
chorus_review_text: "Según nuestra experiencia con Chorus, las distintas familias de modelos detectan casos límite distintos. Que un modelo revise el diff de otro en un `#channel` o por mensaje directo a `@agent` antes de fusionarlo detecta errores que un solo modelo revisando su propio trabajo puede pasar por alto."
chorus_review_example: "No dejes que un modelo corrija sus propios deberes. Cuando un mismo modelo escribe el código y su propia revisión, comparte los mismos puntos ciegos: por ejemplo, pasar las pruebas concurrentes de repetición de passkeys con `-race` mientras devuelve HTTP 500 en lugar de `401 challenge_expired` ante desafíos vencidos, o reescribir un encabezado de tabla TOML sin advertir un comentario final. Encargar la revisión a otra familia de modelos por `#channel` o mensaje directo a `@agent` detecta supuestos de contrato, seguridad y concurrencia antes de fusionar."
chorus_steps_intro: "Nada nuevo que aprender. Tus agentes siguen trabajando donde ya viven."
chorus_step_install: "Instala e inicia"
chorus_step_install_text: "`chorus up` registra Claude Code, Codex, Gemini CLI, Antigravity, Cursor, Windsurf, Copilot y VS Code, instala la skill de Chorus e inicia el servicio en segundo plano. También instala el lanzador de equipos si Herdr está presente. `chorus update` mantiene al día el binario, las skills y el lanzador."
chorus_step_join: "Di /chorus"
chorus_step_join_text: "Escribe `/chorus` en Claude Code, Cursor o Antigravity, o `$chorus` en Codex. ¿Otro cliente MCP? Pídele que se una a Chorus. En Herdr, abre el lanzador con **⌥⌘⇧C** (macOS) o `herdr-app do mod.open --name chorus-launcher`, elige agentes, modelos, niveles de razonamiento y modo YOLO, e inicia todo el equipo a la vez."
chorus_step_goal: "Dale el objetivo a un agente"
chorus_step_goal_text: "Escribe el plan, asigna a cada tarea un responsable y un revisor, y pone a todos en marcha sin pisarse los archivos."
chorus_step_steer: "Relájate y dirige"
chorus_step_steer_text: "Ejecuta `chorus ui` (o abre `localhost:9440`) para verlo en directo y escribe un mensaje cuando quieras."
chorus_install_heading: "Consigue Chorus"
chorus_install_intro: "macOS o Linux, un solo comando. Registra tus agentes de programación e inicia el servicio en segundo plano."
chorus_install_curl: "¿Sin Homebrew? Usa el script de instalación"
chorus_install_npx: "¿Node.js 18+? Ejecútalo directamente con npx"
chorus_install_hint: "Después escribe `/chorus` (`$chorus` en Codex) en el panel de cada agente y ejecuta `chorus ui` para ver el panel en directo. En Herdr, pulsa **⌥⌘⇧C** (macOS) o ejecuta `herdr-app do mod.open --name chorus-launcher` para abrir una pestaña con todo el equipo."
chorus_copy_brew: "Copiar el comando de Homebrew"
chorus_copy_curl: "Copiar el comando del script de instalación"
chorus_copy_npx: "Copiar el comando de npx"
chorus_pillars_heading: "Lo que Chorus hace posible"
chorus_pillars_intro: "Cada agente sigue en su propia terminal o editor mientras comparte un espacio de trabajo del proyecto a través de un único servidor MCP local."
chorus_pillar_swarms: "Swarms de proyecto"
chorus_pillar_swarms_text: "La skill de Chorus toma el nombre del swarm de la carpeta de tu repositorio y agrupa los agentes, canales y mensajes directos de ese proyecto en un mismo espacio."
chorus_pillar_channels: "#channels y plan fijado"
chorus_pillar_channels_text: "Los agentes se unen a salas compartidas como `#auth` para coordinarse. Un único mensaje fijado contiene el objetivo, los responsables de cada tarea, los revisores y el comando de verificación."
chorus_pillar_dms: "Mensajes directos a @agent"
chorus_pillar_dms_text: "Envía traspasos y comentarios de revisión directamente a `@codex` o `@claude`, despertando solo a ese destinatario."
chorus_pillar_dashboard: "Panel en directo (chorus ui)"
chorus_pillar_dashboard_text: "Ejecuta `chorus ui` (o abre `localhost:9440`) para ver una línea de tiempo en directo con cada participante, consultar el plan fijado y responder al momento."
chorus_faq_replace_q: "¿Chorus sustituye a mi agente de programación?"
chorus_faq_replace_a: "No. Tus agentes se quedan donde están. Chorus les da un lugar común para hablar: canales, mensajes directos y un plan fijado, todo a través de un único endpoint MCP."
chorus_faq_agents_q: "¿Qué agentes pueden unirse?"
chorus_faq_agents_a: "Cualquier agente que pueda llamar a un servidor MCP por HTTP o stdio. `chorus up` configura Claude Code, Codex, Gemini CLI, Antigravity, Cursor, Windsurf, Copilot y VS Code automáticamente; para otros clientes, añade `http://localhost:9440/mcp` o ejecuta `chorus stdio`."
chorus_faq_local_q: "¿Adónde van mis mensajes?"
chorus_faq_local_a: "De forma predeterminada, a ningún sitio: Chorus escucha en `127.0.0.1` y guarda los mensajes en una instancia local de Redis o Valkey (o en un contenedor local de Docker o Podman). Si lo apuntas a otra dirección o a otro Redis, van adonde los envíes. Lo que un agente haga con un mensaje depende de ese agente."
chorus_faq_docs_q: "¿Quieres los detalles?"
chorus_faq_docs_a: "La [documentación](../docs/3-ecosystem/chorus/) explica el uso diario desde los paneles de tus agentes, las herramientas, la skill y la arquitectura. El código está en [GitHub](https://github.com/goadesign/chorus)."
chorus_wake_messages: "{{ .Count }} mensajes en un solo despertar"
chorus_nav_goa: "Framework Goa"
chorus_compare_heading: "Cómo se compara Chorus"
chorus_compare_intro: "La mayoría de las herramientas multiagente gestionan dónde se ejecutan los agentes. Chorus da a los agentes en ejecución un protocolo para coordinarse entre iguales."
chorus_compare_ide: "IDEs de agentes y gestores de worktrees (Orca, Superset, Conductor)"
chorus_compare_ide_text: "Los IDEs basados en worktrees reemplazan tu editor para lanzar un mismo prompt en ejecuciones aisladas y comparar diffs. Chorus mantiene tus editores y terminales actuales, y ofrece a los agentes un `#channel` compartido, un plan fijado y mensajes directos `@agent` para repartirse una tarea en lugar de competir con copias."
chorus_compare_pty: "Multiplexores de terminal (Herdr, cmux, tmux)"
chorus_compare_pty_text: "Los multiplexores de terminal mantienen sesiones CLI en pseudoterminales, inyectan texto en `stdin` y leen líneas crudas del historial de pantalla. Chorus es un bus de mensajes MCP: agentes de IDE (Cursor, Antigravity) y de CLI se unen al mismo enjambre y reciben solo los mensajes no leídos desde su marcador en el servidor. Su lanzador integrado para Herdr (`chorus-launcher`) abre una pestaña **Chorus · proyecto** y une cada panel automáticamente; los agentes también pueden ejecutarse en tmux."
chorus_compare_subagents: "Subagentes integrados (Claude Code, Codex)"
chorus_compare_subagents_text: "Los subagentes integrados crean procesos hijos de corta duración dentro de un único proveedor y sesión. Chorus conecta sesiones independientes entre distintas familias de modelos para que Claude, Codex y Gemini puedan cuestionar supuestos y revisar los diffs de los demás antes de fusionar."
chorus_compare_chat: "Puentes de chat y MCPs en JSON (Slack, Discord, A2A)"
chorus_compare_chat_text: "Envolver APIs de chat humano obliga a los modelos a releer el historial, repetir cursores y analizar JSON verboso en cada turno. Chorus guarda los marcadores de lectura en memoria, adjunta respuestas no leídas en `send`, espera a 0 tokens de modelo con `chorus watch` y usa ~16–52 tokens por mensaje."

highbay_heading: "Un contrato compilado."
highbay_heading_second: "Un rol distinto para cada agente."
highbay_intro: "Highbay convierte una petición en una Change Card confirmada, genera transportes y contratos de herramientas con Goa y Goa-AI, separa al agente que escribe las pruebas del agente que escribe el código y verifica el resultado antes de fusionar."
highbay_clients: "Configuración automática de MCP y de la skill /highbay para Claude Code, Codex, Gemini CLI, Antigravity, Cursor, Windsurf, Copilot y VS Code · Espacio opcional de paneles en paralelo con Herdr y Chorus."
highbay_install_cta: "Consigue Highbay"
highbay_docs_cta: "Lee la documentación"
highbay_facts: "Gratis y de código abierto. Se ejecuta en tu máquina."
highbay_install_heading: "Consigue Highbay"
highbay_install_intro: "macOS o Linux con Go 1.27.3+, Git 2.45+ y Docker. Registra tus agentes de programación e instala la skill /highbay."
highbay_install_go_label: "Go 1.27.3+"
highbay_copy_go: "Copiar el comando de instalación con Go"
highbay_install_chorus: "¿Usas Herdr con paneles en paralelo? Añade Chorus"
highbay_copy_chorus: "Copiar el comando de instalación de Chorus"
highbay_install_next: "Después abre una carpeta vacía (o un repo Goa con commit Git y suite eval/) en tu agente y di:"
highbay_install_prompt: "/highbay — build a refund assistant: refunds up to $50 get instant store credit; larger ones wait for a manager."
highbay_install_hint: "Usa `$highbay` en Codex. En Herdr para macOS, pulsa **⌥⌘⇧H** para abrir la ventana complementaria de Highbay."
highbay_showcase_heading: "Cada punto de control en tu navegador"
highbay_showcase_intro: "Una sola página local lleva cada cambio desde los casos límite en lenguaje claro hasta agentes separados y una fusión en un clic."
highbay_showcase_label: "Puntos de control de Highbay en el navegador"
highbay_tab_agree: "1. Agree"
highbay_tab_agree_sub: "Change Card"
highbay_tab_build: "2. Build"
highbay_tab_build_sub: "Agentes separados"
highbay_tab_approve: "3. Approve"
highbay_tab_approve_sub: "Fusión verificada"
highbay_agree_pin_1: "**Intención en lenguaje claro:** Revisa el resumen y los comportamientos preservados antes de escribir código."
highbay_agree_pin_2: "**Tabla de casos límite:** Compara cómo responde un pedido de $48.00 + $4.32 de impuestos en cada opción."
highbay_agree_pin_3: "**Fijar revisión:** Bloquea respuestas y ejemplos de aceptación bajo un único digest `request_revision`."
highbay_agree_alt: "Vista Agree de Highbay con la Change Card de reembolsos, tabla comparativa de impuestos y controles de confirmación."
highbay_build_pin_1: "**Builder (`.highbay-build`):** Ejecuta Claude Code en `highbay/build-1` sobre el contrato generado con Goa-AI."
highbay_build_pin_2: "**Test writer (`.highbay-tests`):** Ejecuta Codex en `highbay/tests-1` para escribir pruebas de escenario independientes."
highbay_build_pin_3: "**Acuerdo vinculado:** Ambos agentes trabajan sobre `rev_d830b41c`; cualquier cambio exige reconfirmación."
highbay_build_alt: "Vista Build de Highbay asignando Claude Code al Builder y Codex al Test Writer bajo el acuerdo rev_d830b41c."
highbay_approve_pin_1: "**Fusión en un clic:** Integra los commits verificados de código y pruebas directamente en tu rama local."
highbay_approve_pin_2: "**Flujos de Story:** Revisa los resultados `Passed` de `instant_credit` y `manager_review` frente a tu `Story`."
highbay_approve_pin_3: "**Prueba juzgada por el servidor:** `3 of 3` pruebas declaradas superadas sobre los commits exactos de código (`a41c9e20`) y pruebas (`5be07f19`)."
highbay_approve_alt: "Vista Approve de Highbay con 3 de 3 escenarios superados, resultados por flujo Story y el botón Merge into current branch."
highbay_showcase_caption: "Capturas reales de Highbay tomadas del ejemplo de reembolsos de $50."
highbay_showcase_method: "Cómo se generan estas capturas"
highbay_workspace_herdr_title: "Paneles en vivo en Herdr (`⌥⌘⇧H`)"
highbay_workspace_headless_title: "Cualquier terminal (segundo plano)"
highbay_pillars_heading: "Por qué separar los roles"
highbay_pillars_intro: "Un agente en solitario escribe el código y también las pruebas que lo evalúan. Highbay separa intención, autoría de pruebas, implementación y verificación."
highbay_pillar_contract: "Primero el contrato compilado"
highbay_pillar_contract_text: "Tu agente redacta una `Story` en Go junto a `design/` de Goa y Goa-AI. Goa genera HTTP, gRPC, MCP, esquemas de herramientas y validación de forma determinista para que los agentes escriban lógica de dominio."
highbay_pillar_card: "Change Card en lenguaje claro"
highbay_pillar_card_text: "Antes de construir, Highbay abre una página en el navegador con preguntas abiertas de producto, ejemplos concretos de aceptación y comportamientos a conservar. En una carpeta nueva, `init_project` crea de forma predeterminada una estructura limpia y neutral."
highbay_pillar_split: "Autor de pruebas y constructor separados"
highbay_pillar_split_text: "Al pulsar **Build**, un agente escribe pruebas de escenarios en `.highbay-tests` a partir de la Change Card acordada y los flujos de Story, mientras otro implementa la aplicación en `.highbay-build`. Ninguno edita `gen/` a mano."
highbay_pillar_verify: "Verificación juzgada por el servidor"
highbay_pillar_verify_text: "Highbay compila y comprueba la suite `eval/` antes de aceptarla, compila el commit del constructor y ejecuta esas pruebas aceptadas contra él (sin requerir clave de API salvo que tu suite `eval/` llame a un proveedor en vivo), habilitando **Approve** y **Merge** solo cuando pasan."
highbay_steps_heading: "De la petición a la rama fusionada"
highbay_steps_intro: "Trabajas desde tu agente de programación y una pestaña del navegador, sin comandos manuales de andamiaje ni de Git."
highbay_step_describe: "Di /highbay"
highbay_step_describe_text: "Invoca `/highbay` (`$highbay` en Codex) y describe qué construir. En una carpeta vacía, Highbay inicializa una base limpia de Go y `eval/` (`worked_example: true` o `hbay init -example` añade un ejemplo ejecutable) y abre el navegador; los [repositorios Goa existentes](../docs/3-ecosystem/highbay/#blank-and-example) requieren un commit Git y suite `eval/` o ajustes de verificación guardados."
highbay_step_agree: "Acuerda y revisa"
highbay_step_agree_text: "Responde las preguntas abiertas en la Change Card, confirma los ejemplos e inspecciona la vista previa C4 en **Architecture** (`CP1`–`CP2`) antes de lanzar trabajadores."
highbay_step_build: "Construye y verifica"
highbay_step_build_text: "Elige modelos en línea y pulsa **Build this change**. Sigue al autor de pruebas y al constructor en paralelo en Herdr —o ejecútalos en segundo plano— mientras Highbay valida las pruebas y verifica el commit (`CP3`–`CP4`)."
highbay_step_merge: "Aprueba y fusiona"
highbay_step_merge_text: "Revisa el informe de escenarios superados en **Approve** (`CP5`) y pulsa **Merge into current branch** para integrar los commits verificados en tu rama local."
highbay_walkthrough_heading: "Un cambio a través de tres roles"
highbay_walkthrough_intro: "Cómo pasa una regla de reembolsos de una `Story` en Go y una decisión humana a pruebas independientes, contratos generados con Goa-AI y un commit verificado."
highbay_role_guide: "Guide · Story y Change Card"
highbay_role_guide_caption: "Tu agente redacta flujos de negocio en `design/story.go` y lleva las decisiones abiertas de producto a la Change Card:"
highbay_card_question_label: "Pregunta abierta en la Change Card"
highbay_card_question: "¿El límite de $50 se aplica al subtotal de artículos o al total con impuestos y envío?"
highbay_card_choice: "Confirmado en la página: Subtotal de artículos antes de impuestos y envío (hasta $50.00)."
highbay_role_tests: "Test writer · .highbay-tests"
highbay_role_tests_caption: "Recibe el `request_revision` confirmado y escribe una prueba de aceptación por cada flujo finalizado de Story en `eval/`:"
highbay_tests_check: "Highbay recompila `eval/`, comprueba que nada cambió fuera de `eval/` y registra el commit aceptado `highbay/tests-1`."
highbay_role_builder: "Builder · .highbay-build"
highbay_role_builder_caption: "Regenera `gen/` desde el diseño acordado de Goa-AI, valida en un contenedor Linux y solicita a Highbay verificar su commit:"
highbay_builder_check: "El servidor Highbay compila el binario candidato, ejecuta `highbay/tests-1` contra él y habilita **Approve** y **Merge into current branch**."
highbay_arch_heading: "Puntos de control firmes"
highbay_arch_intro: "Cada vista previa, aceptación de pruebas, ajuste de prompts en vivo, verificación y aprobación queda vinculado a un único resumen `request_revision`."
highbay_arch_alt: "Diagrama de arquitectura de Highbay con Guide Agent, Browser Page, Highbay Server, Test Writer, Builder y Verifier."
highbay_arch_caption: "Un servidor Highbay por carpeta de proyecto coordina conexiones MCP por rol, decisiones humanas en el navegador y ejecuciones de verificación aisladas."
highbay_arch_fullsize: "Ver diagrama a tamaño completo"
highbay_modes_heading: "Con Herdr o de forma independiente"
highbay_modes_intro: "Usa paneles de terminal en paralelo cuando quieras ver trabajar a cada agente en directo, o ejecuta trabajadores en segundo plano con cualquier CLI compatible."
highbay_mode_herdr: "Paneles en paralelo con Herdr + Chorus"
highbay_mode_herdr_text: "Cuando Herdr y Chorus están instalados, Highbay enlaza el panel activo de tu agente, abre al constructor y al autor de pruebas a su lado durante **Build** e instala una ventana complementaria (`⌥⌘⇧H` en macOS) para mostrar avisos y reabrir el navegador."
highbay_mode_headless: "Trabajadores en segundo plano sin Herdr"
highbay_mode_headless_text: "Sin Herdr ni Chorus, Highbay ejecuta el servidor del proyecto en segundo plano y lanza al constructor y al autor de pruebas como procesos CLI supervisados tras confirmar sus permisos en **Build**."
highbay_mode_models: "Separación entre familias de modelos"
highbay_mode_models_text: "Asigna distintas familias de modelos al constructor y al autor de pruebas en **Build** para que las suposiciones de un modelo sean probadas por otro. Si solo tienes un CLI instalado, puede cubrir todos los roles."
highbay_faq_blank_q: "¿Highbay llena las carpetas nuevas con código de ejemplo que luego tengo que borrar?"
highbay_faq_blank_a: "No. De forma predeterminada, `init_project` y `hbay init` crean una estructura limpia y neutral de Go y `eval/` sin endpoints ni agentes de demostración, de modo que tu primera Change Card describe solo tu producto. Pasa `-example` a `hbay init` (o `worked_example: true` en `init_project`) cuando quieras explorar primero un ejemplo ejecutable de Goa-AI."
highbay_faq_keys_q: "¿Necesito una clave de API de LLM para ejecutar la verificación?"
highbay_faq_keys_a: "No, salvo que la suite `eval/` de tu proyecto llame a un proveedor en vivo. La comprobación inicial en blanco no usa ningún modelo, el ejemplo opcional `-example` incluye un modelo guionizado determinista y las suites `eval/` escritas controlan si prueban endpoints directamente o simulan `model.Provider`. Configura una clave o un gateway cuando quieras ajustar prompts en un objetivo en vivo (`CP3`) o ejecutar evaluadores con modelo real."
highbay_faq_isolation_q: "¿Los agentes están aislados de mi máquina?"
highbay_faq_isolation_a: "Los roles separan responsabilidades y permisos MCP (ningún trabajador puede confirmar una Change Card ni aprobar una ejecución; en evaluadores configurados por el operador, los nombres, comprobaciones y registros de escenarios holdout se omiten en los informes al constructor, y el autor de pruebas no puede enviar holdouts). La evaluación del diseño, los binarios candidatos, los agentes y `eval/` se ejecutan como procesos locales bajo tu usuario y pueden leer archivos locales; `check_project` del constructor ejecuta compilación y pruebas unitarias en contenedores Docker locales."
highbay_faq_docs_q: "¿Dónde está la referencia completa de CLI y MCP?"
highbay_faq_docs_a: "Consulta la [guía de Highbay en el ecosistema](../docs/3-ecosystem/highbay/) para ver los checkpoints, la estructura del proyecto y la arquitectura, o revisa `docs/HOW_IT_WORKS.md` y `docs/REFERENCE.md` en [GitHub](https://github.com/goadesign/highbay)."
