highbay_walkthrough_heading: "Una estructura. Contratos compilados. Límites aplicados."
highbay_walkthrough_intro: "Cada servicio comparte `design/`, `gen/`, `internal/` y `eval/` para que ingenieros y agentes cambien de repositorio sin reaprender convenciones."
highbay_role_guide: "1. Contrato · design/"
highbay_role_guide_caption: "Redactado por tu agente y confirmado por ti:"
highbay_card_choice: "Define APIs, herramientas MCP, arquitectura (`design/model.go`) y flujos ejecutables (`design/story.go`)."
highbay_role_codegen: "2. Generado · gen/"
highbay_role_codegen_caption: "Compilado por [Goa](/es/) y [Goa-AI](/es/docs/2-goa-ai/) (generadores Go de código abierto) — nunca editado a mano:"
highbay_codegen_check: "Produce interfaces tipadas, servidores HTTP/MCP, especificaciones OpenAPI 3 y `AGENTS_QUICKSTART.md`; los manejadores viven en `internal/`."
highbay_role_tests: "3. Verificación separada · eval/"
highbay_role_tests_caption: "Escrita en una copia `.highbay-tests` independiente a partir de tu acuerdo:"
highbay_builder_check: "Highbay rechaza informes de pruebas que toquen archivos fuera de `eval/` y commits del constructor que alteren `design/` o archivos escritos a mano en `eval/` (cuando no hay una suite externa registrada)."
highbay_cap_kicker: ""
highbay_cap_heading: "Patrones integrados para infraestructura en producción"
highbay_cap_intro: "Los servicios HTTP y MCP sin estado se ejecutan como un solo binario; cuando se declaran, `highbay://golden-path` da a los agentes una única forma de conectar:"
highbay_cap_auth_title: "Autenticación e identidad ([Goa](/es/) · sin estado)"
highbay_cap_auth_body: "Validación JWT, OAuth2 y API key en el borde con principales verificados en `context.Context` tipado."
highbay_cap_obs_title: "Observabilidad y logs ([Clue](/es/docs/3-ecosystem/clue/) · OpenTelemetry)"
highbay_cap_obs_body: "Trazas y métricas OpenTelemetry, logs en búfer volcados ante errores y sondas `/healthz`."
highbay_cap_stream_title: "Streams, colas y workers ([Pulse](/es/docs/3-ecosystem/pulse/) · Redis)"
highbay_cap_stream_body: "Redis Streams tipados, grupos de workers con hash consistente y failover, y mapas distribuidos de límites de tasa."
highbay_cap_durable_title: "Agentes y flujos duraderos ([Goa-AI](/es/docs/2-goa-ai/) · Temporal)"
highbay_cap_durable_body: "Adaptadores para Anthropic, OpenAI, Bedrock, Vertex y gateways, límites `RunPolicy`, pausas `Confirmation` resistentes a fallos y presupuestos de prompt en ejecución ([`TestSeededPayloadBloatFailsTheBudget`](https://github.com/goadesign/highbay/blob/main/examples/orders-eval/acceptance/acceptance_test.go#L36-L60))."
highbay_proof_heading: "Salvaguardas y referencias en el repositorio"
highbay_proof_codegen_title: "~70 % generado en el servicio de referencia ([ver `examples/orders/gen/`](https://github.com/goadesign/highbay/tree/main/examples/orders/gen))"
highbay_proof_codegen_body: "En el servicio de referencia Orders de Highbay, `gen/` representa ~70 % del código Go fuera de pruebas — compilado sin tokens de salida de LLM."
highbay_proof_playbook_title: "Guía de 12 secciones ([`GOLDEN_PATH.md`](https://github.com/goadesign/highbay/blob/main/internal/goldenpath/GOLDEN_PATH.md))"
highbay_proof_playbook_body: "Servida por MCP (`highbay://golden-path`) para que Claude, Codex y Gemini sigan un mismo estándar entre repositorios."
highbay_proof_suite_title: "Caídas y control de roles ([`orders-eval`](https://github.com/goadesign/highbay/tree/main/examples/orders-eval/acceptance))"
highbay_proof_suite_body: "Las suites de referencia envían `SIGKILL` a workers a mitad de ejecución, reinician APIs con aprobaciones pendientes y rechazan llamadas sin permiso (`403`)."
highbay_compare_heading: "Cómo se compara Highbay"
highbay_compare_intro: "En qué se diferencian los flujos para agentes de programación y los SDKs de agentes."
highbay_compare_solo: "Modo Plan y .cursorrules en solitario"
highbay_compare_solo_text: "El modo plan y las reglas en Markdown aclaran la intención inicial, pero las convenciones en prosa derivan entre PRs y una sola sesión sigue evaluando su propio código."
highbay_compare_speckit: "SDKs de agentes en Python/TS (LangGraph, Agents SDK)"
highbay_compare_speckit_text: "Los SDKs centrados en código encadenan herramientas dentro de la aplicación; Highbay compila primero contratos HTTP, OpenAPI 3 y MCP y añade un verificador separado."
highbay_compare_workspaces: "Ejecutores de worktrees en paralelo"
highbay_compare_workspaces_text: "Los ejecutores en paralelo lanzan el mismo prompt en ramas rivales que comparas a mano; Highbay coordina un constructor y un autor de pruebas sobre un mismo contrato."
highbay_faq_scope_q: "¿Cómo encaja Highbay con repositorios existentes, gRPC y flujos PR/CI?"
highbay_faq_scope_a: "Highbay crea servicios nuevos (invocables por HTTP, OpenAPI 3 o MCP desde Python, TypeScript, Go o web) o amplía repositorios Goa existentes; no reestructura otros routers en el sitio. El `highbay gen` integrado rechaza `GRPC` (`protoc` no viene incluido; `goa gen` independiente sí soporta gRPC), y los commits aprobados pueden fusionarse directamente o en una rama de PR para CI."
highbay_faq_holdouts_q: "¿Qué impide que el constructor edite el contrato o las pruebas?"
highbay_faq_holdouts_a: "Highbay sobrescribe `design/` desde tu revisión confirmada al generar código y rechaza commits que alteren `design/` o las pruebas escritas en `eval/`. Evaluadores externos (`highbay verification set`) también pueden ejecutar escenarios holdout ocultos."
highbay_faq_local_q: "¿Requiere Highbay una cuenta en la nube o clave API de modelos?"
highbay_faq_local_a: "Ninguna de las dos: los agentes usan sus propios inicios de sesión en el CLI, y los escenarios en `eval/` emplean dobles de modelo guionizados (`0` claves API externas salvo que pruebes llamadas en vivo)."
highbay_faq_sandbox_q: "¿Cómo se acotan los procesos locales y los permisos?"
highbay_faq_sandbox_a: "Los tokens MCP por rol reservan confirmación, aprobación y fusión solo para ti, y las comprobaciones del constructor corren en un contenedor Docker Linux local. Los agentes y binarios candidatos se ejecutan como procesos ordinarios bajo tu usuario (no es un sandbox VM); consulta la [guía del ecosistema](../docs/3-ecosystem/highbay/#architecture)."
