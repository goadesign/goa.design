# Goa-AI Section
goa_ai_section_title: "Goa-AI: Agentes como Sistemas"
goa_ai_section_description: "Goa-AI lleva la filosofía de diseño primero a los sistemas de agentes. Construye agentes robustos y con tipos seguros que se componen limpiamente y escalan sin esfuerzo."
goa_ai_section_features: |
  <ul>
    <li><strong>Contratos de Diseño Primero:</strong> Esquemas fuertes y sugerencias de auto-reparación para uso robusto de herramientas</li>
    <li><strong>Agentes como Sistemas:</strong> Composición mediante Árboles de Ejecución, no cadenas planas</li>
    <li><strong>Streaming Estructurado:</strong> Eventos tipados para interfaces ricas y conscientes de la topología</li>
    <li><strong>Listo para Producción:</strong> Durabilidad Temporal, políticas e integración MCP</li>
  </ul>
