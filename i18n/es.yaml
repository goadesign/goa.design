highbay_contrast_heading: "El mismo prompt. Cuatro fallos que las salvaguardas evitan."
highbay_contrast_intro: "Compara una sesión libre de un agente de programación frente a la guía y el compilador de contratos de Highbay:"
highbay_solo_title: "Agente libre sin contrato"
highbay_solo_chip_gate: "Código ad hoc · una sola ventana de contexto"
highbay_solo_row_1_title: "Deriva de estructura entre repositorios"
highbay_solo_row_1_text: "Conecta routers, middlewares y logs de forma distinta en cada servicio, obligando al agente a releer fontanería a medida en cada turno."
highbay_solo_row_2_title: "Sincronización manual de cuatro archivos"
highbay_solo_row_2_text: "Añadir un campo obliga a editar a mano el manejador, el validador, OpenAPI y el esquema JSON de MCP gastando tokens de salida."
highbay_solo_row_3_title: "Pasa con 20 líneas, falla con 50 MB"
highbay_solo_row_3_text: "Listas de logs sin límite y esperas en memoria pasan las pruebas unitarias, pero desbordan el contexto con logs reales o se pierden al reiniciar."
highbay_solo_row_4_title: "Suposiciones fijadas en pruebas en verde"
highbay_solo_row_4_text: "Si nadie pregunta quién puede aprobar `/runs/{id}/approval`, una sola sesión asume *cualquier usuario autenticado* y escribe pruebas en verde para su suposición."
highbay_with_title: "Con Highbay"
highbay_with_suite: "Guía compartida · contrato compilado · verificación separada"
highbay_with_row_1_title: "Estructura de servicio estandarizada"
highbay_with_row_1_text: "Cada servicio parte de la misma organización y convenciones integradas para autenticación, trazas, streams y grupos de workers."
highbay_with_row_2_title: "Edita un contrato, compila los cuatro"
highbay_with_row_2_text: "`highbay gen` regenera HTTP, esquemas MCP y OpenAPI 3 sin tokens de modelo; el compilador detecta manejadores desfasados."
highbay_with_row_3_title: "Límites y puertas de aprobación compilados"
highbay_with_row_3_text: "`Inject(\"org_id\")` enlaza etiquetas de ejecución de confianza (los manejadores validan el acceso por tenant), `BoundedResult` + límites de página acotan cursores y `Confirmation` pausa `rollback_production` (de forma duradera con Temporal)."
highbay_with_row_4_title: "Change Card + copia de pruebas separada"
highbay_with_row_4_text: "Confirmas las reglas de staging frente a producción en una **Change Card** de una página, y un segundo agente comprueba `viewer → 403`."
