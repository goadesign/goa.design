highbay_showcase_intro: "Revisa cuatro puntos de control, habla con tus agentes y observa terminales en vivo en un solo espacio del navegador."
highbay_zoom_label: "Tamaño completo ↗"
highbay_tab_agree: "1. Agree"
highbay_tab_arch: "2. Architecture"
highbay_tab_check: "3. Verify · Fallido"
highbay_tab_approve: "4. Approve · Merge"
highbay_agree_pin_1: "Define las reglas de rollback en staging y producción en una ficha de una página."
highbay_agree_alt: "Vista Agree de Highbay mostrando la Change Card y el botón Confirm Intent."
highbay_arch_pin_1: "Revisa el diagrama de arquitectura compilado, las ejecuciones duraderas y los límites antes de programar."
highbay_arch_view_alt: "Vista Architecture de Highbay mostrando grafo de servicios y agentes, Temporal y toolsets MCP."
highbay_check_pin_1: "Las pruebas de escenario bloquean la fusión cuando `viewer` recibe `200` en vez de `403`."
highbay_check_alt: "Vista Verify de Highbay mostrando Run 1 fallido al esperar 403 Forbidden y recibir 200 OK."
highbay_approve_pin_1: "Cuando pasan los cuatro escenarios, fusiona en tu rama o abre un PR."
highbay_approve_alt: "Vista Approve de Highbay mostrando 4 de 4 escenarios superados y botón Merge."
highbay_contrast_heading: "Sin Highbay vs. con Highbay"
highbay_solo_title: "Agente sin contrato"
highbay_with_title: "Con Highbay"
highbay_solo_row_1_title: "Cableado distinto en cada repo"
highbay_solo_row_1_text: "Cada sesión elige su propio router, middleware de autenticación y formato de errores."
highbay_with_row_1_title: "Misma arquitectura Go en cada repo"
highbay_with_row_1_text: "Las reglas integradas estandarizan autenticación, trazas, gestión de errores y estructura en cada servicio."
highbay_solo_row_2_title: "Cuatro archivos por cambio"
highbay_solo_row_2_text: "Un campo nuevo obliga a editar a mano manejadores, validadores, OpenAPI y JSON MCP."
highbay_with_row_2_title: "Edita el contrato una vez"
highbay_with_row_2_text: "`highbay gen` recompila servidores, especificaciones y esquemas con cero tokens."
highbay_solo_row_3_title: "El agente evalúa sus suposiciones"
highbay_solo_row_3_text: "Una sola sesión inventa reglas de permisos y escribe pruebas que las dan por buenas."
highbay_with_row_3_title: "Contrato bloqueado y probador aparte"
highbay_with_row_3_text: "Highbay rechaza cambios del constructor en el contrato o las pruebas, y un segundo agente valida los manejadores en su propio worktree."
highbay_walkthrough_heading: "Dentro de cada repositorio"
highbay_walkthrough_intro: "Tu contrato, el código de servidor generado y las pruebas de aceptación viven en paquetes Go separados, como en el [ejemplo Orders](https://github.com/goadesign/highbay/tree/main/examples/orders)."
highbay_role_guide: "1. Contrato en design/"
highbay_role_guide_caption: "Tu agente redacta tipos de petición, aislamiento por cliente y reglas de aprobación humana; tú los confirmas."
highbay_role_codegen: "2. Go generado en gen/"
highbay_role_codegen_caption: "Compila servidores HTTP y MCP, especificaciones OpenAPI, validación y paginación con cero tokens."
highbay_role_tests: "3. Pruebas de escenario en eval/"
highbay_role_tests_caption: "Un segundo agente escribe pruebas de aceptación en un worktree Git separado que el constructor tiene bloqueado."
highbay_cap_heading: "Lo que cablea el playbook en Go integrado"
highbay_cap_intro: "Los agentes siguen una misma base de producción en Go y añaden Redis o Temporal únicamente cuando una función los necesita."
highbay_cap_auth_title: "Autenticación y aislamiento de clientes"
highbay_cap_auth_body: "Valida JWT, OAuth2 y claves API en el gateway y asocia en el servidor la identidad del cliente para impedir suplantaciones desde el prompt."
highbay_cap_obs_title: "Trazas, métricas y estado de salud"
highbay_cap_obs_body: "Instrumenta llamadas HTTP, gRPC y de modelos con trazas OpenTelemetry, logs estructurados y chequeos de disponibilidad desde el primer commit."
highbay_cap_stream_title: "Streams de eventos y límites de tasa"
highbay_cap_stream_body: "Comparte límites de tasa de tokens, streams de eventos y grupos de workers sobre Redis al escalar más allá de una instancia."
highbay_cap_durable_title: "Aprobaciones humanas y ejecuciones duraderas"
highbay_cap_durable_body: "Limita llamadas a herramientas y respuestas grandes, pausa acciones críticas hasta recibir aprobación humana y reanuda tareas largas tras reinicios."
