home_mcp_result_server_text: "Manejadores MCP sobre HTTP Streamable conectados directamente a tus endpoints Goa."
home_mcp_result_client: "Clientes tipados"
home_mcp_result_client_text: "Invoca herramientas MCP y lee recursos con métodos Go generados."
home_mcp_result_schemas: "Esquemas de herramientas"
home_mcp_result_schemas_text: "JSON Schemas de entrada y salida derivados de las mismas reglas de `LookupPayload`."
home_mcp_result_validation: "Validación y códecs"
home_mcp_result_validation_text: "Rechaza argumentos mal formados del modelo con pistas de reintento antes de ejecutar tu manejador."
home_mcp_humans: "Un contrato para revisar"
home_mcp_humans_text: "Revisa tipos, validación y seguridad en `design/catalog.go`. Implementa `Lookup` una vez en Go y regenera `gen/` cuando cambien los requisitos."
home_mcp_llms: "Trabajo claro para agentes de programación"
home_mcp_llms_text: "Tu agente de programación edita `design/` e `internal/` mientras `gen/` queda intacto, convirtiendo cualquier desajuste de esquema en errores inmediatos del compilador Go."
home_mcp_capabilities: "Admite servidores de recursos OAuth, intercambios interactivos de entrada, Tasks duraderas, MCP Apps y Skills."

home_registry_heading: "Aloja un registro para tus herramientas."
home_registry_text: "Ejecuta el servidor de registro en clúster de Goa-AI como catálogo compartido y pasarela de invocación. Los servicios publican toolsets, los agentes buscan y cargan esquemas bajo demanda en lugar de inflar cada prompt, y las llamadas se enrutan a proveedores sanos sobre Redis y [Pulse](/es/docs/3-ecosystem/pulse/) (la biblioteca de streaming y mapas replicados en Redis de Goa)."
home_registry_cta: "Alojar un registro de herramientas"
