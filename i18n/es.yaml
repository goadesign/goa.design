# Shared Goa ecosystem presentation
home_heading: "Los agentes razonan."
home_heading_second: "Goa genera."
home_intro: "Goa es un framework Go que da a los agentes de programación menos código que escribir y un único contrato sobre el que razonar. Compila un diseño en Go en servidores HTTP, gRPC y JSON-RPC, clientes tipados, validación y especificaciones OpenAPI 3, o usa Goa-AI para crear agentes de IA de producto, servidores MCP y registros de herramientas."
home_hero_point_1: "**Servicios (`Goa`):** Compila un único `design/*.go` en servidores `net/http`, gRPC y JSON-RPC, clientes tipados, validación y OpenAPI 3.2."
home_hero_point_2: "**Agentes y MCP (`Goa-AI`):** Vincula métodos como herramientas tipadas (`BindTo`), expón servidores MCP y ejecuta en memoria o en Temporal."
home_hero_point_3: "**Pensado para agentes:** Regenera `gen/` con cero tokens de salida del LLM; el compilador Go señala cualquier manejador desactualizado."
