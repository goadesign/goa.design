home_faq_heading: "Antes de empezar"

home_faq_codegen_q: "¿Por qué usar Goa si un agente puede escribir el código?"

home_faq_codegen_a: "Un agente escribe código por inferencia; Goa deriva el código de los contratos del diseño. Cada servidor, cliente, códec y esquema generado es código que el modelo no necesita escribir por separado. El diseño concentra el contexto, la estructura sigue siendo coherente y el compilador detecta implementaciones incompatibles tras los cambios. El agente sigue escribiendo lógica de negocio y pruebas."

home_faq_difference_q: "¿Qué diferencia hay entre Goa y Goa-AI?"

home_faq_difference_a: "Goa diseña y genera API de servicios Go: HTTP, gRPC, JSON-RPC, clientes, validación y especificaciones. Goa-AI amplía el mismo DSL y generador con herramientas tipadas, agentes de IA, resultados estructurados, evaluaciones y servidores MCP. También ofrece un runtime de agentes y un servidor de registro que puedes alojar. Puedes empezar con cualquiera; Goa-AI no requiere un servicio Goa desplegado por separado."

home_faq_tokens_q: "¿Cómo reduce la generación el trabajo del LLM?"

home_faq_tokens_a: "Goa genera el código de transporte y contratos sin que un LLM redacte esos archivos. Así elimina una categoría de trabajo con tokens de salida. El ahorro total depende de la tarea, el modelo, el contexto y las iteraciones; compara cambios completos, incluidas pruebas y revisión, para medir el efecto en tu proyecto."

home_faq_mcp_q: "¿Puedo usar Goa-AI solo para crear un servidor MCP?"

home_faq_mcp_a: "Sí. Añade declaraciones MCP a un servicio Goa para generar un servidor con herramientas, recursos y plantillas de prompts. Implementa los métodos detrás de los adaptadores generados. No necesitas ejecutar un agente Goa-AI para servir MCP."

