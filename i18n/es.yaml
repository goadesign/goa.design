chorus_session_heading: "Detectado en revisión cruzada: Chorus construido con Chorus"
chorus_session_caption: "Codex, el agente líder, explica el plan al responsable del proyecto."
chorus_session_result: "En `#chorus`, Opus añadió `chorus ui` mientras Gemini actualizaba los carriles de participantes. Al revisar ambos diffs por Chorus antes de fusionar, Codex detectó un fallo con comentarios en `config.toml` que borraba la URL de otro servidor MCP ([commit `62b8181`](https://github.com/goadesign/chorus/commit/62b8181))."
chorus_faq_replace_q: "¿Chorus sustituye a mi agente de programación o editor?"
