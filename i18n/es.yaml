highbay_compare_solo_text: "Las reglas en Markdown derivan entre PRs y el mismo agente sigue evaluando su propio código."
highbay_compare_speckit: "SDKs de agentes en código"
highbay_compare_speckit_text: "Los esquemas viven en la app. Highbay compila HTTP, OpenAPI 3 y MCP desde un solo contrato."
highbay_compare_workspaces: "Ejecutores paralelos de worktrees"
highbay_compare_workspaces_text: "En vez de comparar ramas rivales a mano, un constructor y un probador comparten un contrato."
highbay_faq_scope_q: "¿Pueden apps web, Python o TypeScript llamar a servicios Highbay?"
highbay_faq_scope_a: "Sí. Highbay compila binarios Go estándar con endpoints HTTP, OpenAPI 3 y MCP para cualquier cliente."
highbay_faq_holdouts_q: "¿Qué impide que el constructor modifique el contrato o las pruebas?"
highbay_faq_holdouts_a: "Highbay regenera `design/` desde tu revisión confirmada y rechaza commits que alteren `design/` o `eval/`."
highbay_faq_local_q: "¿Necesita Highbay una cuenta en la nube o clave API de modelos?"
highbay_faq_local_a: "No. Los agentes usan sus sesiones existentes en el CLI y `eval/` usa dobles deterministas por defecto."
highbay_faq_sandbox_q: "¿Funciona en repos existentes y cómo corren las pruebas locales?"
highbay_faq_sandbox_a: "Crea servicios nuevos o amplía repos Goa, ejecuta comprobaciones en Docker y fusiona en tu rama o PR. Ver [Arquitectura y configuración](../docs/3-ecosystem/highbay/#architecture)."
highbay_serverdex_alt: "Highbay en Serverdex"
