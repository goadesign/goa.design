highbay_walkthrough_heading: "Dentro de cada repositorio"
highbay_walkthrough_intro: "Tu contrato, el código de servidor generado y las pruebas de aceptación viven en paquetes Go separados, como en el [ejemplo Orders](https://github.com/goadesign/highbay/tree/main/examples/orders)."
highbay_role_guide: "1. Contrato en design/"
highbay_role_guide_caption: "Tu agente redacta tipos de petición, aislamiento por cliente y reglas de aprobación humana; tú los confirmas."
highbay_role_codegen: "2. Go generado en gen/"
highbay_role_codegen_caption: "Compila servidores HTTP y MCP, especificaciones OpenAPI, validación y paginación con cero tokens."
highbay_role_tests: "3. Pruebas de escenario en eval/"
highbay_role_tests_caption: "Un segundo agente escribe pruebas de aceptación en un worktree Git separado que el constructor tiene bloqueado."
highbay_cap_heading: "Lo que cablea el playbook en Go integrado"
highbay_cap_intro: "Los agentes siguen una misma base de producción en Go y añaden Redis o Temporal únicamente cuando una función los necesita."
highbay_cap_auth_title: "Autenticación y aislamiento de clientes"
highbay_cap_auth_body: "Valida JWT, OAuth2 y claves API en el gateway y asocia en el servidor la identidad del cliente para impedir suplantaciones desde el prompt."
highbay_cap_obs_title: "Trazas, métricas y estado de salud"
highbay_cap_obs_body: "Instrumenta llamadas HTTP, gRPC y de modelos con trazas OpenTelemetry, logs estructurados y chequeos de disponibilidad desde el primer commit."
highbay_cap_stream_title: "Streams de eventos y límites de tasa"
highbay_cap_stream_body: "Comparte límites de tasa de tokens, streams de eventos y grupos de workers sobre Redis al escalar más allá de una instancia."
highbay_cap_durable_title: "Aprobaciones humanas y ejecuciones duraderas"
highbay_cap_durable_body: "Limita llamadas a herramientas y respuestas grandes, pausa acciones críticas hasta recibir aprobación humana y reanuda tareas largas tras reinicios."
