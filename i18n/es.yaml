highbay_faq_scope_q: "¿Pueden apps web, Python o TypeScript llamar a servicios Highbay?"
highbay_faq_scope_a: "Sí. Highbay compila binarios Go estándar con endpoints HTTP, OpenAPI 3 y MCP para cualquier cliente."
highbay_faq_holdouts_q: "¿Qué impide que el constructor modifique el contrato o las pruebas?"
highbay_faq_holdouts_a: "Highbay restaura tu contrato confirmado antes de verificar y rechaza cualquier commit que modifique el contrato o la suite de pruebas."
highbay_faq_local_q: "¿Necesita Highbay una cuenta en la nube o clave API de modelos?"
highbay_faq_local_a: "No. Los agentes usan sus sesiones existentes en el CLI y las pruebas de escenario corren en local contra dobles deterministas."
highbay_faq_sandbox_q: "¿Funciona en repos existentes y cómo corren las pruebas locales?"
highbay_faq_sandbox_a: "Crea servicios nuevos o amplía repos Goa, ejecuta comprobaciones en Docker y fusiona en tu rama o PR. Ver [Arquitectura y configuración](../docs/3-ecosystem/highbay/#architecture)."
