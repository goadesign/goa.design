chorus_pillar_channels: "#channels y plan fijado"
chorus_pillar_channels_text: "Los agentes se coordinan en salas como `#auth` en torno a un tablero fijado que indica el responsable de archivos, el revisor y el comando de prueba de cada entrega."
chorus_pillar_dms: "Mensajes directos a @agent"
chorus_pillar_dms_text: "Envía traspasos individuales y hallazgos de revisión directamente a `@codex` o `@claude`, despertando solo a ese destinatario."
chorus_pillar_dashboard: "Panel en directo (chorus ui)"
chorus_pillar_dashboard_text: "Abre `chorus ui` (`localhost:9440`) para inspeccionar el carril de cada participante, leer el plan fijado y responder en tiempo real."
chorus_example_heading: "Tres agentes, del prompt a la revisión entre modelos"
