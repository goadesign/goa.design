highbay_compare_solo_text: "Markdown の規約は PR ごとに崩れ、同じエージェントが自分のコードを採点し続けます。"
highbay_compare_speckit: "コード優先のエージェント SDK"
highbay_compare_speckit_text: "スキーマがアプリ内に散在します。Highbay は 1 つの契約から HTTP・OpenAPI 3・MCP を生成します。"
highbay_compare_workspaces: "並列 worktree ランナー"
highbay_compare_workspaces_text: "競合ブランチを手作業で見比べる代わりに、実装担当とテスト担当が 1 つの契約を共有します。"
highbay_faq_scope_q: "Python・TypeScript・Web アプリから呼び出せますか？"
highbay_faq_scope_a: "はい。標準の HTTP・OpenAPI 3・MCP エンドポイントを備えた Go バイナリを出力します。"
highbay_faq_holdouts_q: "実装エージェントが契約やテストを書き換えない仕組みは？"
highbay_faq_holdouts_a: "確定済みリビジョンから `design/` を再生成し、`design/` や `eval/` を変更するコミットを拒否します。"
highbay_faq_local_q: "クラウドアカウントやモデル API キーは必要ですか？"
highbay_faq_local_a: "不要です。エージェントは既存の CLI ログインを使い、`eval/` は既定で決定論的モック上で動作します。"
highbay_faq_sandbox_q: "既存リポジトリへの適用やローカル検査の仕組みは？"
highbay_faq_sandbox_a: "新規作成と既存 Goa リポジトリの拡張に対応し、Docker で検査後にブランチや PR へ反映します。[アーキテクチャと設定](../docs/3-ecosystem/highbay/#architecture)を参照してください。"
