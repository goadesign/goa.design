highbay_solo_title: "単独のコーディングエージェント"
highbay_solo_chip_gate: "場当たり的な実装 · 単一のコンテキストウィンドウ"
highbay_solo_row_1_title: "リポジトリごとの構成のばらつき"
highbay_solo_row_1_text: "サービスごとにルーターやミドルウェア、ログ処理の書き方が変わり、毎ターン独自の基盤コードを読み直すことになります。"
highbay_solo_row_2_title: "Day 2 で発生する 4 ファイル手動同期"
highbay_solo_row_2_text: "フィールドを 1 つ追加するたびに、ハンドラー・バリデーター・OpenAPI 仕様・MCP JSON スキーマを出力トークンで手編集する必要があります。"
highbay_solo_row_3_title: "20 行では通り、50 MB で破綻"
highbay_solo_row_3_text: "上限のないログ配列やオンメモリ待機は単体テストを通過しても、障害時の巨大ログでコンテキスト上限を超えたり再起動で消えたりします。"
highbay_solo_row_4_title: "勝手な推測がグリーンテストとして固定化"
highbay_solo_row_4_text: "`/runs/{id}/approval` の権限ルールを確認しないまま、*ログイン済みなら誰でも承認可*と推測し、その前提で通るテストを書いてしまいます。"
highbay_with_title: "Highbay を使った場合"
