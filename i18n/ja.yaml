highbay_contrast_opt_withtax: "税込みの請求合計"
highbay_contrast_order: "**違いが現れる注文：** 商品 `$48.00` ＋ 消費税 `$4.32` ＝ 請求額 `$52.32`。"
highbay_solo_title: "1 つのエージェントで実装とテスト"
highbay_solo_suite: "2 / 2 合格"
highbay_solo_tag: "どちらの回答でも同じ"
highbay_solo_step_1: "質問しないまま、請求合計で比較："
highbay_solo_step_2: "同じ思い込みから 2 つのテストを作成：`$40` の注文はクレジット、`$60` の注文は承認待ち。"
highbay_solo_chip_pretax: "誤動作のままグリーン"
highbay_solo_verdict_pretax: "$48 の注文は責任者待ちになります。望んでいたのは即時クレジットですが、テストはひとつも落ちません。"
highbay_solo_chip_withtax: "たまたま正解"
highbay_solo_verdict_withtax: "$48 の注文は望みどおり責任者待ちになりますが、推測が当たっただけです。逆の意図でもテストは通っていました。"
highbay_with_title: "Highbay を使った場合"
highbay_with_suite_pretax: "実行 1: 2/3 → 修正後: 3/3"
highbay_with_suite: "3 / 3 合格"
highbay_with_tag: "あなたの回答から作成"
highbay_with_step_1: "実装が始まる前に確認：**$50 の上限に消費税を含めますか？** と尋ね、各選択肢での `$48` 注文の扱いを並べて表示します。"
highbay_with_picked_pretax: "あなたの選択：**税抜き** → `$48.00` の注文は `$52.32` の即時クレジット。"
highbay_with_picked_withtax: "あなたの選択：**税込み** → `$48.00 + $4.32` の注文は責任者の承認待ち。"
highbay_with_run1_pretax: "実装者が同じ推測（`TotalCents <= 5000`）をした場合：**実行 1、2 / 3**。期待値は `$52.32` クレジット、実際は責任者待ち。承認不可。"
highbay_with_run2_pretax: "**実行 2、修正後**（`SubtotalCents <= 5000`）：**3 / 3 合格**。承認可能。"
highbay_with_run_withtax: "**実行 1**（`SubtotalCents+TaxCents <= 5000`）：**3 / 3 合格**。承認可能。"
highbay_with_chip_pretax: "レビュー前に検出"
highbay_with_chip: "選んだ仕様を検証"
highbay_with_verdict_pretax: "$48 の注文は選んだとおり $52.32 のクレジットになります。"
highbay_with_verdict_withtax: "$48 の注文は選んだとおり責任者待ちになります。$40 と $60 の間に埋もれさせず、その注文自体をテストします。"
highbay_contrast_summary: "単独エージェントのテストはどちらのルールでも通るため、2 つの意図を見分けられません。Highbay のテストはあなたの回答から書かれるため見分けられます。"
highbay_contrast_note: "このページ向けに作成したインタラクティブ図解です。実際の Highbay では、回答がドラフトと異なる場合、確定前にコーディングエージェントがドラフトを改訂します。実際の記録がすぐ次に続きます。"
highbay_trial_kicker: "モデレート付きトライアルより · 2026 年 11 月"
highbay_trial_heading: "実際に不具合を捕まえました。"
highbay_trial_stat_1_val: "32"
highbay_trial_stat_1_lbl: "シナリオ内の名前付きチェック"
highbay_trial_stat_2_val: "2 件失敗"
highbay_trial_stat_2_lbl: "実装者の最初のコミット"
highbay_trial_stat_3_val: "7/8 → 8/8"
highbay_trial_stat_3_lbl: "修正前後の合格シナリオ数"
highbay_trial_stat_4_val: "約 3 分"
highbay_trial_stat_4_lbl: "失敗の検出から修正・合格まで"
highbay_trial_body: "不動産出品サンプルアプリを題材に、初回利用の開発者役を演じる AI エージェントで Highbay を試しました。ある変更の要件は「出品者が掲載を取り下げたら、交渉中の各購入者に 1 度だけ通知してオファーを閉じる」というものでした。テスト作成者は 32 個の名前付きチェックを持つシナリオを作成し、実装者の最初のコミットはそのうち 2 つで失敗しました。オファーを続行できない理由がアシスタントに正しく伝わっていなかったためです。Highbay は 8 シナリオ中 7 つ合格と報告し、実装者が拒否応答を修正すると約 3 分後に同じスイートが 8 つ中 8 つ合格し、変更がマージされました。"
highbay_trial_note: "AI 参加者とスクリプト化されたモデルによるトライアルであり、本番障害の事例ではありません。"
