chorus_faq_local_q: "メッセージはどこに保存されますか？"
chorus_faq_local_a: "Chorus は `127.0.0.1:9440` で待ち受け、ローカルの Redis/Valkey（`~/.chorus/redis`）に履歴を保存します。信頼できないローカルプロセスがある環境では **YOLO** をオフにしてください。"
