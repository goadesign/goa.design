home_benefit_feedback: "契約のずれをコンパイルエラーで即検出"
home_benefit_feedback_text: "`design/` を更新して `goa gen` を再実行すれば、シグネチャが変わったハンドラーやクライアントを Go が即座に検出します。"

home_frameworks_heading: "サービスには Goa。エージェントと MCP には Goa-AI。"
home_service_title: "ひとつの契約。あらゆるトランスポート。"
home_service_text: "ペイロード、バリデーション、エラーを Go で一度宣言。標準の `net/http`、gRPC、JSON-RPC サーバー、型付きクライアント、OpenAPI 3 / Protobuf 仕様を生成します。"
home_service_docs: "Goa を詳しく見る"
home_service_transports: "1 つの設計からサーバー、型付き Go クライアント、CLI クライアントをコンパイル。"
home_service_streams: "設計に組み込まれたストリーミング"
home_service_contracts: "トランスポート境界での入力検証"
home_service_contracts_text: "必須フィールド、正規表現パターン、値の範囲、エラーステータスコード、OpenAPI 3.2、Protocol Buffers。"

home_agent_title: "型付きエージェント、MCP サーバー、永続ワークフロー。"
home_agent_text: "同じ Go DSL でツール利用型 AI エージェントと MCP サーバーを構築。インメモリでローカル検証後、OpenAI・Anthropic・Bedrock・Vertex AI・Temporal で実行できます。"
home_agent_docs: "Goa-AI を詳しく見る"
home_agent_contracts: "サービス検証の再利用と秘匿コンテキスト"
home_agent_contracts_text: "Goa メソッドをツール化し（`BindTo`）、サーバー専用のテナント ID を注入し（`Inject`）、ページ応答の上限を設定します（`BoundedResult`）。"
home_agent_composition: "マルチエージェントツリーと決定論的評価"
home_agent_composition_text: "予算上限付きで子エージェントを合成し、本番 LLM を呼ばずにツール軌跡を決定論的にテストできます。"
home_agent_execution: "承認ゲート、ストリーミング、単体 MCP サーバー"
home_agent_execution_text: "重要ツールを人間の承認で一時停止し（`Confirmation`）、型付きイベントを配信し、MCP 単体でも公開できます。"

home_mcp_heading: "サービスから MCP サーバーを構築。"
home_mcp_cta: "MCP サーバーを構築する"
home_mcp_caption: "LookupPayload の正規表現ルールは、HTTP/gRPC デコーダーと MCP tools/list の inputSchema の両方にコンパイルされます。"
home_mcp_design: "Goa の設計"
home_mcp_generated: "生成される MCP インターフェース"
home_mcp_contract: "ひとつの型付き契約"
home_mcp_result_server: "HTTP サーバー"
home_mcp_result_server_text: "Goa エンドポイントに直結された Streamable HTTP MCP ハンドラー。"
home_mcp_result_client: "型付きクライアント"
home_mcp_result_client_text: "生成された Go メソッドから MCP ツール呼び出しやリソース読み取りを実行。"
home_mcp_result_schemas: "ツールスキーマ"
home_mcp_result_schemas_text: "`LookupPayload` から導出される入出力 JSON Schema。"
home_mcp_result_validation: "検証とコーデック"
home_mcp_result_validation_text: "ハンドラー実行前に、不正な引数をリトライヒント付きで拒否。"
home_mcp_humans: "レビューする契約はひとつ"
home_mcp_humans_text: "`design/catalog.go` で型と認可をレビューし、`Lookup` を一度実装したら要件変更時に `gen/` を再生成します。"
home_mcp_llms: "コーディングエージェントに明確な編集範囲"
home_mcp_llms_text: "エージェントは `design/` と `internal/` だけを編集し `gen/` は読み取り専用。スキーマのずれは即 Go のコンパイルエラーになります。"
home_mcp_capabilities: "OAuth リソースサーバー、対話的な入力要求、永続 Tasks、MCP Apps、Skills に対応。"

home_registry_heading: "ツールレジストリを自社環境でホスト。"
home_registry_text: "Redis と [Pulse](/ja/docs/3-ecosystem/pulse/) 上のクラスター型ゲートウェイにツールセットを公開し、必要なスキーマだけをオンデマンドで読み込みます。"
home_registry_cta: "ツールレジストリを運用する"
home_registry_flow: "ツールプロバイダーとエージェントをレジストリが中継"
home_registry_node: "ツールレジストリ"
home_registry_node_text: "スキーマ検索 · 呼び出しルーティング · ヘルス追跡"
home_registry_consumers: "エージェントとアプリケーション"

home_compare_heading: "Goa・Goa-AI と他アプローチの比較"
home_compare_specs: "Protobuf・OpenAPI ツールチェーン (buf/Connect, oapi-codegen)"
home_compare_specs_text: "`buf` は `.proto`、`oapi-codegen` は YAML を対象とします。Goa は 1 つの Go パッケージから HTTP、gRPC、JSON-RPC、OpenAPI 3.2、MCP ツールセットを生成します。"
home_compare_mcp_sdk: "手書き配線の Go MCP SDK (go-sdk, mcp-go)"
home_compare_mcp_sdk_text: "構造体タグのハンドラーは API の制約を二重管理します。Goa サービスに `MCP(...)` を追加すれば同じ検証済み型と実装を再利用できます。"
home_compare_agent_sdk: "Python / TS エージェント SDK (LangGraph, OpenAI Agents SDK)"
home_compare_agent_sdk_text: "Goa-AI は型付き Go ツールコーデック、サーバー注入コンテキスト、承認ゲート、Temporal アクティビティを単一の静的 Go バイナリにコンパイルします。"

home_faq_heading: "始める前のよくある質問"
home_faq_codegen_q: "既存の Go リポジトリに段階導入できますか？gen/ はコミットしますか？"
home_faq_codegen_a: "どちらも可能です。`goa gen` は標準の `net/http` と `google.golang.org/grpc` コードを生成するため、既存ルートと並べてマウントし `gen/` をコミットできます。"
home_faq_difference_q: "Go 以外からはどう呼び出し、Goa-AI はいつ追加しますか？"
home_faq_difference_a: "TypeScript、Python、モバイルは生成された OpenAPI 3.2 と `.proto` を直接利用します。MCP ツール公開やエージェント実行時に Goa-AI を追加してください。"
home_faq_tokens_q: "Goa が向かないケースと評価方法は？"
home_faq_tokens_a: "使い捨てスクリプトには不要です。複数エンドポイントのサービスでは、[カタログの実装例](/ja/docs/ai-development/#one-design-two-entry-points)から実機能を 1 つ比較してください。"
home_faq_mcp_q: "MCP サーバーの公開だけに Goa-AI を使えますか？"
home_faq_mcp_a: "はい。Goa サービスに `MCP(...)` と `Tool(...)` を追加するだけで、エージェントループなしで JSON Schema と Streamable HTTP ハンドラーを生成できます。"

