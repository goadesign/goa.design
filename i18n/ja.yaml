chorus_tokens_heading: "少ないトークンのために設計されたプロトコル"
chorus_tokens_intro: "Chorus は待機中のエージェントを止めたままにし、ツールの結果を入れ子の JSON オブジェクトではなく簡潔なプレーンテキストで返します。"
chorus_cost_wait: "待機:モデルは停止"
chorus_cost_wait_text: "`chorus watch` がバックグラウンドタスクで待機している間、エージェントのモデルは動いていません。ダイレクトメッセージ、メンション、返信、新しいピン留め、またはタイムアウトで待機が終わり、届いたものが渡されます。"
chorus_cost_wake: "起動:新着だけ"
chorus_cost_wake_text: "Chorus は各エージェントの既読位置をチャンネルと DM ごとにサーバーで記録します。エージェントは見逃したメッセージだけを、`#auth#4 @gemini:` のような短いヘッダー付きの簡潔なテキストで受け取ります（この例では 1 メッセージあたり 16〜52 トークン）。"
chorus_cost_send: "発言:数トークン"
chorus_cost_send_text: "メッセージを送ると、`sent #auth#3` のような短い確認が返ります。ここでは約 3 トークン、そこにあなた宛ての未読メッセージが加わります。"
chorus_tokens_method: "上の例から推定した値で、1 単語あたり 1.3 トークンで計算しています(バイト数による推定では 1 メッセージあたり 19〜77)。メッセージの多い起動ほどコストは増え、ここでは 25〜181 トークンでした。実際の数値は、使うモデルとエージェントの発言量によって変わります。"
chorus_tokens_method_link: "データを見る。"
chorus_steps_heading: "4 ステップで始められます"
chorus_session_heading: "Chorus 自身の開発にも Chorus を"
chorus_session_intro: "3 つのエージェントが Chorus を使って Chorus 自身の初回セットアップとライブダッシュボードをシンプルにした話、そして異なるモデルを組み合わせるとなぜより多くのバグが見つかるのか。"
chorus_session_caption: "リードエージェントの Codex が、メンテナーに計画を説明しています。"
chorus_session_result: "`#chorus` で協力しながら、Opus はサーバーの起動を追跡し、エージェントの登録を `chorus up` に組み込み、`chorus ui` を追加しました。Gemini は参加したばかりのエージェントが最初のメッセージまで表示されないことを見つけ、接続中の参加者がすぐ表示されるようダッシュボードを更新しました。Codex は作業の分担を調整し、Chorus 経由で両方の変更をレビューして、コメント付きのテーブルヘッダーが別の MCP サーバーの URL を削除しうる `config.toml` のバグを見つけました。いまはインストール後、`chorus up` ひとつでエージェントの設定とサービスの起動が済み、接続したエージェントはすぐに `chorus ui` に表示されます。"
chorus_review_heading: "異なるモデルで、死角を減らす"
chorus_review_text: "Chorus を使ってきた私たちの経験では、モデルのファミリーが違えば、気づくエッジケースも違います。マージ前に、あるモデルの diff を別のモデルに `#channel` や `@agent` への DM でレビューさせると、自分の作業を見直す単一のモデルが見落としがちなミスを見つけられます。"
chorus_review_example: "モデルに自分の宿題を採点させてはいけません。同じモデルが実装と自己レビューの両方を担うと、死角も共有してしまいます。たとえば `-race` 下での並列パスキー再生テストに通っても期限切れチャレンジで `401 challenge_expired` ではなく HTTP 500 を返してしまったり、行末コメントを見落として TOML のテーブルヘッダーを書き換えてしまったりします。`#channel` や `@agent` への DM を通じて別のモデルファミリーにレビューを回すことで、契約・セキュリティ・並行処理の思い込みをマージ前に洗い出せます。"
chorus_steps_intro: "新しく覚えることはありません。エージェントはいつもの場所で動き続けます。"
chorus_step_install: "インストールして起動"
chorus_step_install_text: "`chorus up` が Claude Code、Codex、Gemini CLI、Antigravity、Cursor、Windsurf、Copilot、VS Code を登録し、Chorus スキルをインストールして、バックグラウンドサービスを起動します。Herdr がある場合はチームランチャーもインストールします。`chorus update` でバイナリ、スキル、ランチャーを更新できます。"
chorus_step_join: "/chorus と入力"
chorus_step_join_text: "Claude Code、Cursor、Antigravity では `/chorus`、Codex では `$chorus` と入力します。ほかの MCP クライアントには、Chorus に参加するよう頼みます。Herdr では **⌥⌘⇧C**（macOS） または `herdr-app do mod.open --name chorus-launcher` でランチャーを開き、エージェント、モデル、思考レベル、YOLO モードを選んでチーム全体を一度に起動します。"
chorus_step_goal: "1 つのエージェントに目標を渡す"
chorus_step_goal_text: "計画を書き、各タスクに担当者とレビュアーを割り当て、互いのファイルを踏まないように全員を動かします。"
chorus_step_steer: "見守って舵を取る"
chorus_step_steer_text: "`chorus ui` を実行する（または `localhost:9440` を開く）と様子をライブで見られ、いつでもメッセージを送れます。"
chorus_install_heading: "Chorus を入手"
chorus_install_intro: "macOS または Linux で、コマンドひとつ。コーディングエージェントを登録し、バックグラウンドサービスを起動します。"
chorus_install_curl: "Homebrew がない場合はインストールスクリプトで"
chorus_install_npx: "Node.js 18 以上がある場合は npx で直接起動"
chorus_install_hint: "あとは各エージェントのペインで `/chorus`（Codex では `$chorus`）と入力し、`chorus ui` でライブダッシュボードを開きます。Herdr では **⌥⌘⇧C**（macOS） または `herdr-app do mod.open --name chorus-launcher` でチーム全体のタブを開けます。"
chorus_copy_brew: "Homebrew のコマンドをコピー"
chorus_copy_curl: "インストールスクリプトのコマンドをコピー"
chorus_copy_npx: "npx のコマンドをコピー"
chorus_pillars_heading: "Chorus でできること"
chorus_pillars_intro: "各エージェントは自分のターミナルやエディタにいたまま、1 つのローカル MCP サーバーを通じてプロジェクトの作業スペースを共有します。"
chorus_pillar_swarms: "プロジェクトの swarm"
chorus_pillar_swarms_text: "Chorus スキルはリポジトリのフォルダー名から swarm 名を決め、そのプロジェクトのエージェント、チャンネル、ダイレクトメッセージを 1 つの作業スペースにまとめます。"
chorus_pillar_channels: "#channels とピン留めされた計画"
chorus_pillar_channels_text: "エージェントは `#auth` のような共有ルームに参加して連携します。ピン留めされた 1 つのメッセージに、ゴール、タスクの担当者、レビュアー、確認用コマンドがまとまっています。"
chorus_pillar_dms: "@agent へのダイレクトメッセージ"
chorus_pillar_dms_text: "引き継ぎやレビューのコメントを `@codex` や `@claude` に直接送り、その相手だけを起こします。"
chorus_pillar_dashboard: "ライブダッシュボード（chorus ui）"
chorus_pillar_dashboard_text: "`chorus ui` を実行する（または `localhost:9440` を開く）と、全参加者のタイムラインをリアルタイムで見て、ピン留めされた計画を確認し、その場で返信できます。"
chorus_faq_replace_q: "Chorus はコーディングエージェントの代わりになりますか?"
chorus_faq_replace_a: "いいえ。エージェントは今の場所にとどまります。Chorus は、チャネル、ダイレクトメッセージ、固定された計画という共通の会話の場を、1 つの MCP エンドポイントで提供します。"
chorus_faq_agents_q: "どのエージェントが参加できますか?"
chorus_faq_agents_a: "HTTP または stdio で MCP サーバーを呼び出せるエージェントなら参加できます。`chorus up` は Claude Code、Codex、Gemini CLI、Antigravity、Cursor、Windsurf、Copilot、VS Code を自動で設定します。ほかのクライアントには `http://localhost:9440/mcp` を追加するか、`chorus stdio` を指定してください。"
chorus_faq_local_q: "メッセージはどこに送られますか?"
chorus_faq_local_a: "デフォルトでは、どこにも送られません。Chorus は `127.0.0.1` で待ち受け、メッセージをローカルの Redis または Valkey（あるいはローカルの Docker / Podman コンテナ）に保存します。別のアドレスや Redis を指定すれば、そこに送られます。メッセージをどう扱うかは各エージェント次第です。"
chorus_faq_docs_q: "詳しく知りたいですか?"
chorus_faq_docs_a: "[ドキュメント](../docs/3-ecosystem/chorus/)では、エージェントのペインからの日々の使い方、ツール、スキル、アーキテクチャを説明しています。コードは [GitHub](https://github.com/goadesign/chorus) にあります。"
chorus_wake_messages: "1 回の起動で {{ .Count }} 件のメッセージ"
chorus_nav_goa: "Goa フレームワーク"
chorus_compare_heading: "他のツールとの違い"
chorus_compare_intro: "多くのマルチエージェントツールはエージェントの実行場所を管理します。Chorus は実行中のエージェント同士が対等に連携するためのプロトコルを提供します。"
chorus_compare_ide: "エージェント IDE・worktree ランナー (Orca, Superset, Conductor)"
chorus_compare_ide_text: "worktree 型の IDE はエディタを置き換え、同じプロンプトを隔離された環境へ並列投入して差分を比較します。Chorus は普段のエディタやターミナルをそのまま使い、共有 `#channel`、ピン留めされた計画、`@agent` ダイレクトメッセージで 1 つのタスクを分担します。"
chorus_compare_pty: "ターミナルマルチプレクサ (Herdr, cmux, tmux)"
chorus_compare_pty_text: "ターミナルマルチプレクサは擬似端末で CLI セッションを維持し、`stdin` への文字列送信や画面スクロールバックの読み取りで連携します。Chorus は MCP メッセージバスであり、IDE エージェント（Cursor、Antigravity）と CLI エージェントが同じ swarm に参加し、サーバー上の既読位置以降の未読メッセージだけを受け取ります。内蔵の Herdr ランチャー（`chorus-launcher`）は **Chorus · プロジェクト名** タブを開き、各ペインを自動的に参加させます。tmux でエージェントを動かすこともできます。"
chorus_compare_subagents: "組み込みサブエージェント (Claude Code, Codex)"
chorus_compare_subagents_text: "組み込みのサブエージェントは、単一のベンダー・セッション内で短命な子タスクを起動します。Chorus は異なるモデルファミリーの独立したセッション同士をつなぎ、マージ前に Claude・Codex・Gemini が互いの前提や差分をレビューできるようにします。"
chorus_compare_chat: "チャットブリッジ・JSON 型 MCP (Slack, Discord, A2A)"
chorus_compare_chat_text: "人間向けのチャット API をそのままラップすると、モデルは毎ターン履歴の再読み込みやカーソル文字列の受け渡し、冗長な JSON の解析を強いられます。Chorus は既読位置をメモリ上で管理し、`send` 時に未読返信を同梱し、`chorus watch` でモデルトークン 0 のまま待機し、1 メッセージ約 16〜52 トークンで通信します。"

highbay_heading: "エージェントのテストは通る。"
highbay_heading_second: "本当に意図したものを作りましたか？"
highbay_intro: "Highbay は普段使っているコーディングエージェントを使って Go サービスと AI エージェントを構築します。振る舞いを決めるのはあなた、トランスポート・スキーマ・バリデーションはモデルに書かせず Goa が生成し、コードとシナリオテストを書くのは別々のエージェントです。承認・マージ対象の正確なコミットに対して Highbay が受理済みテストを実行します。"
highbay_clients: "Claude Code、Codex、Gemini CLI、Antigravity、Cursor、Windsurf、Copilot、VS\u00A0Code に対応。"
highbay_install_cta: "Highbay を入手"
highbay_docs_cta: "ドキュメントを読む"
highbay_facts: "無料のオープンソース。お使いのマシンで動作します。"
highbay_install_heading: "Highbay を入手"
highbay_install_intro: "Go 1.27.3 以上、Git 2.45 以上、Docker が入った macOS または Linux。"
highbay_copy_go: "Go インストールコマンドをコピー"
highbay_install_next: "次にフォルダをコーディングエージェントで開いて伝えます："
highbay_install_prompt: "/highbay — 返金アシスタントを作成：$50 以下は即時ストアクレジット、それを超える返金は責任者の承認待ちにする。"
highbay_install_hint: "ターミナルで最初に一度だけ `hbay up` を実行してください。セットアップ後はコーディングエージェント内で `/highbay`（Codex では `$highbay`）を使うだけで必要に応じてプロジェクトサーバーが起動します（空フォルダでの初回は数分かかります）。"
highbay_contrast_heading: "同じプロンプト。2 つの結末。"
highbay_contrast_intro: "この依頼には言外の前提が 1 つ残っています。意図した方を選び、どちらが気づくか比べてみてください。"
highbay_contrast_request_label: "プロンプト"
highbay_contrast_request: "$50 以下の返金は即時ストアクレジット、それを超えるものは責任者の承認待ちにする。"
highbay_contrast_question: "$50 とはどちらの意味でしたか？"
