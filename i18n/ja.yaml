home_heading: "エージェントは推論に。"
home_heading_second: "コード生成はGoaに。"
home_intro: "Goa は、コーディングエージェントが書くコードを減らし、推論の基準となる契約をひとつにまとめる Go フレームワークです。1 つの Go 設計から HTTP・gRPC・JSON-RPC サーバー、型付きクライアント、バリデーション、OpenAPI 3 仕様をコンパイルし、Goa-AI でプロダクト組み込みの AI エージェント、MCP サーバー、ツールレジストリを構築できます。"
home_hero_point_1: "**サービス開発（`Goa`）:** 1 つの `design/*.go` から `net/http`・gRPC・JSON-RPC サーバー、型付きクライアント、検証、OpenAPI 3.2 を生成。"
home_hero_point_2: "**エージェント & MCP（`Goa-AI`）:** サービスメソッドを型付きツールとして束ね（`BindTo`）、MCP 公開やインメモリ／Temporal 実行に対応。"
home_hero_point_3: "**コーディングエージェント最適:** LLM 出力トークン 0 で `gen/` を再生成し、契約変更のずれを Go コンパイルエラーで即検出。"
