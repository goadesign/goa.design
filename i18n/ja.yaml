highbay_for_you_text: "Highbay がブラウザ上でバックエンド開発を順を追って案内します。1 ページのカードで境界条件を決め、ハンドラー実装前にアーキテクチャ図を確認し、テスト結果を見てマージできます。"
highbay_for_model_label: "モデル向け"
highbay_for_model_text: "組み込みの Go プレイブックが認証・トレース・ストリーム・永続実行を構成し、Goa がコードの 70% を生成します（[Orders サンプル](https://github.com/goadesign/highbay/tree/main/examples/orders)）。実装担当は契約やテストを編集できず、第 2 エージェントが別の Git コピーでハンドラーを検証します。"
