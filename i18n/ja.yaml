home_registry_heading: "ツールレジストリを自社環境でホスト。"
home_registry_text: "Goa-AI のクラスター対応レジストリサーバーを、共有カタログ兼呼び出しゲートウェイとして運用できます。各サービスがツールセットを公開し、エージェントは毎回プロンプトを肥大化させる代わりに必要なスキーマだけをオンデマンドで検索・読み込み、Redis と [Pulse](/ja/docs/3-ecosystem/pulse/)（Goa の Redis ストリーミング・レプリケートマップライブラリ）経由で正常なプロバイダーへ呼び出しをルーティングします。"
