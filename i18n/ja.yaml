chorus_install_hint: "`/chorus`（Codex では `$chorus`）と入力し、ライブダッシュボードは `chorus ui`、Herdr（macOS マルチエージェントターミナル）では **⌥⌘⇧C**（`herdr-app do mod.open --name chorus-launcher`）を押します。"
chorus_setup_summary: "chorus up の変更内容・プロジェクト限定セットアップ・停止方法"
chorus_fit_configs: "**設定範囲と解除:** `chorus setup` はプロジェクト限定の設定を出力します（`.mcp.json` に加え、存在する場合は `.codex/config.toml`、`.gemini/settings.json`、`.vscode/mcp.json`）。`chorus up` は検出されたグローバル設定に登録します（`CHORUS_NO_SETUP=1` で変更をスキップ。解除するには `chorus` MCP エントリを削除）。"
chorus_fit_redis: "**ローカル保存と停止:** 再起動後も履歴を保持するため、`127.0.0.1` にバインドされた永続ローカル Redis / Valkey を `~/.chorus/redis`（または Docker / Podman）で起動します。`chorus down` は Chorus サーバーを停止します。"
chorus_fit_safety: "**worktree と信頼モデル:** ピン留めされた計画でファイル担当者を協調管理します（厳密な分離には同一 `swarm` 上で別々の git worktree を使用）。信頼できないローカルプロセスがある環境では **YOLO** をオフにしてください。"
chorus_copy_brew: "セットアップコマンドをコピー"
chorus_pillars_heading: "Chorus が調整するもの"
chorus_pillar_swarms: "プロジェクトの swarm"
chorus_pillar_swarms_text: "リポジトリから swarm 名を自動導出（または複数の git worktree 間で明示的な swarm を共有）し、そのプロジェクトのエージェント・チャンネル・DM を 1 つにまとめます。"
chorus_pillar_channels: "#channels とピン留めされた計画"
chorus_pillar_channels_text: "各スライスのファイル担当者・レビュアー・テストコマンドを明記した 1 つのピン留めタスクボードを軸に、`#auth` のようなルームで連携します。"
chorus_pillar_dms: "@agent ダイレクトメッセージ"
chorus_pillar_dms_text: "1 対 1 の引き継ぎやレビュー指摘を `@codex` や `@claude` に直接送り、その相手だけを起こします。"
chorus_pillar_dashboard: "ライブダッシュボード (chorus ui)"
chorus_pillar_dashboard_text: "`chorus ui`（`localhost:9440`）を開くと、全参加者のレーンやピン留めされた計画を確認し、リアルタイムに返信できます。"
chorus_example_heading: "3 つのエージェント、プロンプトからモデル横断レビューまで"
chorus_example_intro: "タスクは架空、出力は実際の Chorus セッションです。Chorus ツールの実出力とメッセージあたりの推定トークン数を記録したパスキー実装シナリオ（`-wait 30s` で記録、デフォルトのスキルは `-wait 24h`）。マーカー 1〜4 は下の `chorus ui` と対応しています。"
chorus_role_lead: "Claude Code · リード & T1 実装"
chorus_role_docs: "Gemini · ドキュメント & TypeScript SDK (T3)"
chorus_role_review: "Codex · -race テスト & diff レビュー (T2)"
chorus_marker: "マーカー"
chorus_tokens: "トークン"
chorus_claude_pins: "Claude が `#auth` に共有の計画をピン留め："
chorus_codex_sends: "Codex が T2（`verify_test.go`）を担当宣言し、Claude の `a41c9e2` をレビュー："
chorus_example_outcome: "結果：Codex が T1 をレビューし `go test -race` グリーン（#auth#9）。T1 と T3 をマージ（#auth#11）。"
chorus_raw_toggle: "記録された chorus watch の全出力とトークン計測を表示"
chorus_dashboard_alt: "参加者ごとのスイムレーン、ピン留めされた計画、マージ完了までを表示するパスキーセッションの Chorus ダッシュボード。"
chorus_dashboard_caption: "`chorus ui` で表示した同じ `#auth` セッション — マーカー 1〜4 は上のターミナルカードと対応し、`#auth#9` のレビューと `#auth#11` のマージで完了します。"
chorus_tokens_heading: "待機中のモデルトークンは 0。通信時はプレーンテキストのワイヤ形式。"
chorus_cost_wait: "待機：モデルは停止"
chorus_cost_wait_text: "`chorus watch` がバックグラウンドのシェルタスクでブロックしている間、消費されるモデルトークンは `0` です。DM、`@mention`、返信、または上限付き `-wait` タイムアウトでのみ起床します。"
chorus_cost_wake: "起動：未読差分だけ"
chorus_cost_wake_text: "Chorus はエージェントごとの既読ウォーターマークをメモリ（`pulse/rmap`）に保持し、`#auth#4 @gemini:` のような未読行だけを配信します（このセッションでは 1 メッセージあたり約 16〜52 トークン）。"
chorus_cost_send: "送信：数トークン"
chorus_cost_send_text: "`send` は 3 トークンの確認（`sent #auth#3`）に加え、呼び出し元宛ての未読返信を 1 往復でまとめて返します。"
chorus_tokens_method: "上のスクリプト化されたパスキーセッションを 1.3 トークン/単語で見積もり（バイト換算で 19〜77、複数メッセージ起動あたり 25〜181 トークン）。総実行コストは使用するモデルとタスク規模によって変わります。"
chorus_tokens_method_link: "計測スクリプトを見る。"
chorus_session_heading: "クロスモデルレビューで発見：Chorus で作った Chorus"
chorus_session_caption: "リードエージェントの Codex が、メンテナーに計画を説明しています。"
chorus_session_result: "`#chorus` 上で、Opus がエージェント登録を `chorus up` に統合して `chorus ui` を追加し、Gemini は参加直後のエージェントが最初の発言前から表示されるようダッシュボードを修正しました。マージ前に Chorus 経由で両方の diff をレビューした Codex は、末尾コメント付きの TOML テーブルヘッダーによって別の MCP サーバーの URL が黙って消えてしまう `config.toml` パーサーのバグ（[commit `62b8181`](https://github.com/goadesign/chorus/commit/62b8181)）を発見しました — 単一モデルが自分のコードを自己採点するだけでは見落としがちな死角です。"
chorus_faq_replace_q: "Chorus は既存のコーディングエージェントやエディタを置き換えますか？"
chorus_faq_replace_a: "いいえ。エージェントは普段使っているターミナルや IDE にそのまま残り、1 つのローカル MCP エンドポイント（`http://localhost:9440/mcp` または `chorus stdio`）を通じて接続されます。"
chorus_faq_agents_q: "同じファイルの同時編集や無限ループはどう防ぎますか？"
chorus_faq_agents_a: "リードがピン留めするタスクボードでファイルまたはパッケージごとに 1 人の担当者を割り当てます（編集範囲が重なる場合は、同じ明示的な `swarm` を指定して別々の git worktree で動かします）。`chorus watch` はメンション・返信・DM のみで起床し（`-mentions`）、`chorus down` はローカルの Chorus サーバーを停止します（永続 Redis や単体の `chorus stdio` プロセスは独立して動作します）。"
chorus_faq_local_q: "メッセージはどこに保存され、localhost の信頼モデルはどうなっていますか？"
chorus_faq_local_a: "デフォルトでは `127.0.0.1:9440` にバインドし、ローカルの Redis または Valkey（`~/.chorus/redis` またはローカルコンテナ）にメッセージを保存します。同じ OS ユーザー下のローカルプロセスは `127.0.0.1` に到達できるため、信頼できないローカルコードを実行する際はクライアントの **YOLO** フラグをオフにし、リモート Redis を使う前には `REDIS_PASSWORD` とネットワーク制限を設定してください。"
chorus_faq_docs_q: "CLI、Herdr、アーキテクチャの詳細ドキュメントはどこにありますか？"
chorus_faq_docs_a: "2 分で終わるクイックスタート、5 つの MCP ツールのワイヤ形式、Herdr ランチャー、Goa-AI + Pulse アーキテクチャについては [Chorus エコシステムガイド](../docs/3-ecosystem/chorus/) を、ソースコードは [GitHub](https://github.com/goadesign/chorus) をご覧ください。"
chorus_wake_messages: "1 回の起動で {{ .Count }} 件のメッセージ"
chorus_nav_goa: "Goa フレームワーク"
chorus_compare_heading: "他のツールとの違い"
chorus_compare_ide: "エージェント IDE・worktree ランナー (Orca, Superset, Conductor)"
chorus_compare_ide_text: "worktree 型の IDE はエディタを置き換え、1 つのプロンプトを隔離された単独セッションへ並列投入して出力を比較します。Chorus は既存のエディタをそのまま活かし、`#channels`、ピン留めされた計画、`@agent` DM で 1 つのタスクを分担します。"
chorus_compare_pty: "ターミナルマルチプレクサ (Herdr, cmux, tmux)"
chorus_compare_pty_text: "マルチプレクサは PTY 内で CLI ペインをホストします。Chorus はその*内側*で動く MCP 連携バスであり、tmux ペイン、IDE エージェント（Cursor、Antigravity）、Herdr 内蔵の `chorus-launcher`（**Chorus · project** タブ）を 1 つの swarm でつなぎます。"
chorus_compare_subagents: "組み込みサブエージェント (Claude Code, Codex)"
chorus_compare_subagents_text: "組み込みサブエージェントは単一ベンダー・同一モデルファミリー内で子ワーカーを起動します。Chorus は Claude、Codex、Gemini の独立したピアセッションを接続し、マージ前に別モデルファミリーが diff をレビューできるようにします。"
chorus_compare_chat: "チャットブリッジ・JSON 型 MCP (Slack, Discord, A2A)"
chorus_compare_chat_text: "人間向けチャットのラッパーはポーリングのたびに履歴を再取得し、冗長な JSON を返します。Chorus はメモリ上でウォーターマークを追跡し、`send` に未読返信を同梱し、`chorus watch` で待機中のモデルトークンを 0 に保ち、1 メッセージ約 16〜52 トークンで通信します。"
chorus_serverdex_alt: "Chorus — Serverdex 掲載"

