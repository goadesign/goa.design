highbay_solo_row_1_title: "リポジトリごとに異なる配線"
highbay_solo_row_1_text: "セッションごとに独自のルーター・認証ミドルウェア・エラー形式を選びます。"
highbay_with_row_1_title: "全リポジトリで統一された Go 設計"
highbay_with_row_1_text: "組み込みルールが認証・トレース・エラー処理・パッケージ構成をすべてのサービスで揃えます。"
highbay_solo_row_2_title: "スキーマ変更に 4 ファイル編集"
highbay_solo_row_2_text: "フィールド追加のたびにハンドラー・検証・OpenAPI・MCP JSON を手編集します。"
highbay_with_row_2_title: "契約を 1 回編集するだけ"
highbay_with_row_2_text: "`highbay gen` がモデルトークン 0 でサーバー・仕様・スキーマを再コンパイルします。"
highbay_solo_row_3_title: "自分の推測を自分で採点"
highbay_solo_row_3_text: "1 つのセッションが権限ルールを推測し、それに合わせたテストを通します。"
highbay_with_row_3_title: "ロックされた契約と独立テスト担当"
highbay_with_row_3_text: "Highbay は実装担当による契約やテストの変更を拒否し、第 2 エージェントが専用 worktree でハンドラーを検証します。"
highbay_walkthrough_heading: "各リポジトリの中身"
highbay_walkthrough_intro: "[Orders サンプル](https://github.com/goadesign/highbay/tree/main/examples/orders)と同様に、契約・生成サーバーコード・受け入れテストが別々の Go パッケージに分かれます。"
highbay_role_guide: "1. design/ の契約"
highbay_role_guide_caption: "エージェントがリクエスト型・テナント分離・人間の承認条件を起草し、あなたが確定します。"
highbay_role_codegen: "2. gen/ の生成 Go コード"
highbay_role_codegen_caption: "HTTP / MCP サーバー・OpenAPI 仕様・入力検証・ページ送りをモデルトークン 0 でコンパイルします。"
highbay_role_tests: "3. eval/ のシナリオテスト"
highbay_role_tests_caption: "実装担当が編集できない別 Git worktree で、第 2 エージェントが受け入れ検査を書きます。"
highbay_cap_heading: "組み込み Go プレイブックが配線する機能"
highbay_cap_intro: "エージェントは共通の本番向け Go 構成に従い、機能に必要なときだけ Redis や Temporal を追加します。"
highbay_cap_auth_title: "認証とテナント分離"
highbay_cap_auth_body: "ゲートウェイで JWT・OAuth2・API キーを検証し、テナント ID をサーバー側で紐づけてプロンプトからのなりすましを防ぎます。"
highbay_cap_obs_title: "トレース・メトリクス・ヘルスチェック"
highbay_cap_obs_body: "最初のコミットから HTTP・gRPC・モデル呼び出しに OpenTelemetry トレース、構造化ログ、稼働プローブを組み込みます。"
highbay_cap_stream_title: "イベントストリームとレート制限"
highbay_cap_stream_body: "複数インスタンスへスケールした際、トークンレート制限・イベントストリーム・ワーカープールを Redis 上で共有します。"
highbay_cap_durable_title: "人間の承認と永続実行"
highbay_cap_durable_body: "ツール呼び出し回数や大きな応答を制限し、重要な操作は人間の承認まで一時停止し、再起動後も長時間処理を再開します。"
