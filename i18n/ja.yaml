highbay_build_pin_1: "**Builder:** 独立したワークスペースで、Goa と Goa-AI が生成したインターフェースに対して Go サービスを実装します。"
highbay_build_pin_2: "**Test writer:** 確定した合意をもとに、別の作業コピーでブラックボックスのシナリオテストを書きます。"
highbay_build_pin_3: "**合意への紐づけ:** 両ロールとも確定済みリビジョンに対して作業し、振る舞いの変更には再確認が必要です。"
highbay_build_alt: "Builder ロールに Claude Code、Test Writer ロールに Codex を割り当てる Highbay の Build 画面。"
highbay_approve_pin_1: "**承認してからマージ:** 合格した実行結果に承認を記録したら、両方のコミットをローカルブランチへマージします。"
highbay_approve_pin_2: "**フローとテストの対応:** 完了した各 `Story` フロー（`instant_credit`、`manager_review`）とシナリオ結果を対応づけます。"
highbay_approve_pin_3: "**厳密なコミット単位レポート:** 受理されたテストコミットを実装者のコミットに対して実行します（この例では `3 of 3`）。"
highbay_approve_alt: "合格した Story シナリオ、テストカバレッジ、記録された承認、Merge into current branch ボタンを表示する Highbay の Approve 画面。"
highbay_showcase_caption: "$50 返金例のフィクスチャ応答に対して描画した Highbay のブラウザ UI。"
highbay_showcase_method: "スクリーンショットの生成方法"
highbay_walkthrough_heading: "合意そのものがコードになる"
highbay_walkthrough_intro: "合意した内容は 3 つの小さな Go コードになります。どれも同じ `$48.00 + $4.32` の注文、同じ数値です。"
highbay_role_guide: "フロー定義 · design/story.go"
highbay_role_guide_caption: "Goa 設計と並べてエージェントが起草し、あなたが確定："
highbay_card_choice: "`Story` 内の完了したすべてのフローに対応するシナリオテストがなければ、ビルドは有効になりません。"
highbay_role_tests: "テスト · test writer"
highbay_role_tests_caption: "確定した回答をもとに、別の作業コピーで作成："
highbay_tests_check: "Highbay がテストモジュールをコンパイルし、サービス側のファイルが変更されていないことを確認してテストコミットを固定します。"
highbay_role_builder: "業務ルール · builder"
highbay_role_builder_caption: "Goa が生成した型付きペイロードとインターフェースに対して実装："
highbay_builder_check: "レビュー・承認・マージの前に、Highbay が受理済みテストコミットを実装者のコミットに対して実行します。"
highbay_codegen_heading: "定型コードは生成し、トークンはロジックに使う。"
highbay_codegen_intro: "エージェントがルーターやスキーマを手書きすれば、Goa が生成できる作業にトークンを費やすことになります。Highbay はコード生成を合意済みビルドの一部として組み込みます。"
highbay_codegen_left_title: "エージェントが読み書きする設計"
highbay_codegen_zero: "モデルではなくコンパイラが出力"
highbay_codegen_right_title: "生成されるコード"
highbay_codegen_out_transports: "サービスの gen/ · このメソッドから生成"
highbay_codegen_out_transports_text: "`POST /chat` ハンドラー、型付きクライアント、コーデック、OpenAPI 仕様、`MinLength(1)` / `Required` 検証。"
highbay_codegen_out_agents: "Goa-AI ツール · 宣言時"
highbay_codegen_out_agents_text: "ツールの JSON スキーマ、メソッド接続、サーバー注入フィールド、承認宣言。"
highbay_codegen_out_eval: "シナリオハーネス · eval/"
highbay_codegen_out_eval_text: "Highbay が必須フローの一覧を `eval/design/` に書き出し、Go のシナリオ実行コードを `eval/gen/` に生成します。"
highbay_codegen_caption: "Highbay の [Orders サンプル](https://github.com/goadesign/highbay/tree/main/examples/orders)より。`generate_code` が合意済み設計を書き込んでサービス側の `gen/` を更新し、Highbay が `eval/` の必須シナリオ表を整え、合意と `design/` が異なる候補コミットは検証時に拒否します。"
highbay_codegen_tokens: "定型コードをモデルが書かない"
highbay_codegen_tokens_text: "Goa はモデルの出力トークンを使わずに生成ファイルを書き出し、編集は設計と関連インターフェースから始まります。全体の削減量は変更内容によって変わります。"
highbay_codegen_consistency: "どのモデルでも同じ構造"
highbay_codegen_consistency_text: "生成されたトランスポート、バリデーション、ツールスキーマの構造は、周辺のロジックを Claude・Codex・Gemini のどれが書いても同じになります。"
highbay_codegen_compiler: "インターフェースの変更で古い実装を検出"
highbay_codegen_compiler_text: "メソッドの戻り値の型を変えて再生成すれば、古い型を返すハンドラーはコンパイルに通らず、Highbay は別途 `eval/` のコンパイルと必須シナリオの一覧を検査します。"
highbay_codegen_cta: "コーディングエージェント開発ガイドを読む"
highbay_compare_heading: "他ツールとの比較"
highbay_compare_intro: "Highbay はひとつの原則で作られています。コードを書く者が、動いているかどうかを判定しないことです。"
highbay_compare_solo: "単一のコーディングエージェント"
highbay_compare_solo_text: "1 つのセッションで計画・実装・テストまでこなせ、それで十分な場面も多くあります。落とし穴は言外の仕様です。エージェントが自分で答えを決め、その答えを自分でテストしてしまいます。Highbay はまずあなたに問いかけ、回答をもとに第 2 のエージェントにシナリオテストを書かせ、Highbay 自身がそれを実行します。"
highbay_compare_speckit: "仕様駆動ワークフロー (Spec Kit, OpenSpec)"
highbay_compare_speckit_text: "コードの前に合意を書き残す正しいアプローチで、構造化された仕様書やタスクを生成します。Highbay は合意したフローと API 設計を Go の契約と必須シナリオに変えます。設計はコンパイルされ、そこから Goa がインターフェースとツールスキーマを生成し、完了した全フローにシナリオテストが揃わなければビルドとして認められません。"
highbay_compare_workspaces: "並列エージェントワークスペース (Conductor など)"
highbay_compare_workspaces_text: "隔離されたワークスペースで複数のエージェントを同時に走らせ、レビュー用にそれぞれのブランチを渡します。Highbay は合意済みの 1 つの変更に対して異なる役割の 2 エージェントを動かし、マージ対象の正確なコミット上で実行したシナリオ結果だけを 1 つにまとめて提示します。"
highbay_compare_summary: "あなたが確定した選択。Go から生成されたトランスポートとスキーマ。別エージェントが書いたテスト。合意と両コミットに紐づく、Highbay 実行の 1 つの結果。"
highbay_faq_scope_q: "何が作れますか？"
highbay_faq_scope_a: "Goa と Goa-AI で設計された Go サービスおよび AI エージェント（HTTP / JSON-RPC API、MCP サーバー、型付きツールを持つエージェント）です。他言語は対象外で、gRPC トランスポートを含む設計は現在拒否されます。"
highbay_faq_tdd_q: "1 つのエージェントにテストを先に書かせるのではだめですか？"
highbay_faq_tdd_a: "テスト先行は順番を変えるだけで、書き手は同じままです。未決の仕様を同じエージェントが推測し、邪魔になったテストを自分で書き換えることも防げません。Highbay では質問はあなたに届き、第 2 のエージェントが別の作業コピーでシナリオを書き、受理されたテストコミットを実装者のコミットに対して Highbay が実行します。"
highbay_faq_existing_q: "既存のプロジェクトにも使えますか？"
highbay_faq_existing_a: "はい。少なくとも 1 つの Git コミットがある Goa または Goa-AI プロジェクトなら使えます。Highbay が実行できるテスト（Highbay 形式のテストモジュール、または `hbay verification set` で登録した独自のテストプログラム。後者の場合テスト作成者は起動せず変更ごとに実行されます）を用意してください。"
highbay_faq_holdouts_q: "実装者はテストを読んでそれに合わせたコードを書けますか？"
highbay_faq_holdouts_a: "テスト作成者が書いたテストを読むことはできます。すべてお使いのマシン上で動作するためです。ただし検証時には、Highbay が受理したテストコミットからテストスイートを選び、実装者は自分のコードコミットだけを渡します。別途管理される評価器を使う場合、ホールドアウトは実装者向けレポートには匿名名に紐づく結果としてのみ表示されます。"
highbay_faq_local_q: "アカウントや API キーは必要ですか？"
highbay_faq_local_a: "どちらも不要です。アカウントも専用キーもクラウドサービスも使いません。コーディングエージェントは既存のログインやサブスクリプションをそのまま使い、モデルプロバイダーキーが必要になるのは作成するサービスやテスト自身がライブモデルを呼ぶ場合だけです。"
highbay_faq_sandbox_q: "エージェントはサンドボックス化されていますか？"
highbay_faq_sandbox_a: "いいえ。Build 以降、エージェント、テスト、構築されるサービスは、ファイルやネットワークへのあなたの権限を持つ通常のプログラムとしてマシン上で動作します。ロールによって Highbay 内で各エージェントが行える操作は制限され、確定・承認・マージはあなただけが可能で、実装者のコンパイルと単体テスト検査はローカルの Docker コンテナで実行されます。詳しくは [Highbay ガイド](../docs/3-ecosystem/highbay/)を読むか、[GitHub](https://github.com/goadesign/highbay) のソースを参照してください。"
