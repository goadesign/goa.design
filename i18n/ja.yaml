highbay_with_row_2_title: "1 つの契約を編集し、4 つすべてをコンパイル"
highbay_with_row_2_text: "`highbay gen` がモデルトークン 0 で HTTP・MCP スキーマ・OpenAPI 3 を再生成し、古いハンドラーはコンパイル時に検出されます。"
highbay_with_row_3_title: "コンパイルされた上限と承認ゲート"
