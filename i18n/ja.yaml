highbay_with_row_1_title: "標準化されたサービス構成"
highbay_with_row_1_text: "すべてのサービスが同じ構造と、認証・トレース・ストリーム・ワーカープールの共通規約から始まります。"
highbay_with_row_2_title: "1 つの契約を編集し、4 つすべてをコンパイル"
