home_benefits_heading: "手書きの足回りより契約コンパイルが効く理由"
home_benefit_tokens: "54 行の DSL → 57 個の生成ファイル"
home_benefit_tokens_text: "[カタログのリファレンス例](/ja/docs/ai-development/#one-design-two-entry-points)では、54 行の `design/catalog.go` から 5,000 行超の Go トランスポート、OpenAPI、Protobuf、ツール JSON スキーマを `gen/`（Git コミット対象、LLM 出力トークン 0）へコンパイルします。"
home_benefit_context: "コンテキストに読み込む契約はひとつ"
home_benefit_context_text: "ペイロード型、正規表現や範囲の制約、説明、ルーティングはすべて `design/*.go` に集約されます。エージェントは手書きの 4 層を探し回る代わりに、契約と `gen/` のインターフェースだけを読めば済みます。"
home_benefit_feedback: "契約のずれをコンパイルエラーで即検出"
home_benefit_feedback_text: "`design/` のフィールドやメソッドを変更して `goa gen` を再実行すれば、シグネチャが合わなくなったハンドラー、クライアント、ツール実行処理を Go コンパイラがすべて指摘します。"

home_frameworks_heading: "サービスには Goa。エージェントと MCP には Goa-AI。"
home_service_title: "ひとつの契約。あらゆるトランスポート。"
home_service_text: "ペイロード、バリデーション、エラーを Go で一度宣言するだけ。標準の `net/http`、gRPC、JSON-RPC サーバー、型付きクライアント、OpenAPI 3 / Protobuf 仕様を生成します。ルーティング・デコード・バリデーションはリフレクション駆動のフレームワークではなく、生成された Go コードです。"
home_service_docs: "Goa を詳しく見る"
home_service_transports: "同じサービス設計からサーバー、型付き Go クライアント、CLI クライアントをコンパイル。"
home_service_streams: "設計に組み込まれたストリーミング"
home_service_contracts: "トランスポート境界での入力検証"
home_service_contracts_text: "必須フィールド、正規表現パターン、値の範囲、エラーステータスコード、OpenAPI 3.2、Protocol Buffers。"

home_agent_title: "型付きエージェント、MCP サーバー、永続ワークフロー。"
home_agent_text: "同じ Go DSL をツール利用型 AI エージェントや MCP サーバーへ拡張。API キー不要のインメモリ実行でローカル検証してから、OpenAI・Anthropic・AWS Bedrock・Google Vertex AI を接続し Temporal で永続実行できます。"
home_agent_docs: "Goa-AI を詳しく見る"
home_agent_contracts: "サービス検証の再利用と秘匿コンテキスト"
home_agent_contracts_text: "Goa サービスメソッドをツールとして再利用し（`BindTo`）、サーバー側で付与するテナント ID をモデルから隠し（`Inject`）、ページ応答の上限を強制します（`BoundedResult`）。"
home_agent_composition: "マルチエージェントツリーと決定論的評価"
home_agent_composition_text: "子エージェントを予算上限付きツールとして合成し、本番 LLM を呼ばずにツール呼び出し軌跡を決定論的にテストできます。"
home_agent_execution: "承認ゲート、ストリーミング、単体 MCP サーバー"
home_agent_execution_text: "重要なツール実行を人間の承認で一時停止し（`Confirmation`）、型付きイベントを UI に配信し、エージェントループなしで MCP サーバー単体としても公開できます。"

home_mcp_heading: "サービスから MCP サーバーを構築。"
