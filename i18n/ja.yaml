highbay_role_tests: "3. 独立検証 · eval/"
highbay_role_tests_caption: "合意内容から独立した `.highbay-tests` 作業コピーで作成："
highbay_builder_check: "`eval/` 以外のファイルを変更したテストレポートや、`design/` または `eval/` 内の手書きファイルを変更した実装コミット（外部スイート未登録時）を Highbay が拒否します。"
highbay_cap_kicker: ""
highbay_cap_heading: "本番インフラ向けの組み込みパターン"
highbay_cap_intro: "ステートレスな HTTP / MCP サービスは単一バイナリで動作し、宣言時には `highbay://golden-path` が一貫した実装パターンを提供します："
highbay_cap_auth_title: "認証とプリンシパル注入 ([Goa](/ja/) · ステートレス)"
highbay_cap_auth_body: "JWT・OAuth2・API キーの境界検証と、型付き `context.Context` への検証済みプリンシパル格納。"
highbay_cap_obs_title: "可観測性とログ ([Clue](/ja/docs/3-ecosystem/clue/) · OpenTelemetry)"
highbay_cap_obs_body: "OpenTelemetry のトレースとメトリクス、エラー時に出力されるバッファ付きログ、`/healthz` プローブ。"
highbay_cap_stream_title: "ストリーム・キュー・ワーカー ([Pulse](/ja/docs/3-ecosystem/pulse/) · Redis)"
highbay_cap_stream_body: "型付き Redis Streams、フェイルオーバー対応コンシステントハッシュ・ワーカープール、分散レート制限マップ。"
highbay_cap_durable_title: "エージェントと永続ワークフロー ([Goa-AI](/ja/docs/2-goa-ai/) · Temporal)"
highbay_cap_durable_body: "Anthropic・OpenAI・Bedrock・Vertex・ゲートウェイのモデルアダプター、`RunPolicy` 上限、クラッシュ耐性のある `Confirmation` 一時停止、実行時プロンプト予算検査（[`TestSeededPayloadBloatFailsTheBudget`](https://github.com/goadesign/highbay/blob/main/examples/orders-eval/acceptance/acceptance_test.go#L36-L60)）。"
highbay_proof_heading: "ガードレールとリポジトリ参照"
highbay_proof_codegen_title: "リファレンスサービスの約 70% を自動生成 ([`examples/orders/gen/` を見る](https://github.com/goadesign/highbay/tree/main/examples/orders/gen))"
highbay_proof_codegen_body: "Highbay の Orders リファレンスサービスでは、テストを除く Go コードの約 70% を LLM 出力ゼロの `gen/` が占めます。"
highbay_proof_playbook_title: "全 12 章のプレイブック ([`GOLDEN_PATH.md`](https://github.com/goadesign/highbay/blob/main/internal/goldenpath/GOLDEN_PATH.md))"
highbay_proof_playbook_body: "MCP（`highbay://golden-path`）経由で配信され、Claude・Codex・Gemini がリポジトリ間で同じ基準に従います。"
highbay_proof_suite_title: "クラッシュ耐性と権限ゲート検証 ([`orders-eval`](https://github.com/goadesign/highbay/tree/main/examples/orders-eval/acceptance))"
highbay_proof_suite_body: "リファレンス受け入れスイートが実行中のワーカーへの `SIGKILL`、承認待ち中の API 再起動、権限のない呼び出しの拒否（`403`）を検証します。"
highbay_compare_heading: "他アプローチとの比較"
highbay_compare_intro: "コーディングエージェントのワークフローやエージェント SDK との違い。"
highbay_compare_solo: "単独の Plan モード & .cursorrules"
highbay_compare_solo_text: "プランモードや Markdown ルールは最初の意図を整理できますが、自然言語の規約は PR を重ねるうちに崩れ、1 つのセッションが自分のコードを自分で採点し続けます。"
highbay_compare_speckit: "Python / TS エージェント SDK (LangGraph, Agents SDK)"
highbay_compare_speckit_text: "コード優先の SDK はアプリコード内でチェーンを組みますが、Highbay は先に HTTP・OpenAPI 3・MCP の契約をコンパイルし、独立した検証エージェントを組み合わせます。"
highbay_compare_workspaces: "並列 worktree ランナー"
highbay_compare_workspaces_text: "並列ランナーは同じプロンプトを複数の競合ブランチに投げて人間が差分を見比べますが、Highbay は 1 つの契約に対して実装者とテスト作成者の 2 役を連携させます。"
highbay_faq_scope_q: "既存リポジトリ、gRPC、PR / CI ワークフローとはどう連携しますか？"
highbay_faq_scope_a: "Highbay は新規サービス（Python・TypeScript・Go・Web アプリから HTTP / OpenAPI 3 / MCP で呼び出し可能）の作成、または既存の Goa リポジトリの拡張に対応しており、他のルーターをその場で置き換えることはしません。同梱の `highbay gen` は `GRPC` を拒否します（`protoc` 非同梱のため。単体の `goa gen` は gRPC に対応）。承認されたコミットは直接マージすることも、CI 用の PR ブランチにマージすることもできます。"
highbay_faq_holdouts_q: "実装者が契約やテストを勝手に書き換えない仕組みは？"
highbay_faq_holdouts_a: "コード生成時に確定済みリビジョンで `design/` を上書きし、`design/` や `eval/` 内の手書きテストを変更したコミットを拒否します。外部評価器（`highbay verification set`）を使えば非公開のホールドアウトシナリオも実行できます。"
highbay_faq_local_q: "クラウドアカウントやモデル API キーは必要ですか？"
highbay_faq_local_a: "どちらも不要です。コーディングエージェントは既存の CLI ログインをそのまま使い、`eval/` のシナリオはスクリプト化されたモデルダブルを使用します（ライブ呼び出しをテストしない限り外部 API キーは `0` 個です）。"
highbay_faq_sandbox_q: "ローカルプロセスや権限はどう制限されていますか？"
highbay_faq_sandbox_a: "ロール別の MCP トークンにより確定・承認・マージはユーザー本人のみに制限され、実装者の検査はローカルの Linux Docker コンテナ内で実行されます。エージェントと候補バイナリは現在のユーザーアカウント下の通常のプロセスとして動作します（VM サンドボックスではありません）。詳細は[エコシステムガイド](../docs/3-ecosystem/highbay/#architecture)を参照してください。"
