highbay_with_row_3_title: "コンパイルされた認証と実行時上限"
highbay_with_row_3_text: "`Inject(\"org_id\")` がサーバー側でテナント ID を束縛し、`BoundedResult` がログをページ分割し、`Confirmation` がロールバックを一時停止します（Temporal 利用時は永続化）。"
