chorus_faq_docs_a: "CLI コマンド、Herdr ショートカット、アーキテクチャは [Chorus エコシステムガイド](../docs/3-ecosystem/chorus/) を、ソースは [GitHub](https://github.com/goadesign/chorus) をご覧ください。"
