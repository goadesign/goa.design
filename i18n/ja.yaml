home_faq_heading: "始める前の疑問"

home_faq_codegen_q: "コーディングエージェントが書けるのに、なぜGoaを使うのですか？"

home_faq_codegen_a: "エージェントは推論によってコードを書き、Goaは設計から契約のコードを導出します。サーバー、クライアント、コーデック、スキーマを個別に書く必要がなくなります。設計にコンテキストを集約し、構造を統一し、変更後の型の不整合をコンパイラーで検出できます。ビジネスロジックとテストはエージェントが実装します。"

home_faq_difference_q: "GoaとGoa-AIの違いは何ですか？"

home_faq_difference_a: "GoaはGoサービスのAPIを設計・生成します。HTTP、gRPC、JSON-RPC、クライアント、検証、仕様書が対象です。Goa-AIは同じDSLと生成器を拡張し、型付きツール、AIエージェント、構造化された完了、評価、MCPサーバーに対応。エージェントランタイムと自分で運用するツールレジストリも提供します。どちらからでも始められ、別途デプロイしたGoaサービスは不要です。"

home_faq_tokens_q: "コード生成はLLMの作業をどう減らしますか？"

home_faq_tokens_a: "Goaは、LLMにファイルを書かせることなく、トランスポートと契約のコードを生成します。その分の出力トークンを使った作業を省けます。総削減量はタスク、モデル、コンテキスト、反復回数によって異なるため、テストとレビューを含む変更全体で効果を測定してください。"

home_faq_mcp_q: "MCPサーバーの構築だけにGoa-AIを使えますか？"

home_faq_mcp_a: "はい。GoaサービスにMCP宣言を追加すると、ツール、リソース、プロンプトテンプレートを公開するサーバーを生成できます。生成されたアダプターの先にサービスメソッドを実装します。MCPを提供するためにGoa-AIエージェントを実行する必要はありません。"

