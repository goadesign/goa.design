home_compare_heading: "Goa・Goa-AI と他アプローチの比較"
home_compare_specs: "Protobuf・OpenAPI ツールチェーン (buf/Connect, oapi-codegen)"
home_compare_specs_text: "`buf` + ConnectRPC は `.proto` から HTTP/gRPC を生成し、`oapi-codegen` は OpenAPI YAML を対象とします。Goa は柔軟な HTTP ルーティング、gRPC、JSON-RPC、OpenAPI 3.2、MCP・エージェントツールセットを 1 つの Go パッケージで記述し、`net/http` と `grpc` のルーティング・バリデーションコードを直接 Go で生成します。"
home_compare_mcp_sdk: "手書き配線の Go MCP SDK (go-sdk, mcp-go)"
home_compare_mcp_sdk_text: "構造体タグベースの MCP ハンドラーでは、HTTP/gRPC API 用に書いたパラメータ制約を二重管理することになります。Goa サービスに `MCP(...)` と `Tool(...)` を追加すれば、検証済みペイロード型とサービス実装をそのまま再利用できます。"
home_compare_agent_sdk: "Python / TS エージェント SDK (LangGraph, OpenAI Agents SDK)"
home_compare_agent_sdk_text: "グラフ型 SDK は動的型付けのアプリケーションコードでオーケストレーションを組み立てます。Goa-AI は型付き Go ツールコーデック、サーバー注入コンテキスト、カーソルページネーション、承認ゲート、Temporal ワークフローアクティビティを単一の静的 Go バイナリにコンパイルします。"

home_faq_heading: "始める前のよくある質問"
home_faq_codegen_q: "既存の Go リポジトリに段階的に導入できますか？また gen/ はコミットしますか？"
home_faq_codegen_a: "どちらも可能です。`goa gen` は標準の `net/http` ハンドラーと `google.golang.org/grpc` サーバーを生成するため（リフレクション駆動のルーターではありません）、既存の Go ルートと並べてマウントし、標準ミドルウェアをそのまま適用でき、`gen/` をコミットして契約の差分をコードレビューで監査できます。"
home_faq_difference_q: "Go 以外のクライアントからはどう呼び出し、Goa-AI はいつ追加しますか？"
home_faq_difference_a: "TypeScript、Python、モバイルクライアントは生成された OpenAPI 3.2 および `.proto` 仕様を直接利用します。HTTP/gRPC/JSON-RPC API にはまず Goa を使い、MCP ツールの公開やプロダクトエージェントの実行が必要になった段階で Goa-AI を追加してください（本番モデルや Temporal の接続前に API キー不要でローカル検証可能）。"
home_faq_tokens_q: "Goa が向かないケースと、評価の進め方は？"
home_faq_tokens_a: "使い捨てスクリプトや極小プロトタイプでは `design/` パッケージを分ける手間が勝るため不要です。複数エンドポイントを持つサービスやコーディングエージェントを活用するチームでは、[カタログの実装例](/ja/docs/ai-development/#one-design-two-entry-points)をベースに実際の機能 1 つをエンドツーエンドで比較（トークン数、レビュー差分、不具合数）してください。"
home_faq_mcp_q: "MCP サーバーの公開だけに Goa-AI を使えますか？"
home_faq_mcp_a: "はい。Goa サービスに `MCP(...)` と `Tool(...)` 宣言を追加するだけで、`tools/list` の JSON Schema、バリデーションのリトライヒント、Streamable HTTP ハンドラーをエージェントループなしで生成できます。"

home_community_heading: "コンパニオンライブラリとマルチエージェント開発ツール"
home_community_intro: "Goa と Goa-AI は、可観測性、Redis イベントストリーム、C4 アーキテクチャ図、マルチエージェント開発のためのオープンソース Go ツール群と連携します。"
