home_faq_heading: "Prima di iniziare"

home_faq_codegen_q: "Perché usare Goa se un agente può scrivere il codice?"

home_faq_codegen_a: "Un agente scrive codice per inferenza; Goa deriva il codice dei contratti dal design. Server, client, codec e schemi generati sono codice che il modello non deve scrivere separatamente. Il design concentra il contesto, la struttura resta coerente e il compilatore segnala le implementazioni incompatibili dopo una modifica. L’agente scrive comunque logica di business e test."

home_faq_difference_q: "Qual è la differenza tra Goa e Goa-AI?"

home_faq_difference_a: "Goa progetta e genera API di servizi Go: HTTP, gRPC, JSON-RPC, client, validazione e specifiche. Goa-AI estende lo stesso DSL e generatore con tool tipizzati, agenti AI, completion strutturate, valutazioni e server MCP. Fornisce anche un runtime per agenti e un server tool registry da ospitare. Puoi iniziare con entrambi; Goa-AI non richiede un servizio Goa distribuito separatamente."

home_faq_tokens_q: "In che modo la generazione riduce il lavoro dell’LLM?"

home_faq_tokens_a: "Goa genera il codice di trasporto e dei contratti senza far comporre quei file a un LLM. Elimina così una categoria di lavoro sui token di output. Il risparmio totale dipende da attività, modello, contesto e iterazioni: confronta modifiche complete, inclusi test e revisione, per misurare l’effetto nel progetto."

home_faq_mcp_q: "Posso usare Goa-AI solo per creare un server MCP?"

home_faq_mcp_a: "Sì. Aggiungi dichiarazioni MCP a un servizio Goa per generare un server che espone tool, risorse e template di prompt. Implementa i metodi del servizio dietro gli adapter generati. Non serve eseguire un agente Goa-AI per offrire MCP."

