home_eco_chorus: "Message bus MCP locale (`#channels`, DM `@agent`, piani fissati e `chorus ui`) con cui Claude Code, Codex e Gemini si coordinano alla pari a 0 token inattivi."
home_eco_highbay: "Control plane guidato dai contratti che affianca un coding agent builder a un agente test writer separato in copie di lavoro distinte prima del merge dal browser."
home_eco_libs: "Redis Streams, worker pool e mappe replicate (`Pulse`), tracing OpenTelemetry e logging scaricato sugli errori (`Clue`), e diagrammi di architettura C4 come codice (`Model`)."

