highbay_faq_scope_q: "App Python, TypeScript o web possono chiamare i servizi Highbay?"
highbay_faq_scope_a: "Sì. Highbay compila binari Go standard con endpoint HTTP, OpenAPI 3 e MCP utilizzabili da qualsiasi client."
highbay_faq_holdouts_q: "Cosa impedisce al builder di modificare il contratto o i test?"
highbay_faq_holdouts_a: "Highbay ripristina il contratto confermato prima della verifica e rifiuta qualsiasi commit che modifichi il contratto o i test."
highbay_faq_local_q: "Serve un account cloud o una chiave API per i modelli?"
highbay_faq_local_a: "No. I coding agent usano i propri login CLI esistenti e i test di scenario girano in locale su mock deterministici."
highbay_faq_sandbox_q: "Funziona su repository esistenti e come girano i controlli locali?"
highbay_faq_sandbox_a: "Crea nuovi servizi o estende repository Goa, esegue i controlli in Docker e unisce nel tuo branch o PR. Vedi [Architettura e configurazione](../docs/3-ecosystem/highbay/#architecture)."
