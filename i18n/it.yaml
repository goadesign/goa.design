home_faq_heading: "Domande prima di iniziare"
home_faq_codegen_q: "Posso adottare Goa gradualmente e devo versionare gen/?"
home_faq_codegen_a: "Sì a entrambe. `goa gen` genera codice standard `net/http` e `google.golang.org/grpc` montabile accanto alle rotte esistenti e versionabile in `gen/`."
home_faq_difference_q: "Come chiamano Goa i client non-Go e quando aggiungo Goa-AI?"
home_faq_difference_a: "TypeScript, Python e mobile usano direttamente le specifiche OpenAPI 3.2 e `.proto` generate. Aggiungi Goa-AI per esporre tool MCP o agenti di prodotto."
home_faq_tokens_q: "Quando Goa non è adatto e come valutarlo?"
home_faq_tokens_a: "Evita Goa per script usa e getta. Su servizi reali, confronta una funzionalità end-to-end partendo dal [walkthrough del catalogo](/it/docs/ai-development/#one-design-two-entry-points)."
home_faq_mcp_q: "Posso usare Goa-AI solo per esporre un server MCP?"
home_faq_mcp_a: "Sì. Aggiungi `MCP(...)` e `Tool(...)` a un servizio Goa per generare JSON Schema e handler Streamable HTTP senza ciclo agente."

