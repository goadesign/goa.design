home_skill_next: "**Passaggio 2** · Chiedi al tuo coding agent:"
home_cli_next: "**Passaggio 2** · Segui il walkthrough in 3 passaggi:"
home_skill_prompt: "Usa goa-service-designer per inizializzare example.com/catalog, progettare un servizio catalog con endpoint HTTP e gRPC in design/catalog.go, eseguire go run goa.design/goa/v3/cmd/goa@latest gen example.com/catalog/design, implementare Lookup e testarlo."
home_skill_prompt_agent: "Inizializza example.com/catalog con goa.design/goa-ai@v0.90.0, progetta un assistente catalogo collegato a Lookup in design/catalog.go, esegui go run goa.design/goa/v3/cmd/goa gen example.com/catalog/design, leggi AGENTS_QUICKSTART.md e testalo in locale."
home_skill_outcome: "Il percorso servizio avvia un server HTTP + gRPC attivo; il percorso IA gira localmente in memoria a zero chiavi API prima di collegare modelli reali o Temporal."
home_cli_outcome: "Ogni walkthrough inizializza `example.com/catalog`, scrive `design/catalog.go`, esegue `goa gen` e testa l'handler end-to-end."

home_benefits_heading: "Perché generare contratti batte il codice infrastrutturale scritto a mano"
home_benefit_tokens: "54 righe di DSL → 57 file generati"
home_benefit_tokens_text: "Nell'[esempio di riferimento del catalogo](/it/docs/ai-development/#one-design-two-entry-points), 54 righe in `design/catalog.go` compilano oltre 5.000 righe di trasporti Go, OpenAPI, Protobuf e schemi JSON dei tool in `gen/` (versionato in Git, zero token di output LLM)."
home_benefit_context: "Un solo contratto da caricare nel contesto"
home_benefit_context_text: "Tipi di payload, vincoli regex/range, descrizioni e rotte di trasporto vivono in `design/*.go`. Il tuo coding agent legge il contratto e l'interfaccia in `gen/` invece di analizzare quattro livelli mantenuti a mano."
home_benefit_feedback: "Gli errori di compilazione intercettano subito le divergenze"
home_benefit_feedback_text: "Modifica un campo o un metodo in `design/` e riesegui `goa gen`. Go segnala immediatamente ogni handler, client ed esecutore di tool la cui firma non corrisponde più."

home_frameworks_heading: "Goa per i servizi. Goa-AI per agenti e MCP."
home_service_title: "Un contratto. Ogni trasporto."
home_service_text: "Dichiara payload, validazioni ed errori una sola volta in Go. Genera server `net/http` standard, gRPC e JSON-RPC, client tipizzati e specifiche OpenAPI 3 / Protobuf — routing, decodifica e validazione sono codice Go generato, non un framework basato su reflection."
home_service_docs: "Esplora Goa"
home_service_transports: "Server, client Go tipizzati e client CLI compilati dallo stesso design del servizio."
home_service_streams: "Streaming integrato nel design"
home_service_contracts: "Validazione al perimetro del trasporto"
home_service_contracts_text: "Campi obbligatori, pattern, intervalli, codici di stato degli errori, OpenAPI 3.2 e Protocol Buffers."

home_agent_title: "Agenti tipizzati, server MCP ed esecuzioni durevoli."
home_agent_text: "Estendi lo stesso DSL Go ad agenti IA con tool e server MCP. Testa in memoria in locale a zero chiavi API, poi collega OpenAI, Anthropic, AWS Bedrock o Google Vertex AI ed esegui in modo durevole su Temporal."
home_agent_docs: "Esplora Goa-AI"
home_agent_contracts: "Validazione del servizio e contesto nascosto"
home_agent_contracts_text: "Riusa i metodi dei servizi Goa come tool (`BindTo`), nascondi al modello i tenant ID forniti dal server (`Inject`) e limita le risposte paginate (`BoundedResult`)."
home_agent_composition: "Alberi multi-agente e valutazioni deterministiche"
home_agent_composition_text: "Componi agenti figli come tool con budget limitati e testa le traiettorie dei tool in modo deterministico senza chiamate LLM reali."
home_agent_execution: "Soglie di approvazione, streaming e MCP standalone"
home_agent_execution_text: "Metti in pausa i tool sensibili per approvazione umana (`Confirmation`), trasmetti eventi tipizzati alle UI o esponi MCP senza ciclo agente."

home_mcp_heading: "Crea server MCP dai tuoi servizi."
home_mcp_text: "Aggiungi `MCP(...)` a qualsiasi servizio Goa per esporre i metodi come tool MCP validati, risorse e template di prompt."
home_mcp_cta: "Crea un server MCP"
home_mcp_caption: "La regola regex di LookupPayload viene compilata sia nei decoder HTTP/gRPC sia nell'inputSchema di tools/list in MCP."
home_mcp_design: "Il tuo design Goa"
home_mcp_generated: "Interfaccia MCP generata"
home_mcp_contract: "Un unico contratto tipizzato"
home_mcp_result_server: "Server HTTP"
home_mcp_result_server_text: "Handler MCP su Streamable HTTP collegati direttamente ai tuoi endpoint Goa."
home_mcp_result_client: "Client tipizzati"
home_mcp_result_client_text: "Invoca tool MCP e leggi risorse tramite metodi Go generati."
home_mcp_result_schemas: "Schemi dei tool"
home_mcp_result_schemas_text: "JSON Schema di input e output derivati dalle stesse regole di `LookupPayload`."
home_mcp_result_validation: "Validazione e codec"
home_mcp_result_validation_text: "Rifiuta argomenti malformati del modello con suggerimenti di riprova prima dell'esecuzione dell'handler."
home_mcp_humans: "Un contratto da revisionare"
home_mcp_humans_text: "Verifica tipi, validazione e sicurezza in `design/catalog.go`. Implementa `Lookup` una volta in Go e rigenera `gen/` quando cambiano i requisiti."
home_mcp_llms: "Lavoro chiaro per i coding agent"
home_mcp_llms_text: "Il tuo coding agent modifica `design/` e `internal/` mentre `gen/` resta intoccabile, trasformando ogni deriva dello schema in errori immediati del compilatore Go."
home_mcp_capabilities: "Supporta resource server OAuth, scambi di input interattivi, Task durevoli, MCP Apps e Skills."

home_registry_heading: "Ospita un registry per i tuoi tool."
home_registry_text: "Esegui il server registry clusterizzato di Goa-AI come catalogo condiviso e gateway di invocazione. I servizi pubblicano toolset, gli agenti cercano e caricano gli schemi su richiesta invece di appesantire ogni prompt e le chiamate vengono instradate ai provider sani tramite Redis e [Pulse](/it/docs/3-ecosystem/pulse/) (la libreria Goa per streaming Redis e mappe replicate)."
home_registry_cta: "Ospita un tool registry"
home_registry_flow: "I provider di tool si collegano agli agenti tramite un registry"
home_registry_node: "Il tuo tool registry"
home_registry_node_text: "Scopri schemi · Instrada chiamate · Monitora la salute"
home_registry_consumers: "I tuoi agenti e le tue applicazioni"

home_compare_heading: "Come si confrontano Goa e Goa-AI"
home_compare_specs: "Toolchain Protobuf e OpenAPI (buf/Connect, oapi-codegen)"
home_compare_specs_text: "`buf` + ConnectRPC genera HTTP/gRPC da `.proto` mentre `oapi-codegen` parte da OpenAPI YAML. Goa esprime routing HTTP ricco, gRPC, JSON-RPC, OpenAPI 3.2 e toolset MCP/agenti in un unico pacchetto Go — generando direttamente in Go routing e validazione su `net/http` e `grpc`."
home_compare_mcp_sdk: "SDK Go MCP cablati a mano (go-sdk, mcp-go)"
home_compare_mcp_sdk_text: "Gli handler MCP basati su struct tag duplicano regole sui parametri già scritte per l'API HTTP/gRPC. Aggiungere `MCP(...)` e `Tool(...)` a un servizio Goa riusa gli stessi tipi di payload validati e la stessa implementazione del servizio."
home_compare_agent_sdk: "SDK per agenti in Python/TS (LangGraph, OpenAI Agents SDK)"
home_compare_agent_sdk_text: "Gli SDK a grafo cablano l'orchestrazione in codice applicativo tipizzato dinamicamente. Goa-AI compila codec Go tipizzati per i tool, contesto iniettato lato server, paginazione a cursore, soglie di approvazione e activity Temporal in un unico binario Go statico."

home_faq_heading: "Domande prima di iniziare"
home_faq_codegen_q: "Posso adottare Goa gradualmente in un repository Go esistente, e devo versionare gen/?"
home_faq_codegen_a: "Sì a entrambe. `goa gen` genera handler `net/http` standard e server `google.golang.org/grpc` (non un router basato su reflection), così puoi montare un servizio Goa accanto alle rotte Go esistenti, collegare middleware standard e versionare `gen/` per verificare ogni diff del contratto in code review."
home_faq_difference_q: "Come chiamano un servizio Goa i client non-Go, e quando aggiungo Goa-AI?"
home_faq_difference_a: "I client TypeScript, Python e mobile consumano direttamente le specifiche OpenAPI 3.2 e `.proto` generate. Parti con Goa per API HTTP/gRPC/JSON-RPC; aggiungi Goa-AI quando esponi tool MCP o esegui agenti di prodotto (testabili localmente a zero chiavi API prima di collegare modelli reali o Temporal)."
home_faq_tokens_q: "Quando Goa non è adatto, e come dovremmo valutarlo?"
home_faq_tokens_a: "Evita Goa per script usa e getta o piccoli prototipi in cui un pacchetto `design/` separato aggiunge cerimonia. Su servizi multi-endpoint o team con coding agent, confronta una funzionalità reale end-to-end (token, diff di revisione e difetti) partendo dal [walkthrough del catalogo](/it/docs/ai-development/#one-design-two-entry-points)."
home_faq_mcp_q: "Posso usare Goa-AI solo per esporre un server MCP?"
home_faq_mcp_a: "Sì. Aggiungi dichiarazioni `MCP(...)` e `Tool(...)` a un servizio Goa per generare JSON Schema `tools/list`, suggerimenti di riprova sulla validazione e handler Streamable HTTP senza eseguire un ciclo agente."

home_community_heading: "Librerie complementari e strumenti multi-agente"
home_community_intro: "Goa e Goa-AI si affiancano a librerie Go open source per osservabilità, stream di eventi su Redis, diagrammi C4 e sviluppo multi-agente."
home_ecosystem: "Esplora tutte le guide dell'ecosistema"
