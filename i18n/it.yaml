highbay_tab_agree: "1. Agree"
highbay_tab_arch: "2. Architecture"
highbay_tab_check: "3. Run 1 · Fallito"
highbay_tab_approve: "4. Run 2 · Approvato"
highbay_tab_agree_sub: "Conferma la Change Card e la matrice di autonomia prima di avviare i worker."
highbay_tab_approve_sub: "Esamina gli esiti per flusso e unisci i commit verificati nel tuo branch."
highbay_agree_pin_1: "Conferma il ripristino automatico in staging rispetto all’approvazione di reperibilità in produzione prima di scrivere codice."
highbay_agree_alt: "Vista Agree di Highbay per ops-copilot con la matrice dei confini di autonomia e il pulsante Confirm Intent."
highbay_arch_pin_1: "Ispeziona la topologia compilata (`Ops API & MCP`, `Triage Agent`, `Remediation Agent`, `Temporal Engine`, toolset MCP) e i budget di chiamata."
highbay_arch_view_alt: "Vista Architecture di Highbay per Ops Copilot Platform con grafo C4 planare, Temporal, toolset MCP e limiti delle policy agente."
highbay_check_pin_1: "Approvazione bloccata (`3 su 4 superati`) — `POST /runs/inc_42/approval` come `viewer`: `expected 403 Forbidden, got 200 OK`."
highbay_check_alt: "Vista Check di Highbay con Run 1 fallito su production_rollback_requires_approval e expected 403 Forbidden, got 200 OK."
highbay_approve_pin_1: "Dopo aver applicato il controllo sul ruolo `oncall`, passano `4 su 4` — fai merge direttamente o su un branch PR per la CI."
highbay_approve_alt: "Vista Approve di Highbay con 4 scenari su 4 superati per ops-copilot e Merge into current branch."
highbay_showcase_caption: "Renderizzato dal bundle `checkpoint.html` distribuito con Highbay."
highbay_showcase_method: "Ispeziona lo script di cattura su GitHub →"
highbay_walkthrough_kicker: ""
highbay_walkthrough_heading: "Un solo layout. Contratti compilati. Confini applicati."
highbay_walkthrough_intro: "Ogni servizio condivide `design/`, `gen/`, `internal/` ed `eval/` così sviluppatori e agenti si spostano tra repository senza dover reimparare le convenzioni."
highbay_role_guide: "1. Contratto · design/"
highbay_role_guide_caption: "Redatto dal tuo agente, confermato da te:"
highbay_card_choice: "Definisce API, tool MCP, architettura (`design/model.go`) e flussi eseguibili (`design/story.go`)."
highbay_role_codegen: "2. Generato · gen/"
highbay_role_codegen_caption: "Compilato da [Goa](/it/) e [Goa-AI](/it/docs/2-goa-ai/) (generatori Go open source) — mai modificato a mano:"
highbay_codegen_check: "Produce interfacce tipizzate, server HTTP/MCP, specifiche OpenAPI 3 e `AGENTS_QUICKSTART.md`; gli handler vivono in `internal/`."
highbay_role_tests: "3. Verifica separata · eval/"
highbay_role_tests_caption: "Scritta in una copia `.highbay-tests` separata a partire dal tuo accordo:"
highbay_builder_check: "Highbay rifiuta i report di test che toccano file fuori da `eval/` e i commit del builder che alterano `design/` o i test."
highbay_cap_kicker: ""
highbay_cap_heading: "Pattern integrati per l’infrastruttura di produzione"
highbay_cap_intro: "I servizi HTTP e MCP stateless girano come singolo binario; quando dichiarati, `highbay://golden-path` offre agli agenti un unico modo per collegare:"
highbay_cap_auth_title: "Autenticazione e principal ([Goa](/it/) · stateless)"
highbay_cap_auth_body: "Validazione JWT, OAuth2 e API key al perimetro con principal verificati in `context.Context` tipizzato."
highbay_cap_obs_title: "Osservabilità e log ([Clue](/it/docs/3-ecosystem/clue/) · OpenTelemetry)"
highbay_cap_obs_body: "Tracce e metriche OpenTelemetry, log bufferizzati emessi in caso di errore e sonde `/healthz`."
highbay_cap_stream_title: "Stream, code e worker ([Pulse](/it/docs/3-ecosystem/pulse/) · Redis)"
highbay_cap_stream_body: "Redis Streams tipizzati, worker pool con consistent hashing e failover, e mappe distribuite di rate limiting."
highbay_cap_durable_title: "Agenti e workflow durevoli ([Goa-AI](/it/docs/2-goa-ai/) · Temporal)"
highbay_cap_durable_body: "Adattatori Anthropic, OpenAI, Bedrock, Vertex e gateway, limiti `RunPolicy`, pause `Confirmation` resistenti ai crash e controlli sul budget di prompt a runtime ([`TestSeededPayloadBloatFailsTheBudget`](https://github.com/goadesign/highbay/blob/main/examples/orders-eval/acceptance/acceptance_test.go#L36-L60))."
highbay_proof_codegen_title: "~70% generato ([ispeziona `gen/`](https://github.com/goadesign/highbay/tree/main/gen))"
highbay_proof_codegen_body: "Misurato sui servizi stessi di Highbay, `gen/` costituisce il ~70% del codice Go non di test con zero output LLM."
highbay_proof_playbook_title: "Playbook in 12 sezioni ([`GOLDEN_PATH.md`](https://github.com/goadesign/highbay/blob/main/internal/goldenpath/GOLDEN_PATH.md))"
highbay_proof_playbook_body: "Servito via MCP (`highbay://golden-path`) affinché Claude, Codex e Gemini seguano uno stesso standard tra repository."
highbay_proof_suite_title: "Verifica crash e permessi ([`orders-eval`](https://github.com/goadesign/highbay/tree/main/examples/orders-eval/acceptance))"
highbay_proof_suite_body: "Le suite di riferimento inviano `SIGKILL` ai worker a metà esecuzione, riavviano le API durante approvazioni in sospeso e rifiutano i chiamanti non autorizzati (`403`)."
highbay_compare_heading: "Come si confronta Highbay"
highbay_compare_intro: "Dove differiscono i flussi per coding agent e i framework per agenti."
highbay_compare_solo: "Plan Mode singolo e .cursorrules"
highbay_compare_solo_text: "Plan mode e regole Markdown chiariscono l’intento iniziale, ma le convenzioni in prosa divergono tra le PR e una singola sessione continua a valutare il proprio codice."
highbay_compare_speckit: "SDK agenti Python/TS (LangGraph, Agents SDK)"
highbay_compare_speckit_text: "Gli SDK code-first collegano catene nel codice applicativo; Highbay compila prima i contratti HTTP, OpenAPI 3 e MCP e affianca un verificatore separato."
highbay_compare_workspaces: "Runner di worktree paralleli"
highbay_compare_workspaces_text: "I runner paralleli eseguono lo stesso prompt su branch concorrenti da confrontare a mano; Highbay coordina un builder e un test writer su un unico contratto."
highbay_faq_scope_q: "Come si inserisce Highbay nei repository esistenti, con gRPC e nei flussi PR/CI?"
highbay_faq_scope_a: "Highbay crea nuovi servizi (chiamabili via HTTP, OpenAPI 3 o MCP da Python, TypeScript, Go o web) o estende repository Goa esistenti; non converte altri router sul posto. `highbay gen` rifiuta `GRPC` (`protoc` non è incluso; `goa gen` standalone supporta gRPC), e i commit approvati possono essere uniti direttamente o su un branch PR per la CI."
highbay_faq_holdouts_q: "Cosa impedisce al builder di modificare il contratto o i test?"
highbay_faq_holdouts_a: "Highbay sovrascrive `design/` dalla revisione confermata durante la generazione del codice e rifiuta i commit che alterano `design/` o i test scritti in `eval/`. Valutatori esterni (`highbay verification set`) possono anche eseguire scenari holdout oscurati."
highbay_faq_local_q: "Highbay richiede un account cloud o una chiave API per i modelli?"
highbay_faq_local_a: "Nessuno dei due: i coding agent usano i propri login CLI esistenti e gli scenari `eval/` usano modelli simulati scriptati (`0` chiavi API esterne a meno di testare chiamate live)."
highbay_faq_sandbox_q: "Come vengono limitati i processi locali e i permessi?"
highbay_faq_sandbox_a: "Token MCP per ruolo riservano conferma, approvazione e merge solo all’utente, e i controlli del builder girano in un container Docker Linux locale. Agenti e binari candidati girano come normali processi sotto il tuo utente (non una sandbox VM); vedi la [guida dell’ecosistema](../docs/3-ecosystem/highbay/#architecture)."
highbay_bottom_heading: "Costruisci il tuo primo servizio"
highbay_bottom_intro: "Esegui il setup una volta, apri una nuova cartella di servizio nel tuo coding agent e invoca `/highbay`."
