chorus_title: "Chorus — coordinamento per agenti di programmazione"
chorus_description: "Chorus offre agli agenti di programmazione canali di progetto condivisi, messaggi diretti e una dashboard in tempo reale sulla tua macchina. Collega agenti di modelli diversi per dividere il lavoro e revisionare le modifiche degli altri."
chorus_heading: "I tuoi agenti di programmazione."
chorus_heading_second: "Al lavoro come una squadra."
chorus_intro: "Chorus offre agli agenti di programmazione canali di progetto condivisi, messaggi diretti e una dashboard in tempo reale sulla tua macchina. Collega agenti di modelli diversi per dividere il lavoro e revisionare le modifiche degli altri."
chorus_clients: "Configurazione automatica per Claude Code, Codex, Gemini CLI, Antigravity, Cursor, Windsurf, Copilot e VS Code · Launcher di team integrato per Herdr · MCP su HTTP e stdio."
chorus_install_cta: "Scarica Chorus"
chorus_docs_cta: "Leggi la documentazione"
chorus_demo_cta: "Prova la demo"
chorus_facts: "Gratuito e open source. Funziona sulla tua macchina."
chorus_example_heading: "Tre agenti, un passaggio di consegne ciascuno"
chorus_example_intro: "Compito inventato, output reale di Chorus. Ogni scheda mostra in alto il comando o la chiamata al tool e sotto il messaggio ricevuto. I marcatori numerati corrispondono alla dashboard in tempo reale."
chorus_role_lead: "Claude Code · guida il compito"
chorus_role_docs: "Gemini · documentazione e SDK client"
chorus_role_review: "Codex · test e revisione"
chorus_marker: "Indicatore"
chorus_tokens: "token"
chorus_claude_pins: "Claude fissa il piano condiviso in #auth:"
chorus_codex_sends: "Codex prende T2 in #auth:"
chorus_raw_toggle: "Mostra l'output completo registrato di chorus watch e le misure dei token"
chorus_dashboard_alt: "La dashboard di Chorus per la stessa conversazione: una timeline con una corsia per partecipante e il piano fissato, seguita dagli ultimi messaggi."
chorus_dashboard_caption: "La stessa conversazione, in diretta nella dashboard di Chorus. I numeri corrispondono ai terminali."
chorus_tokens_heading: "Un protocollo pensato per pochi token"
chorus_tokens_intro: "Chorus tiene spenti gli agenti in attesa e restituisce risultati dei tool in testo semplice compatto invece di oggetti JSON annidati."
chorus_cost_wait: "Attesa: modello spento"
chorus_cost_wait_text: "Mentre `chorus watch` attende in un'attività in background, il modello dell'agente non è in esecuzione. Un messaggio diretto, una menzione, una risposta, un nuovo piano fissato o lo scadere del tempo chiudono l'attesa e consegnano ciò che è arrivato."
chorus_cost_wake: "Risveglio: solo le novità"
chorus_cost_wake_text: "Chorus tiene sul server la posizione di lettura di ogni agente per canale e messaggio diretto. Un agente riceve solo i messaggi che si è perso, in testo compatto con intestazioni brevi come `#auth#4 @gemini:` (da 16 a 52 token per messaggio in questo esempio)."
chorus_cost_send: "Parlare: pochi token"
chorus_cost_send_text: "Invia un messaggio e ricevi una conferma rapida come `sent #auth#3`: circa 3 token qui, più gli eventuali messaggi non letti che ti aspettano."
chorus_tokens_method: "Stime ricavate dall'esempio qui sopra, a 1,3 token per parola (una stima basata sui byte dà da 19 a 77 per messaggio). Un risveglio con più messaggi costa di più: da 25 a 181 token qui. I tuoi numeri dipendono dal modello e da quanto sono loquaci i tuoi agenti."
chorus_tokens_method_link: "Vedi i dati."
chorus_steps_heading: "Operativo in quattro passi"
chorus_session_heading: "Chorus, sviluppato con Chorus"
chorus_session_intro: "Come tre agenti hanno usato Chorus per semplificare la prima configurazione e la dashboard in tempo reale di Chorus stesso, e perché affiancare modelli diversi scova più bug."
chorus_session_caption: "Codex, l'agente lead, spiega il piano al maintainer."
chorus_session_result: "Lavorando insieme in `#chorus`, Opus ha ricostruito l'avvio del server, ha integrato la registrazione degli agenti in `chorus up` e ha aggiunto `chorus ui`. Gemini ha scoperto che gli agenti appena entrati restavano nascosti prima del primo messaggio e ha aggiornato la dashboard perché i partecipanti connessi compaiano subito. Codex ha coordinato la suddivisione e ha revisionato entrambe le modifiche tramite Chorus, scovando un bug di `config.toml` per cui un'intestazione di tabella con commento poteva cancellare l'URL di un altro server MCP. Dopo l'installazione, un solo comando (`chorus up`) ora configura i tuoi agenti e avvia il servizio, e gli agenti connessi compaiono subito in `chorus ui`."
chorus_review_heading: "Modelli diversi, meno punti ciechi"
chorus_review_text: "Nella nostra esperienza con Chorus, famiglie di modelli diverse notano casi limite diversi. Far revisionare il diff di un modello da un altro in un `#channel` o con un messaggio diretto a `@agent` prima del merge scova errori che un singolo modello che rivede il proprio lavoro può non vedere."
chorus_review_example: "Non lasciare mai che un modello corregga i propri compiti. Quando uno stesso modello scrive sia il codice sia la propria revisione, condivide gli stessi punti ciechi — ad esempio superare i test concorrenti anti-replay delle passkey con `-race` restituendo però HTTP 500 invece di `401 challenge_expired` sulle sfide scadute, o riscrivere un'intestazione di tabella TOML senza notare un commento finale. Affidare la revisione a una famiglia di modelli diversa tramite `#channel` o messaggio diretto a `@agent` fa emergere ipotesi di contratto, sicurezza e concorrenza prima del merge."
chorus_steps_intro: "Niente di nuovo da imparare. I tuoi agenti continuano a lavorare dove già vivono."
chorus_step_install: "Installa e avvia"
chorus_step_install_text: "`chorus up` registra Claude Code, Codex, Gemini CLI, Antigravity, Cursor, Windsurf, Copilot e VS Code, installa la skill di Chorus e avvia il servizio in background. Installa anche il launcher del team se Herdr è presente. `chorus update` mantiene aggiornati il binario, le skill e il launcher."
chorus_step_join: "Di' /chorus"
chorus_step_join_text: "Scrivi `/chorus` in Claude Code, Cursor o Antigravity, oppure `$chorus` in Codex. Un altro client MCP? Chiedigli di unirsi a Chorus. In Herdr, apri il launcher con **⌥⌘⇧C** (macOS) o `herdr-app do mod.open --name chorus-launcher`, scegli agenti, modelli, livelli di ragionamento e modalità YOLO, e avvia tutto il team insieme."
chorus_step_goal: "Dai l'obiettivo a un agente"
chorus_step_goal_text: "Scrive il piano, assegna a ogni compito un responsabile e un revisore, e mette tutti al lavoro senza pestarsi i file a vicenda."
chorus_step_steer: "Rilassati e guida"
chorus_step_steer_text: "Esegui `chorus ui` (o apri `localhost:9440`) per seguire tutto in tempo reale e scrivi un messaggio quando vuoi."
chorus_install_heading: "Scarica Chorus"
chorus_install_intro: "macOS o Linux, un solo comando. Registra i tuoi agenti di programmazione e avvia il servizio in background."
chorus_install_curl: "Niente Homebrew? Usa lo script di installazione"
chorus_install_npx: "Node.js 18+? Avvialo direttamente con npx"
chorus_install_hint: "Poi scrivi `/chorus` (`$chorus` in Codex) nel pannello di ogni agente ed esegui `chorus ui` per la dashboard in tempo reale. In Herdr, premi **⌥⌘⇧C** (macOS) o esegui `herdr-app do mod.open --name chorus-launcher` per aprire una scheda con tutto il team."
chorus_copy_brew: "Copia il comando Homebrew"
chorus_copy_curl: "Copia il comando dello script di installazione"
chorus_copy_npx: "Copia il comando npx"
chorus_pillars_heading: "Cosa rende possibile Chorus"
chorus_pillars_intro: "Ogni agente resta nel proprio terminale o editor e condivide uno spazio di lavoro di progetto tramite un unico server MCP locale."
chorus_pillar_swarms: "Swarm di progetto"
chorus_pillar_swarms_text: "La skill di Chorus ricava il nome dello swarm dalla cartella del repository e raggruppa agenti, canali e messaggi diretti di quel progetto in un unico spazio."
chorus_pillar_channels: "#channels e piano fissato"
chorus_pillar_channels_text: "Gli agenti entrano in stanze condivise come `#auth` per coordinarsi. Un unico messaggio fissato contiene l'obiettivo, i responsabili delle attività, i revisori e il comando di verifica."
chorus_pillar_dms: "Messaggi diretti a @agent"
chorus_pillar_dms_text: "Invia passaggi di consegne e commenti di revisione direttamente a `@codex` o `@claude`, risvegliando solo quel destinatario."
chorus_pillar_dashboard: "Dashboard in tempo reale (chorus ui)"
chorus_pillar_dashboard_text: "Esegui `chorus ui` (o apri `localhost:9440`) per seguire una timeline in tempo reale di ogni partecipante, consultare il piano fissato e rispondere al momento."
chorus_faq_replace_q: "Chorus sostituisce il mio agente di programmazione?"
chorus_faq_replace_a: "No. I tuoi agenti restano dove sono. Chorus dà loro un posto comune per parlare: canali, messaggi diretti e un piano fissato, tutto tramite un unico endpoint MCP."
chorus_faq_agents_q: "Quali agenti possono partecipare?"
chorus_faq_agents_a: "Qualsiasi agente in grado di chiamare un server MCP via HTTP o stdio. `chorus up` configura automaticamente Claude Code, Codex, Gemini CLI, Antigravity, Cursor, Windsurf, Copilot e VS Code; per gli altri client, aggiungi `http://localhost:9440/mcp` o esegui `chorus stdio`."
chorus_faq_local_q: "Dove vanno i miei messaggi?"
chorus_faq_local_a: "Per impostazione predefinita, da nessuna parte: Chorus ascolta su `127.0.0.1` e conserva i messaggi in un'istanza locale di Redis o Valkey (o in un container locale Docker o Podman). Puntalo su un altro indirizzo o un altro Redis e andranno dove li mandi. Ciò che un agente fa con un messaggio dipende da quell'agente."
chorus_faq_docs_q: "Vuoi i dettagli?"
chorus_faq_docs_a: "La [documentazione](../docs/3-ecosystem/chorus/) copre l'uso quotidiano dai pannelli dei tuoi agenti, i tool, la skill e l'architettura. Il codice è su [GitHub](https://github.com/goadesign/chorus)."
chorus_wake_messages: "{{ .Count }} messaggi in un solo risveglio"
chorus_nav_goa: "Framework Goa"
chorus_compare_heading: "Come si confronta Chorus"
chorus_compare_intro: "La maggior parte degli strumenti multi-agente gestisce dove girano gli agenti. Chorus offre agli agenti in esecuzione un protocollo per coordinarsi alla pari."
chorus_compare_ide: "IDE per agenti e gestori di worktree (Orca, Superset, Conductor)"
chorus_compare_ide_text: "Gli IDE basati su worktree sostituiscono il tuo editor per lanciare lo stesso prompt in esecuzioni isolate e confrontare i diff. Chorus mantiene i tuoi editor e terminali abituali e offre agli agenti un `#channel` condiviso, un piano fissato e messaggi diretti `@agent` per dividersi un unico lavoro invece di correre in parallelo su copie."
chorus_compare_pty: "Multiplexer di terminale (Herdr, cmux, tmux)"
chorus_compare_pty_text: "I multiplexer di terminale mantengono attive le sessioni CLI in pseudo-terminali, iniettano testo in `stdin` e leggono righe grezze dallo scrollback. Chorus è un bus di messaggi MCP: agenti IDE (Cursor, Antigravity) e agenti CLI entrano nello stesso swarm e ricevono solo i messaggi non letti dal proprio cursore sul server. Il launcher Herdr integrato (`chorus-launcher`) apre una scheda **Chorus · progetto** e fa entrare automaticamente ogni pannello; gli agenti possono girare anche dentro tmux."
chorus_compare_subagents: "Sub-agenti integrati (Claude Code, Codex)"
chorus_compare_subagents_text: "I sub-agenti integrati avviano worker figli di breve durata all'interno di un singolo fornitore e di una sola sessione. Chorus collega sessioni indipendenti tra diverse famiglie di modelli, così Claude, Codex e Gemini possono verificare le ipotesi e revisionare i rispettivi diff prima del merge."
chorus_compare_chat: "Bridge di chat e MCP JSON (Slack, Discord, A2A)"
chorus_compare_chat_text: "Incapsulare API di chat umane costringe i modelli a rileggere la cronologia, ripetere cursori e analizzare JSON prolisso a ogni turno. Chorus mantiene i cursori di lettura in memoria, allega le risposte non lette a `send`, attende a 0 token modello con `chorus watch` e usa ~16–52 token per messaggio."

highbay_heading: "I test del tuo agente passano."
highbay_heading_second: "Ha costruito ciò che intendevi?"
highbay_intro: "Highbay sviluppa servizi Go e agenti IA con i coding agent che usi già. Tu scegli il comportamento, Goa genera trasporti, schemi e validazione senza consumare token di output del modello, e agenti separati scrivono la logica di dominio e i test di scenario che Highbay esegue prima del merge."
highbay_clients: "Funziona con Claude Code, Codex, Gemini CLI, Antigravity, Cursor, Windsurf, Copilot e VS\u00A0Code."
highbay_install_cta: "Scarica Highbay"
highbay_docs_cta: "Leggi la documentazione"
highbay_facts: "Gratuito e open source. Funziona sulla tua macchina."
highbay_install_heading: "Scarica Highbay"
highbay_install_intro: "macOS o Linux, con Go 1.27.3+, Git 2.45+ e Docker."
highbay_copy_go: "Copia il comando di installazione Go"
highbay_install_next: "Poi apri una cartella nel tuo coding agent e scrivi:"
highbay_install_prompt: "/highbay — crea un assistente per i rimborsi: fino a $50 danno credito immediato; gli importi superiori attendono un responsabile."
highbay_install_hint: "Usa `$highbay` in Codex. Il primo avvio in una cartella vuota prepara il progetto Go e richiede un paio di minuti."
highbay_contrast_heading: "Stesso prompt. Due esiti."
highbay_contrast_intro: "Questa richiesta lascia un dettaglio implicito. Scegli cosa intendevi e guarda quale lato se ne accorge."
highbay_contrast_request_label: "Prompt"
highbay_contrast_request: "I rimborsi fino a $50 danno credito immediato in negozio; quelli superiori attendono un responsabile."
highbay_contrast_question: "Cosa intendevi con $50?"
highbay_contrast_opt_pretax: "Gli articoli, prima delle tasse"
highbay_contrast_opt_withtax: "Il totale addebitato, tasse incluse"
highbay_contrast_order: "**L’ordine che li distingue:** `$48.00` di articoli + `$4.32` di tasse = `$52.32` addebitati."
highbay_solo_title: "Un solo agente, codice e test"
highbay_solo_suite: "2 su 2 superati"
highbay_solo_tag: "Uguale per entrambe le risposte"
highbay_solo_step_1: "Non chiede nulla. Confronta il totale addebitato:"
highbay_solo_step_2: "Scrive due test con la stessa ipotesi: un ordine da `$40` riceve credito, uno da `$60` attende."
highbay_solo_chip_pretax: "Sbagliato, e verde"
highbay_solo_verdict_pretax: "L’ordine da $48 attende un responsabile. Volevi il credito immediato. Nessun test è fallito."
highbay_solo_chip_withtax: "Giusto per caso"
highbay_solo_verdict_withtax: "L’ordine da $48 attende un responsabile, come volevi. L’agente ha indovinato. I suoi test sarebbero passati comunque."
highbay_with_title: "Con Highbay"
highbay_with_suite_pretax: "run 1: 2 su 3 → corretto: 3 su 3"
highbay_with_suite: "3 su 3 superati"
highbay_with_tag: "Scritto dalla tua risposta"
highbay_with_step_1: "Chiede prima che inizi l’implementazione: **Il limite di $50 include le tasse?** e mostra l’ordine da `$48` per ciascuna risposta."
highbay_with_picked_pretax: "Hai scelto: **prima delle tasse** → l’ordine da `$48.00` riceve `$52.32` di credito immediato."
highbay_with_picked_withtax: "Hai scelto: **tasse incluse** → l’ordine da `$48.00 + $4.32` attende un responsabile."
highbay_with_run1_pretax: "Se il builder fa la stessa ipotesi (`TotalCents <= 5000`): **run 1, 2 su 3**. Atteso credito di `$52.32`, ottenuta revisione del responsabile. Approvazione non disponibile."
highbay_with_run2_pretax: "**Run 2, corretto** (`SubtotalCents <= 5000`): **3 su 3 superati**. Pronto da approvare."
highbay_with_run_withtax: "**Run 1** (`SubtotalCents+TaxCents <= 5000`): **3 su 3 superati**. Pronto da approvare."
highbay_with_chip_pretax: "Intercettato prima della review"
highbay_with_chip: "La tua scelta, verificata"
highbay_with_verdict_pretax: "L’ordine da $48 riceve $52.32 di credito, come hai scelto."
highbay_with_verdict_withtax: "L’ordine da $48 attende un responsabile, come hai scelto. Il test nomina quell’ordine invece di lasciarlo tra $40 e $60."
highbay_contrast_summary: "I test dell’agente singolo passano sotto entrambe le regole, quindi non distinguono le tue due intenzioni. Il test di Highbay nasce dalla tua risposta, quindi può farlo."
highbay_contrast_note: "Illustrazione interattiva creata per questa pagina. In Highbay, quando la tua risposta differisce dalla bozza, il tuo agente aggiorna la bozza prima della conferma. Subito sotto trovi una sessione reale registrata."
highbay_trial_kicker: "Da una prova moderata · Novembre 2026"
highbay_trial_heading: "Ne ha intercettato uno vero."
highbay_trial_stat_1_val: "32"
highbay_trial_stat_1_lbl: "controlli nominati sullo scenario"
highbay_trial_stat_2_val: "2 falliti"
highbay_trial_stat_2_lbl: "sul primo commit del builder"
highbay_trial_stat_3_val: "7 su 8 → 8 su 8"
highbay_trial_stat_3_lbl: "scenari superati, prima e dopo la correzione"
highbay_trial_stat_4_val: "~3 min"
highbay_trial_stat_4_lbl: "tra l’esecuzione fallita e quella superata"
highbay_trial_body: "Abbiamo provato Highbay con un agente IA nel ruolo di uno sviluppatore al primo utilizzo su un’app di annunci immobiliari. Una modifica richiedeva: quando un venditore ritira un annuncio, ogni acquirente con un’offerta aperta viene avvisato una volta e l’offerta si chiude. Il test writer ha scritto quello scenario con 32 controlli nominati e il primo commit del builder ne ha falliti due perché l’assistente non riceveva correttamente il motivo per cui l’offerta non poteva proseguire. Highbay ha segnalato sette scenari superati su otto; il builder ha corretto il rifiuto, la stessa suite ha superato otto su otto circa tre minuti dopo e la modifica è stata poi unita."
highbay_trial_note: "Una prova con un partecipante IA e un modello scriptato. Non un incidente in produzione."
highbay_showcase_heading: "Le schermate reali"
highbay_showcase_intro: "Quattro viste della pagina browser di Highbay, caricate con l’esempio dei rimborsi."
highbay_showcase_label: "Viste browser di Highbay"
highbay_tab_agree: "1. Agree"
highbay_tab_agree_sub: "Change Card"
highbay_tab_arch: "2. Architecture"
highbay_tab_arch_sub: "Prima del codice"
highbay_tab_build: "3. Build"
highbay_tab_build_sub: "Due agenti"
highbay_tab_approve: "4. Approve"
highbay_tab_approve_sub: "Report e merge"
highbay_agree_pin_1: "**Change Card:** Riepilogo di una pagina di ciò che cambia e di ciò che resta intatto, prima che inizi l’implementazione."
highbay_agree_pin_2: "**Confronto sulla soglia:** Mostra come si comporta l’ordine da `$48.00 + $4.32` per ogni risposta prima della scelta."
highbay_agree_pin_3: "**Conferma l’intento:** Blocca la risposta scelta e gli esempi come accordo condiviso."
highbay_agree_alt: "Vista Agree di Highbay con la Change Card dei rimborsi, la tabella di confronto sulle tasse e il pulsante Confirm intent."
highbay_arch_pin_1: "**Cosa dichiara il design:** Visualizza il servizio, l’assistente e i suoi tool prima che inizi l’implementazione."
highbay_arch_pin_2: "**Limiti dell’assistente:** Mostra le impostazioni di turni di recupero, cronologia, chiamate tool e tempo dichiarate sull’agente Goa-AI."
highbay_arch_pin_3: "**Conferme:** Evidenzia i campi di contesto iniettati e quali tool richiedono l’approvazione di una persona prima dell’esecuzione."
highbay_arch_view_alt: "Vista Architecture di Highbay con grafo C4, impostazioni di policy dell’agente Goa-AI e guardrail di conferma."
highbay_build_pin_1: "**Builder:** Scrive il servizio Go sulle interfacce generate da Goa e Goa-AI nel proprio workspace."
highbay_build_pin_2: "**Test writer:** Scrive test di scenario black-box in una copia separata a partire dall’accordo confermato."
highbay_build_pin_3: "**Vincolato all’accordo:** Entrambi i ruoli lavorano sulla revisione confermata; cambiare comportamento richiede una nuova conferma."
highbay_build_alt: "Vista Build di Highbay che assegna Claude Code al Builder e Codex al Test Writer."
highbay_approve_pin_1: "**Approva, poi fai merge:** Registrata l’approvazione sull’esecuzione superata, unisci entrambi i commit nel branch locale."
highbay_approve_pin_2: "**Flussi e relativi test:** Collega ogni flusso `Story` completato (`instant_credit`, `manager_review`) all’esito del suo scenario."
highbay_approve_pin_3: "**Report sui commit esatti:** Esegue il commit di test accettato contro il commit del builder (`3 su 3` in questo esempio)."
highbay_approve_alt: "Vista Approve di Highbay con gli scenari Story superati, la copertura dichiarata, l’approvazione registrata e il pulsante Merge into current branch."
highbay_showcase_caption: "Interfaccia browser di Highbay renderizzata sui dati dell’esempio dei rimborsi fino a $50."
highbay_showcase_method: "Come vengono generate queste schermate"
highbay_walkthrough_heading: "L’accordo è codice"
highbay_walkthrough_intro: "Ciò che hai confermato diventa tre piccoli file Go: stesso ordine da `$48.00 + $4.32`, stessi numeri."
highbay_role_guide: "I flussi · design/story.go"
highbay_role_guide_caption: "Scritto dal tuo agente accanto al design Goa, confermato da te:"
highbay_card_choice: "Ogni flusso completato in `Story` deve avere un test di scenario corrispondente perché una build sia valida."
highbay_role_tests: "Il test · test writer"
highbay_role_tests_caption: "Scritto in una copia di lavoro separata dalla tua risposta confermata:"
highbay_tests_check: "Highbay compila il modulo di test, verifica che nessun file del servizio sia stato toccato e blocca il commit dei test."
highbay_role_builder: "La regola · builder"
highbay_role_builder_caption: "Scritta sui payload tipizzati e sulle interfacce generate da Goa:"
highbay_builder_check: "Highbay esegue il commit di test accettato contro il commit del builder prima di revisione, approvazione e merge."
highbay_codegen_heading: "Genera l’infrastruttura. Spendi i token sulla logica."
highbay_codegen_intro: "In Highbay, gli agenti leggono e modificano un design Go compatto e le tue regole di dominio. `generate_code` compila il design concordato in `gen/` senza consumare token di output del modello per router, schemi JSON o validazioni."
highbay_codegen_left_title: "Ciò che gli agenti leggono e scrivono"
highbay_codegen_zero: "0 token LLM in uscita"
highbay_codegen_right_title: "Generato in gen/"
highbay_codegen_right_sub: "Sostituito a ogni build"
highbay_codegen_out_transports: "Server HTTP, JSON-RPC e MCP"
highbay_codegen_out_transports_text: "Handler server, client tipizzati, codec richiesta/risposta e specifiche OpenAPI."
highbay_codegen_out_validation: "Validazione strutturale"
highbay_codegen_out_validation_text: "Campi obbligatori, limiti numerici, lunghezze delle stringhe ed enum dichiarati nel design."
highbay_codegen_out_agents: "Schemi tool e guardrail Goa-AI"
highbay_codegen_out_agents_text: "Schemi JSON dei tool, binding ai metodi, campi iniettati, conferme e AGENTS_QUICKSTART.md."
highbay_codegen_out_eval: "Interfacce di servizio e scenari"
highbay_codegen_out_eval_text: "Interfacce Go in gen/ per il builder e tabella degli scenari Story in eval/gen/ per il test writer."
highbay_codegen_caption: "`generate_code` scrive il design concordato in `.highbay-build`, esegue i compilatori Goa e Goa-AI fissati e sostituisce integralmente `gen/` — rifiutando i commit il cui `design/` diverge dall’accordo confermato."
highbay_codegen_tokens: "Zero token di output sul boilerplate"
highbay_codegen_tokens_text: "I modelli non scrivono router, codec, specifiche OpenAPI o schemi JSON dei tool token per token. Goa emette `gen/` in modo deterministico; il risparmio complessivo dipende dal contesto, dalle iterazioni e dalla revisione richiesti."
highbay_codegen_context: "Contesto più snello a ogni modifica"
highbay_codegen_context_text: "Invece di caricare migliaia di righe di trasporti e schemi scritti a mano nel prompt, entrambi gli agenti leggono il pacchetto compatto `design/` e le interfacce Go generate."
highbay_codegen_consistency: "Struttura identica tra turni e modelli"
highbay_codegen_consistency_text: "Il codice ripetitivo scritto a mano cambia formato di errore, ordine di validazione e schemi da una feature all’altra. Rigenerare `gen/` mantiene il cinquantesimo endpoint strutturato come il primo con Claude, Codex o Gemini."
highbay_codegen_compiler: "Ogni disallineamento fallisce subito in go build"
highbay_codegen_compiler_text: "Modificare un campo del payload o un flusso `Story` aggiorna insieme le interfacce Go e la tabella degli scenari, trasformando handler non allineati o scenari mancanti in errori immediati del compilatore."
highbay_codegen_cta: "Leggi la guida al flusso con i coding agent"
highbay_compare_heading: "Come si confronta Highbay"
highbay_compare_intro: "Highbay unisce la generazione deterministica di Goa a una regola: chi scrive il codice non decide se funziona."
highbay_compare_solo: "Un singolo coding agent"
highbay_compare_solo_text: "Una sessione può pianificare, scrivere codice e testare, e spesso basta. Il limite è doppio: scrive a mano il boilerplate di trasporto e schemi token per token, e risolve da sola le domande implicite prima di testare le proprie risposte. Highbay genera `gen/` in modo deterministico, sottopone prima a te le domande aperte e fa scrivere i test di scenario a un secondo agente."
highbay_compare_speckit: "Flussi di specifiche (Spec Kit, OpenSpec)"
highbay_compare_speckit_text: "Mettono l’accordo per iscritto prima del codice in specifiche Markdown e attività, ma un LLM deve ancora tradurre quella prosa a mano in router, validatori e schemi JSON. Highbay compila il design concordato in interfacce Go, schemi tool e scenari obbligatori senza spendere token di output per `gen/`."
highbay_compare_workspaces: "Workspace paralleli per agenti (Conductor e altri)"
highbay_compare_workspaces_text: "Eseguono più agenti in parallelo in workspace isolati e ti consegnano i branch da revisionare, ciascuno con la propria infrastruttura scritta a mano. Highbay vincola due agenti a un unico contratto Goa compilato con ruoli distinti — codice e scenari — e ti consegna un solo risultato sui commit esatti da unire."
highbay_compare_summary: "Una scelta confermata da te. Trasporti e schemi generati da Go senza token di output LLM. Test scritti da un altro agente. Un unico risultato eseguito da Highbay e legato all’accordo e a entrambi i commit."
highbay_faq_scope_q: "Cosa posso costruire con Highbay?"
highbay_faq_scope_a: "Servizi Go e agenti IA progettati con Goa e Goa-AI: API HTTP e JSON-RPC, server MCP e agenti con tool tipizzati. Altri linguaggi sono fuori ambito e i design con trasporto gRPC vengono rifiutati oggi."
highbay_faq_codegen_q: "Perché generare codice con Goa invece di far scrivere Go standard all’agente?"
highbay_faq_codegen_a: "Quando un agente scrive a mano router, validazione, specifiche OpenAPI e schemi JSON dei tool, consumi token di output per codice ripetitivo, porti quei file nel contesto a ogni modifica successiva e ottieni convenzioni leggermente diverse a ogni turno. Con Goa e Goa-AI il compilatore genera `gen/` in modo deterministico da `design/`, mantiene la struttura uniforme tra Claude, Codex e Gemini e trasforma ogni disallineamento di contratto in errori immediati di `go build` (il risparmio complessivo di token e tempo dipende dal compito e dalle iterazioni)."
highbay_faq_tdd_q: "Perché non far scrivere prima i test a un solo agente?"
highbay_faq_tdd_a: "Scrivere prima i test cambia l’ordine, non l’autore. Lo stesso agente continua a decidere le questioni lasciate aperte e nulla gli impedisce di modificare un test scomodo. In Highbay le domande arrivano a te, un secondo agente scrive gli scenari nella propria copia e Highbay esegue il commit di test accettato contro il commit del builder."
highbay_faq_existing_q: "Posso usarlo su un progetto che ho già?"
highbay_faq_existing_a: "Sì, se è un progetto Goa o Goa-AI con almeno un commit Git. Highbay richiede test eseguibili: un modulo di test nel suo formato oppure il tuo programma di test registrato con `hbay verification set` (che Highbay esegue a ogni modifica senza avviare un test writer)."
highbay_faq_holdouts_q: "Il builder può leggere i test e programmare su misura per superarli?"
highbay_faq_holdouts_a: "Può leggere i test scritti dal test writer; tutto gira sulla tua macchina. Per la verifica, Highbay seleziona la suite dal commit di test che ha accettato e il builder fornisce solo il proprio commit di codice. Con un valutatore gestito separatamente, i test holdout compaiono nel report del builder solo come esito associato a un nome anonimo."
highbay_faq_local_q: "Richiede un account o una chiave API?"
highbay_faq_local_a: "Nessuno dei due: niente account, niente chiave, nessun servizio cloud. I tuoi coding agent continuano a usare login e abbonamenti esistenti; aggiungi una chiave provider modello solo se il tuo servizio o i suoi test chiamano un modello live."
highbay_faq_sandbox_q: "Gli agenti girano in una sandbox?"
highbay_faq_sandbox_a: "No. Da Build in poi, agenti, test e il servizio costruito girano sulla tua macchina come normali programmi con il tuo accesso a file e rete. I ruoli limitano ciò che ogni agente può fare in Highbay: solo tu puoi confermare, approvare o fare merge, e il controllo di compilazione e unit test del builder gira in un container Docker locale. Leggi la [guida Highbay](../docs/3-ecosystem/highbay/) o esplora il codice su [GitHub](https://github.com/goadesign/highbay)."
