highbay_arch_pin_1: "Controlla il diagramma di architettura compilato, le esecuzioni durevoli e i budget dei tool prima del codice."
highbay_arch_view_alt: "Vista Architecture di Highbay con grafo di servizi e agenti, Temporal e toolset MCP."
highbay_check_pin_1: "I test di scenario bloccano il merge quando `viewer` riceve `200` invece di `403`."
highbay_check_alt: "Vista Verify di Highbay con Run 1 fallito per 403 atteso ma 200 ricevuto."
highbay_approve_pin_1: "Quando tutti e quattro gli scenari passano, fai merge nel branch o apri una PR."
highbay_approve_alt: "Vista Approve di Highbay con 4 scenari su 4 superati e pulsante Merge."
highbay_contrast_heading: "Senza Highbay vs. con Highbay"
highbay_solo_title: "Agente a mano libera"
highbay_with_title: "Con Highbay"
highbay_solo_row_1_title: "Cablaggio diverso in ogni repo"
highbay_solo_row_1_text: "Ogni sessione sceglie router, middleware di autenticazione e formato errori propri."
highbay_with_row_1_title: "Stessa architettura Go in ogni repo"
highbay_with_row_1_text: "Regole integrate standardizzano autenticazione, tracciamento, errori e struttura dei pacchetti in ogni servizio."
highbay_solo_row_2_title: "Quattro file per modifica"
highbay_solo_row_2_text: "Un nuovo campo richiede modifiche manuali a handler, validatori, OpenAPI e JSON MCP."
highbay_with_row_2_title: "Modifica il contratto una volta"
highbay_with_row_2_text: "`highbay gen` ricompila server, specifiche e schemi con zero token modello."
highbay_solo_row_3_title: "L’agente valuta le proprie ipotesi"
highbay_solo_row_3_text: "Una singola sessione inventa le regole di accesso e scrive test che le promuovono."
highbay_with_row_3_title: "Contratto bloccato e tester separato"
highbay_with_row_3_text: "Highbay rifiuta modifiche del builder al contratto o ai test, e un secondo agente verifica gli handler nel proprio worktree."
highbay_walkthrough_heading: "Dentro ogni repository"
highbay_walkthrough_intro: "Il contratto, il codice server generato e i test di accettazione vivono in pacchetti Go distinti, come nell’[esempio Orders](https://github.com/goadesign/highbay/tree/main/examples/orders)."
highbay_role_guide: "1. Contratto in design/"
highbay_role_guide_caption: "Il tuo agente redige tipi di richiesta, isolamento per cliente e regole di approvazione umana; tu li confermi."
highbay_role_codegen: "2. Go generato in gen/"
highbay_role_codegen_caption: "Compila server HTTP e MCP, specifiche OpenAPI, validazione e paginazione con zero token."
highbay_role_tests: "3. Test di scenario in eval/"
highbay_role_tests_caption: "Un secondo agente scrive test di accettazione in un worktree Git separato che il builder non può modificare."
highbay_cap_heading: "Cosa cabla il playbook Go integrato"
highbay_cap_intro: "Gli agenti seguono un’unica configurazione Go di produzione e aggiungono Redis o Temporal solo quando una funzionalità lo richiede."
highbay_cap_auth_title: "Autenticazione e isolamento dei clienti"
highbay_cap_auth_body: "Valida JWT, OAuth2 e API key sul gateway e associa lato server l’identità del cliente così i prompt non possono impersonare un altro account."
highbay_cap_obs_title: "Tracciamento, metriche e controlli di salute"
highbay_cap_obs_body: "Strumenta le chiamate HTTP, gRPC e ai modelli con tracce OpenTelemetry, log strutturati e sonde di prontezza fin dal primo commit."
highbay_cap_stream_title: "Stream di eventi e limiti di frequenza"
highbay_cap_stream_body: "Condivide limiti di token, stream di eventi e worker pool su Redis quando il servizio scala oltre una singola istanza."
highbay_cap_durable_title: "Approvazioni umane ed esecuzioni durevoli"
highbay_cap_durable_body: "Limita chiamate tool e risposte grandi, mette in pausa le azioni critiche per il via libera umano e riprende i job lunghi dopo un riavvio."
