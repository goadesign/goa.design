home_benefit_tokens_text: "Nel [walkthrough del catalogo](/it/docs/ai-development/#one-design-two-entry-points), 54 righe di `design/catalog.go` compilano oltre 5.000 righe di trasporti Go, OpenAPI, Protobuf e schemi dei tool a zero token LLM."
home_benefit_context: "Un solo contratto da caricare nel contesto"
home_benefit_context_text: "Tipi, vincoli e rotte vivono in `design/*.go`. Il tuo coding agent legge un solo contratto invece di quattro livelli mantenuti a mano."
