highbay_solo_row_1_title: "Cablaggio diverso in ogni repo"
highbay_solo_row_1_text: "Ogni sessione sceglie router, middleware di autenticazione e formato errori propri."
highbay_with_row_1_title: "Struttura di repository condivisa"
highbay_with_row_1_text: "Ogni servizio usa `design/`, `gen/`, `internal/` ed `eval/`."
highbay_solo_row_2_title: "Quattro file per modifica"
highbay_solo_row_2_text: "Un nuovo campo richiede modifiche manuali a handler, validatori, OpenAPI e JSON MCP."
highbay_with_row_2_title: "Modifica il contratto una volta"
highbay_with_row_2_text: "`highbay gen` ricompila server, specifiche e schemi con zero token modello."
highbay_solo_row_3_title: "L’agente valuta le proprie ipotesi"
highbay_solo_row_3_text: "Una singola sessione inventa le regole di accesso e scrive test che le promuovono."
highbay_with_row_3_title: "Regole confermate, tester separato"
highbay_with_row_3_text: "Confermi i casi limite prima; un secondo agente li testa in modo indipendente."
highbay_walkthrough_heading: "Dentro ogni repository"
highbay_walkthrough_intro: "Il Go generato (~70% del [servizio di riferimento Orders](https://github.com/goadesign/highbay/tree/main/examples/orders)) resta separato da handler e test."
highbay_role_guide: "1. Contratto in design/"
highbay_role_guide_caption: "Redatto dal tuo agente, confermato da te."
highbay_role_codegen: "2. Go generato in gen/"
highbay_role_codegen_caption: "Compilato da [Goa](/it/) e [Goa-AI](/it/docs/2-goa-ai/) con zero token."
highbay_role_tests: "3. Test di scenario in eval/"
highbay_role_tests_caption: "Scritti da un secondo agente in un worktree isolato."
highbay_cap_heading: "Standard di produzione inclusi"
highbay_cap_intro: "I servizi stateless escono come un solo binario Go. Aggiungi Redis o Temporal solo quando il contratto lo richiede."
highbay_cap_auth_title: "Autenticazione ([Goa](/it/))"
highbay_cap_auth_body: "Valida JWT, OAuth2 e API key al perimetro prima dell’esecuzione degli handler."
highbay_cap_obs_title: "Telemetria ([Clue](/it/docs/3-ecosystem/clue/))"
highbay_cap_obs_body: "Emette tracce, metriche OpenTelemetry e controlli `/healthz` già pronti."
highbay_cap_stream_title: "Stream e worker ([Pulse](/it/docs/3-ecosystem/pulse/))"
highbay_cap_stream_body: "Redis Streams tipizzati, mappe di rate limit e worker pool ribilanciati."
highbay_cap_durable_title: "Agenti e workflow ([Goa-AI](/it/docs/2-goa-ai/))"
highbay_cap_durable_body: "Budget di chiamate tool, pause per approvazione umana ed esecuzione durevole su Temporal."
highbay_compare_heading: "Come si confronta Highbay"
highbay_compare_solo: "Plan Mode e file di regole"
highbay_compare_solo_text: "Le regole Markdown divergono tra le PR e lo stesso agente continua a valutare il proprio codice."
highbay_compare_speckit: "SDK agenti code-first"
highbay_compare_speckit_text: "Gli schemi vivono nell’app. Highbay compila HTTP, OpenAPI 3 e MCP da un unico contratto."
highbay_compare_workspaces: "Runner paralleli di worktree"
highbay_compare_workspaces_text: "Invece di confrontare a mano branch concorrenti, builder e tester condividono un contratto."
highbay_faq_scope_q: "App Python, TypeScript o web possono chiamare i servizi Highbay?"
highbay_faq_scope_a: "Sì. Highbay compila binari Go standard con endpoint HTTP, OpenAPI 3 e MCP utilizzabili da qualsiasi client."
highbay_faq_holdouts_q: "Cosa impedisce al builder di modificare il contratto o i test?"
highbay_faq_holdouts_a: "Highbay rigenera `design/` dalla revisione confermata e rifiuta i commit che modificano `design/` o `eval/`."
highbay_faq_local_q: "Serve un account cloud o una chiave API per i modelli?"
highbay_faq_local_a: "No. I coding agent usano i propri login CLI esistenti ed `eval/` gira in locale su mock deterministici."
highbay_faq_sandbox_q: "Funziona su repository esistenti e come girano i controlli locali?"
highbay_faq_sandbox_a: "Crea nuovi servizi o estende repository Goa, esegue i controlli in Docker e unisce nel tuo branch o PR. Vedi [Architettura e configurazione](../docs/3-ecosystem/highbay/#architecture)."
highbay_serverdex_alt: "Highbay su Serverdex"
