# Shared Goa ecosystem presentation
home_heading: "Lascia ragionare gli agenti."
home_heading_second: "Lascia generare Goa."
home_intro: "Goa è un framework Go che offre ai coding agent meno codice da scrivere e un unico contratto su cui ragionare. Compila un unico design Go in server HTTP, gRPC e JSON-RPC, client tipizzati, validazione e specifiche OpenAPI 3, oppure usa Goa-AI per creare agenti IA di prodotto, server MCP e tool registry."
home_hero_point_1: "**Servizi (`Goa`):** Compila un solo `design/*.go` in server `net/http`, gRPC e JSON-RPC, client tipizzati, validazione e OpenAPI 3.2."
home_hero_point_2: "**Agenti e MCP (`Goa-AI`):** Collega i metodi come tool tipizzati (`BindTo`), esponi server MCP ed esegui in memoria o su Temporal."
home_hero_point_3: "**Pensato per i coding agent:** Rigenera `gen/` a zero token LLM; il compilatore Go segnala subito handler e chiamanti non allineati."
