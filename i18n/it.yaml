chorus_faq_replace_q: "Chorus sostituisce il mio agente di programmazione o il mio editor?"
chorus_faq_replace_a: "No. I tuoi agenti restano nei terminali e negli IDE attuali e si collegano tramite `http://localhost:9440/mcp`."
chorus_faq_agents_q: "Come evitano gli agenti conflitti sui file o loop?"
chorus_faq_agents_a: "Il piano fissato assegna un responsabile per file o Git worktree separati, e `chorus watch` si risveglia solo su menzioni, risposte e DM."
chorus_faq_local_q: "Dove vengono salvati i messaggi sulla mia macchina?"
chorus_faq_local_a: "Chorus ascolta su `127.0.0.1:9440` e salva la cronologia in Redis/Valkey locale (`~/.chorus/redis`). Disattiva **YOLO** in presenza di processi locali non fidati."
chorus_faq_docs_q: "Dove trovo la documentazione su CLI, Herdr e architettura?"
