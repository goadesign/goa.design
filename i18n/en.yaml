home_registry_heading: "Host a registry for your tools."
home_registry_text: "Run Goa-AI's clustered registry server as a shared catalog and invocation gateway. Services publish toolsets, agents search and load schemas on demand instead of bloating every prompt, and calls route to healthy providers over Redis and [Pulse](/docs/3-ecosystem/pulse/) (Goa's Redis streaming and replicated-map library)."
