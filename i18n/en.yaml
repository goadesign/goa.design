highbay_solo_row_4_title: "Guesses locked into green tests"
highbay_solo_row_4_text: "When `/runs/{id}/approval` role rules go unasked, one session assumes *any signed-in user* and writes green tests for its guess."
highbay_with_title: "With Highbay"
highbay_with_suite: "Shared playbook · compiled contract · separate check"
highbay_with_row_1_title: "Standardized service layout"
highbay_with_row_1_text: "Every service starts with the same structure and built-in conventions for auth, tracing, streams, and worker pools."
