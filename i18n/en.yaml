highbay_compare_heading: "How Highbay compares"
highbay_compare_intro: "Highbay is built around one rule: whoever writes the code does not decide whether it works."
highbay_compare_solo: "One coding agent"
highbay_compare_solo_text: "One session can plan, code and test, and often that is enough. The catch is what you left unsaid: it settles those questions itself, then tests its own answers. Highbay puts them to you first, has a second agent write the scenario tests from your answers, and runs those tests itself."
highbay_compare_speckit: "Spec workflows (Spec Kit, OpenSpec)"
highbay_compare_speckit_text: "They get the agreement written down before the code, which is the right instinct, producing structured specs and tasks for an agent to follow. Highbay turns the agreed flows and API design into Go contracts and required scenarios: the design compiles, Goa generates the interfaces and tool schemas from it, and every finished flow needs a scenario test before a build counts."
highbay_compare_workspaces: "Parallel agent workspaces (Conductor and others)"
highbay_compare_workspaces_text: "They run several agents at once in isolated workspaces and give you their branches to review. Highbay runs two agents on one agreed change with different jobs, and hands you one result: the scenarios that ran on the exact commits you would merge."
highbay_compare_summary: "A choice you confirmed. Transports and schemas generated from Go. Tests written by a different agent. One result, run by Highbay, tied to the agreement and both commits."
highbay_faq_scope_q: "What can I build with it?"
highbay_faq_scope_a: "Go services and AI agents designed with Goa and Goa-AI: HTTP and JSON-RPC APIs, MCP servers, and agents with typed tools. Other languages are out of scope, and designs with gRPC transports are refused today."
highbay_faq_tdd_q: "Why not have one agent write the tests first?"
highbay_faq_tdd_a: "Tests first changes the order, not the author. The same agent still answers the questions you left open, and nothing stops it editing a test that gets in its way. In Highbay the questions go to you, a second agent writes the scenarios in its own working copy, and Highbay runs the suite from the test commit it accepted against the builder's commit."
highbay_faq_existing_q: "Can I use it on a project I already have?"
highbay_faq_existing_a: "Yes, if it is a Goa or Goa-AI project with at least one Git commit. Highbay needs tests it can run: a test module in its layout, or your own test program registered with `hbay verification set` (which Highbay runs on every change without starting a test writer)."
highbay_faq_holdouts_q: "Can the builder read the tests and code to them?"
highbay_faq_holdouts_a: "It can read the tests the test writer wrote; everything runs on your machine. For verification, Highbay selects the test suite from the test commit it accepted, and the builder supplies only its code commit. With a separately managed evaluator, holdouts appear in the builder's report only as an outcome under an anonymous name."
highbay_faq_local_q: "Does it need an account or an API key?"
highbay_faq_local_a: "Highbay needs neither: no account, no key, no cloud service. Your coding agents keep using the logins and subscriptions they already have, and you only add a model provider key when your own service or its tests call a live model."
highbay_faq_sandbox_q: "Are the agents sandboxed?"
highbay_faq_sandbox_a: "No. From Build on, the agents, the tests and the service they build run on your machine as ordinary programs with your access to files and the network. Roles limit what each agent can do in Highbay: only you can confirm, approve, or merge, and the builder's compile-and-unit-test check runs in a local Docker container. Read the [Highbay guide](../docs/3-ecosystem/highbay/) or browse the source on [GitHub](https://github.com/goadesign/highbay)."
