home_benefits_heading: "Why contract generation beats freehand plumbing"
home_benefit_tokens: "54 lines of DSL → 57 generated files"
home_benefit_tokens_text: "In the [catalog reference example](/docs/ai-development/#one-design-two-entry-points), a 54-line `design/catalog.go` compiles over 5,000 lines of Go transports, OpenAPI, Protobuf, and tool JSON schemas into `gen/` (committed to Git, zero LLM output tokens)."
home_benefit_context: "One contract to load into context"
home_benefit_context_text: "Payload types, regex/range rules, descriptions, and transport routes live in `design/*.go`. Your coding agent reads the contract and `gen/` interface instead of scanning four hand-maintained layers."
home_benefit_feedback: "Compiler errors catch drift immediately"
home_benefit_feedback_text: "Change a field or method in `design/` and rerun `goa gen`. Go flags every handler, client, and tool executor whose signature no longer matches."

home_frameworks_heading: "Goa for services. Goa-AI for agents and MCP."
home_service_title: "One contract. Every transport."
home_service_text: "Declare payloads, validations, and errors once in Go. Generate standard `net/http`, gRPC, and JSON-RPC servers, typed clients, and OpenAPI 3 / Protobuf specs — routing, decoding, and validation are generated Go code, not a reflection-driven framework."
