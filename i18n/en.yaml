highbay_faq_scope_q: "Can Python, TypeScript, or web apps call Highbay services?"
highbay_faq_scope_a: "Yes. Highbay compiles plain Go binaries with standard HTTP, OpenAPI 3, and MCP endpoints any client can call."
highbay_faq_holdouts_q: "What stops the builder agent from editing the contract or tests?"
highbay_faq_holdouts_a: "Highbay restores your confirmed contract before verification and rejects any builder commit that modifies the contract or test suite."
highbay_faq_local_q: "Does Highbay need a cloud account or model API key?"
highbay_faq_local_a: "No. Coding agents use their existing CLI sign-ins, and scenario tests run locally against deterministic mocks by default."
highbay_faq_sandbox_q: "Does it work on existing repos, and how do checks run locally?"
highbay_faq_sandbox_a: "Highbay creates new services or extends existing Goa repos, runs builder checks in Docker, and merges into your branch or PR. See [Architecture & setup](../docs/3-ecosystem/highbay/#architecture)."
