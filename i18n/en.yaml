highbay_contrast_heading: "What happens on the same prompt without Highbay"
highbay_contrast_intro: "Ask an agent to build that multi-tenant incident service. Without shared contracts, four problems show up as the codebase grows."
highbay_solo_title: "Freehand coding agent"
highbay_solo_chip_gate: "Hand-wired per session"
highbay_solo_row_1_title: "Every repo wired differently"
highbay_solo_row_1_text: "Each session picks its own router, middleware, and logging setup, so agents spend tokens reading custom plumbing on every change."
highbay_solo_row_2_title: "Four files to edit per field"
highbay_solo_row_2_text: "Adding one field means updating the handler, validator, OpenAPI spec, and MCP tool schema by hand."
highbay_solo_row_3_title: "Passes on 20 lines, breaks in prod"
highbay_solo_row_3_text: "Unbounded log slices and in-memory waits pass small unit tests, then overflow model context on large crash logs or vanish on restart."
highbay_solo_row_4_title: "Silent guesses in green tests"
highbay_solo_row_4_text: "If nobody asks who can call `/runs/{id}/approval`, a single agent assumes any signed-in user and writes passing tests for its own guess."
highbay_with_title: "With Highbay"
highbay_with_suite: "Compiled contract & independent tests"
highbay_with_row_1_title: "One service layout"
highbay_with_row_1_text: "Every service uses `design/`, `gen/`, `internal/`, and `eval/` with shared rules for auth, tracing, streams, and workers."
highbay_with_row_2_title: "Change the contract once"
highbay_with_row_2_text: "`highbay gen` regenerates the HTTP server, MCP schemas, and OpenAPI 3 spec with zero model tokens, and the Go compiler flags stale handlers."
highbay_with_row_3_title: "Bounds and approvals in the contract"
highbay_with_row_3_text: "`Inject(\"org_id\")` binds server-side run labels for tenant checks, `BoundedResult` paginates logs, and `Confirmation` pauses `rollback_production` (durably on Temporal)."
highbay_with_row_4_title: "Change Card and separate test agent"
highbay_with_row_4_text: "You settle staging vs. production rules on a one-page Change Card, and a second agent in its own Git copy checks that `viewer` gets `403`."
