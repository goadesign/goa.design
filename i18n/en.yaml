highbay_cap_heading: "Built-in patterns for production infrastructure"
highbay_cap_intro: "Stateless HTTP and MCP services run as a single binary; when declared, `highbay://golden-path` gives agents one way to wire:"
highbay_cap_auth_title: "Auth & principal injection ([Goa](/) · stateless)"
highbay_cap_auth_body: "JWT, OAuth2, and API-key edge validation with verified principals in typed `context.Context`."
highbay_cap_obs_title: "Observability & logs ([Clue](/docs/3-ecosystem/clue/) · OpenTelemetry)"
highbay_cap_obs_body: "OpenTelemetry traces and metrics, buffered logs emitted on errors, and `/healthz` probes."
highbay_cap_stream_title: "Streams, queues & workers ([Pulse](/docs/3-ecosystem/pulse/) · Redis)"
highbay_cap_stream_body: "Typed Redis Streams, consistent-hash worker pools with failover, and distributed rate-limit maps."
highbay_cap_durable_title: "Agents & durable workflows ([Goa-AI](/docs/2-goa-ai/) · Temporal)"
highbay_cap_durable_body: "Anthropic, OpenAI, Bedrock, Vertex, and gateway model adapters, `RunPolicy` caps, crash-safe `Confirmation` pauses, and runtime prompt-budget checks ([`TestSeededPayloadBloatFailsTheBudget`](https://github.com/goadesign/highbay/blob/main/examples/orders-eval/acceptance/acceptance_test.go#L36-L60))."
highbay_proof_heading: "Guardrails & repository references"
highbay_proof_codegen_title: "~70% generated in the reference service ([inspect `examples/orders/gen/`](https://github.com/goadesign/highbay/tree/main/examples/orders/gen))"
highbay_proof_codegen_body: "In Highbay's Orders reference service, `gen/` accounts for ~70% of non-test Go code — compiled with zero LLM output tokens."
highbay_proof_playbook_title: "12-section playbook ([`GOLDEN_PATH.md`](https://github.com/goadesign/highbay/blob/main/internal/goldenpath/GOLDEN_PATH.md))"
highbay_proof_playbook_body: "Served over MCP (`highbay://golden-path`) so Claude, Codex, and Gemini follow one standard across repositories."
highbay_proof_suite_title: "Crash & role-gate verification ([`orders-eval`](https://github.com/goadesign/highbay/tree/main/examples/orders-eval/acceptance))"
highbay_proof_suite_body: "Reference acceptance suites `SIGKILL` workers mid-run, restart APIs during pending approvals, and reject non-authorized callers (`403`)."
highbay_compare_heading: "How Highbay compares"
highbay_compare_intro: "Where coding-agent workflows and agent frameworks differ."
highbay_compare_solo: "Solo Plan Mode & .cursorrules"
highbay_compare_solo_text: "Plan mode and markdown rules clarify intent upfront, but prose conventions drift across PRs and one session still grades its own code."
highbay_compare_speckit: "Python/TS agent SDKs (LangGraph, Agents SDK)"
highbay_compare_speckit_text: "Code-first SDKs wire chains in application code; Highbay compiles HTTP, OpenAPI 3, and MCP contracts first and pairs a separate verifier."
highbay_compare_workspaces: "Parallel worktree runners"
highbay_compare_workspaces_text: "Worktree runners fan one prompt across competing branches you diff by hand; Highbay pairs one builder and one test writer on one contract."
highbay_faq_scope_q: "How does Highbay fit existing repos, gRPC, and PR/CI workflows?"
highbay_faq_scope_a: "Highbay scaffolds new services (callable over HTTP, OpenAPI 3, or MCP from Python, TypeScript, Go, or web apps) or extends existing Goa repositories; it does not retrofit other routers in place. Bundled `highbay gen` refuses `GRPC` (`protoc` is not bundled; standalone `goa gen` supports gRPC), and approved commits can be merged directly or onto a PR branch for CI."
highbay_faq_holdouts_q: "What keeps the builder from editing the contract or tests?"
highbay_faq_holdouts_a: "Highbay overwrites `design/` from your confirmed revision during codegen and rejects commits that alter `design/` or handwritten tests in `eval/`. External evaluators (`highbay verification set`) can also run redacted holdout scenarios."
highbay_faq_local_q: "Does Highbay require a cloud account or model API key?"
highbay_faq_local_a: "Neither — coding agents use their existing CLI sign-ins, and `eval/` scenarios use scripted model doubles (`0` external API keys unless testing live model calls)."
highbay_faq_sandbox_q: "How are local processes and permissions bounded?"
highbay_faq_sandbox_a: "Role-scoped MCP tokens keep confirmation, approval, and merge user-only, and builder checks run in a local Linux Docker container. Agents and candidate binaries run as ordinary processes under your user account (not a VM sandbox); see the [Ecosystem Guide](../docs/3-ecosystem/highbay/#architecture)."
highbay_bottom_heading: "Build your first service"
highbay_bottom_intro: "Run setup once, open a new service folder in your coding agent, and invoke `/highbay`."
