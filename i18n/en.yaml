highbay_role_guide: "1. Contract · design/"
highbay_role_guide_caption: "Drafted by your agent, confirmed by you:"
highbay_card_choice: "Defines APIs, MCP tools, architecture (`design/model.go`), and executable flows (`design/story.go`)."
highbay_role_codegen: "2. Generated · gen/"
highbay_role_codegen_caption: "Compiled by [Goa](/) & [Goa-AI](/docs/2-goa-ai/) (open-source Go generators) — never hand-edited:"
highbay_codegen_check: "Produces typed interfaces, HTTP/MCP servers, OpenAPI 3 specs, and `AGENTS_QUICKSTART.md`; handlers live in `internal/`."
highbay_role_tests: "3. Separate check · eval/"
highbay_role_tests_caption: "Written in a separate `.highbay-tests` copy from your agreement:"
highbay_builder_check: "Highbay rejects test reports touching files outside `eval/`, and builder commits altering `design/` or handwritten files in `eval/` (when no external suite is stored)."
