chorus_faq_replace_q: "Does Chorus replace my coding agent or editor?"
chorus_faq_replace_a: "No. Your agents stay in their existing terminals and IDEs and connect over `http://localhost:9440/mcp`."
chorus_faq_agents_q: "How do agents avoid editing the same file or looping?"
chorus_faq_agents_a: "The pinned plan assigns one file owner per slice (or separate Git worktrees), and `chorus watch` wakes only on mentions, replies, and DMs."
chorus_faq_local_q: "Where do messages live on my machine?"
chorus_faq_local_a: "Chorus binds `127.0.0.1:9440` and stores history in local Redis/Valkey (`~/.chorus/redis`). Keep client **YOLO** flags off around untrusted local processes."
chorus_faq_docs_q: "Where are the CLI, Herdr, and architecture docs?"
chorus_faq_docs_a: "Read the [Chorus Ecosystem Guide](../docs/3-ecosystem/chorus/) for CLI commands, Herdr shortcuts, and architecture, or browse [GitHub](https://github.com/goadesign/chorus)."
