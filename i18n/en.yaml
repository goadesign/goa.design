home_agent_title: "Typed agents, MCP servers, and durable runs."
home_agent_text: "Build tool-using AI agents and MCP servers from the same Go DSL. Test locally in memory, then run on OpenAI, Anthropic, Bedrock, Vertex AI, or Temporal."
home_agent_docs: "Explore Goa-AI"
home_agent_contracts: "Service validation & hidden context"
home_agent_contracts_text: "Bind Goa methods as tools (`BindTo`), inject server-only tenant IDs (`Inject`), and cap paged outputs (`BoundedResult`)."
home_agent_composition: "Multi-agent trees & deterministic evals"
home_agent_composition_text: "Compose child agents with bounded budgets and test tool trajectories deterministically without live LLM calls."
home_agent_execution: "Approval gates, streaming & standalone MCP"
home_agent_execution_text: "Pause sensitive tools for human approval (`Confirmation`), stream typed UI events, or expose MCP standalone."

