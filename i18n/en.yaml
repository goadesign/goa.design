home_faq_heading: "Questions before you start"

home_faq_codegen_q: "Why use Goa if a coding agent can write the code?"

home_faq_codegen_a: "A coding agent authors code by inference; Goa derives contract code from your design. Each generated server, client, codec, and schema is code the model does not need to write separately. The design concentrates context, the generated structure stays consistent, and the compiler identifies incompatible implementations after changes. Your agent still writes business logic and tests."

home_faq_difference_q: "What is the difference between Goa and Goa-AI?"

home_faq_difference_a: "Goa designs and generates Go service APIs: HTTP, gRPC, JSON-RPC, clients, validation, and specifications. Goa-AI extends the same DSL and generator with typed tools, AI agents, structured completions, evaluations, and MCP servers. It also provides an agent runtime and a hosted tool registry server. You can start with either framework; Goa-AI does not require a separately deployed Goa service."

home_faq_tokens_q: "How does generation reduce LLM work?"

home_faq_tokens_a: "Goa generates the transport and contract code without an LLM composing those files. That removes a category of output-token work. Total savings depend on the task, model, context, and iterations; compare complete changes, including tests and review, to measure the effect in your project."

home_faq_mcp_q: "Can I use Goa-AI just to build an MCP server?"

home_faq_mcp_a: "Yes. Add MCP declarations to a Goa service to generate a server exposing tools, resources, and prompt templates. Implement the service methods behind the generated adapters. You do not need to run a Goa-AI agent to serve MCP."

