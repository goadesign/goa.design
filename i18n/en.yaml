home_hero_point_2: "**Agents & MCP (`Goa-AI`):** Bind service methods as typed tools (`BindTo`), expose MCP servers, and run locally in memory or durably on Temporal."
home_hero_point_3: "**Built for coding agents:** Regenerate `gen/` in zero LLM output tokens; Go compiler errors flag stale handlers and callers immediately."
