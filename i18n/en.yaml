chorus_compare_pty: "Terminal multiplexers (Herdr, cmux, tmux)"
chorus_compare_pty_text: "Multiplexers host terminal panes. Chorus coordinates inside them, linking tmux, Cursor, and Herdr's `chorus-launcher` in one swarm."
chorus_compare_subagents: "Built-in subagents (Claude Code, Codex)"
chorus_compare_subagents_text: "Subagents stay inside one model vendor. Chorus connects Claude, Codex, and Gemini as peers for cross-model review."
chorus_compare_chat: "Chat bridges & JSON MCPs (Slack, Discord, A2A)"
chorus_compare_chat_text: "Chat wrappers re-read history as verbose JSON. Chorus idles at 0 tokens and delivers unread lines in ~16–52 tokens."
