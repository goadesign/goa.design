home_compare_heading: "How Goa & Goa-AI compare"
home_compare_specs: "Protobuf & OpenAPI toolchains (buf/Connect, oapi-codegen)"
home_compare_specs_text: "`buf` + ConnectRPC generates HTTP/gRPC from `.proto` while `oapi-codegen` targets OpenAPI YAML. Goa expresses rich HTTP routing, gRPC, JSON-RPC, OpenAPI 3.2, and MCP/agent toolsets in one Go package — generating `net/http` and `grpc` routing and validation directly in Go."
home_compare_mcp_sdk: "Hand-wired Go MCP SDKs (go-sdk, mcp-go)"
home_compare_mcp_sdk_text: "Struct-tag MCP handlers duplicate parameter rules already written for your HTTP/gRPC API. Adding `MCP(...)` and `Tool(...)` to a Goa service reuses the same validated payload types and service implementation."
home_compare_agent_sdk: "Python/TS agent SDKs (LangGraph, OpenAI Agents SDK)"
home_compare_agent_sdk_text: "Graph SDKs wire orchestration in dynamically typed application code. Goa-AI compiles typed Go tool codecs, server-injected context, cursor pagination, approval gates, and Temporal workflow activities into one static Go binary."

home_faq_heading: "Questions before you start"
home_faq_codegen_q: "Can I adopt Goa incrementally in an existing Go repo, and do I commit gen/?"
home_faq_codegen_a: "Yes to both. `goa gen` generates standard `net/http` handlers and `google.golang.org/grpc` servers (not a reflection-driven router), so you can mount a Goa service alongside existing Go routes, attach standard middleware, and commit `gen/` so every contract diff is auditable in code review."
home_faq_difference_q: "How do non-Go clients call a Goa service, and when do I add Goa-AI?"
home_faq_difference_a: "TypeScript, Python, and mobile clients consume the generated OpenAPI 3.2 and `.proto` specs directly. Start with Goa for HTTP/gRPC/JSON-RPC APIs; add Goa-AI when exposing MCP tools or running product agents (testable locally with zero API keys before connecting live models or Temporal)."
home_faq_tokens_q: "When is Goa not a fit, and how should we evaluate it?"
home_faq_tokens_a: "Skip Goa for throwaway scripts or tiny prototypes where a separate `design/` package adds ceremony. On multi-endpoint services or coding-agent teams, compare one real feature end to end (tokens, review diffs, and defects) starting from the [catalog walkthrough](/docs/ai-development/#one-design-two-entry-points)."
home_faq_mcp_q: "Can I use Goa-AI just to expose an MCP server?"
home_faq_mcp_a: "Yes. Add `MCP(...)` and `Tool(...)` declarations to a Goa service to generate `tools/list` JSON Schemas, validation retry hints, and Streamable HTTP handlers without running an agent loop."

home_community_heading: "Companion libraries and multi-agent tools"
home_community_intro: "Goa and Goa-AI pair with open-source Go libraries for observability, Redis event streams, C4 diagrams, and multi-agent development."
