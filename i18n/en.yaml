highbay_solo_row_1_title: "Cross-repo layout drift"
highbay_solo_row_1_text: "May wire routers, middleware, and logging differently in each service — forcing your agent to re-read custom plumbing every turn."
highbay_solo_row_2_title: "Four-file Day-2 schema sync"
