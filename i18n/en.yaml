home_agent_title: "Typed agents, MCP servers, and durable runs."
home_agent_text: "Extend the same Go DSL to tool-using AI agents and MCP servers. Test locally in memory with zero API keys, then connect OpenAI, Anthropic, AWS Bedrock, or Google Vertex AI and run durably on Temporal."
home_agent_docs: "Explore Goa-AI"
home_agent_contracts: "Service validation & hidden context"
home_agent_contracts_text: "Reuse Goa service methods as tools (`BindTo`), hide server-supplied tenant IDs from the model (`Inject`), and cap paged outputs (`BoundedResult`)."
home_agent_composition: "Multi-agent trees & deterministic evals"
home_agent_composition_text: "Compose child agents as tools with bounded budgets and test tool trajectories deterministically without live LLM calls."
home_agent_execution: "Approval gates, streaming & standalone MCP"
home_agent_execution_text: "Pause sensitive tools for human approval (`Confirmation`), stream typed events to UIs, or expose MCP without an agent loop."

