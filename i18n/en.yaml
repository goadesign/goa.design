highbay_walkthrough_heading: "What lives in each repository"
highbay_walkthrough_intro: "Every service uses `design/`, `gen/`, `internal/`, and `eval/`, so engineers and coding agents know where contracts, generated code, handlers, and scenario checks belong."
highbay_role_guide: "1. Contract in design/"
highbay_role_guide_caption: "Your agent drafts it and you confirm it:"
highbay_card_choice: "Defines APIs, MCP tools, architecture (`design/model.go`), and executable flows (`design/story.go`)."
highbay_role_codegen: "2. Generated Go in gen/"
highbay_role_codegen_caption: "Compiled by [Goa](/) and [Goa-AI](/docs/2-goa-ai/), never edited by hand:"
highbay_codegen_check: "Generates typed interfaces, HTTP and MCP servers, OpenAPI 3 specs, and `AGENTS_QUICKSTART.md`. Handlers live in `internal/`."
highbay_role_tests: "3. Scenario tests in eval/"
highbay_role_tests_caption: "Written by a second agent in `.highbay-tests`:"
highbay_builder_check: "With built-in `.highbay-tests`, Highbay rejects test edits outside `eval/` and builder commits that touch `design/` or handwritten `eval/` files."
highbay_cap_kicker: ""
highbay_cap_heading: "Production conventions built into the playbook"
highbay_cap_intro: "Stateless HTTP and MCP services ship as one Go binary. When a service needs state or background work, `highbay://golden-path` gives coding agents one standard way to wire each layer."
highbay_cap_auth_title: "Auth & principal injection ([Goa](/) · stateless)"
highbay_cap_auth_body: "Validates JWT, OAuth2, and API keys at the transport edge and passes verified principals in `context.Context`."
highbay_cap_obs_title: "Observability & logs ([Clue](/docs/3-ecosystem/clue/) · OpenTelemetry)"
highbay_cap_obs_body: "Wires OpenTelemetry traces and metrics, flushes debug logs on error, and exposes `/healthz` readiness checks."
highbay_cap_stream_title: "Streams, queues & workers ([Pulse](/docs/3-ecosystem/pulse/) · Redis)"
highbay_cap_stream_body: "Provides typed Redis Streams, replicated rate-limit maps, and worker pools that rebalance on node failure."
highbay_cap_durable_title: "Agents & durable workflows ([Goa-AI](/docs/2-goa-ai/) · Temporal)"
highbay_cap_durable_body: "Connects Anthropic, OpenAI, Bedrock, Vertex, and model gateways with `RunPolicy` call caps, durable `Confirmation` pauses, and prompt-budget tests ([`TestSeededPayloadBloatFailsTheBudget`](https://github.com/goadesign/highbay/blob/main/examples/orders-eval/acceptance/acceptance_test.go#L36-L60))."
highbay_proof_heading: "Repository references"
highbay_proof_codegen_title: "~70% generated in the reference service ([inspect `examples/orders/gen/`](https://github.com/goadesign/highbay/tree/main/examples/orders/gen))"
highbay_proof_codegen_body: "In the Orders reference service, `gen/` makes up ~70% of non-test Go code and compiles with zero LLM output tokens."
highbay_proof_playbook_title: "12-section playbook ([`GOLDEN_PATH.md`](https://github.com/goadesign/highbay/blob/main/internal/goldenpath/GOLDEN_PATH.md))"
highbay_proof_playbook_body: "Served over MCP (`highbay://golden-path`) so Claude, Codex, and Gemini follow one standard across repositories."
highbay_proof_suite_title: "Crash & role-gate verification ([`orders-eval`](https://github.com/goadesign/highbay/tree/main/examples/orders-eval/acceptance))"
highbay_proof_suite_body: "Reference scenario tests kill workers mid-run with `SIGKILL`, restart APIs during pending approvals, and check `403` role rejections."
highbay_compare_heading: "How Highbay compares"
highbay_compare_intro: "How Highbay differs from markdown rule files, application-code agent SDKs, and parallel worktree runners."
highbay_compare_solo: "Solo Plan Mode & .cursorrules"
highbay_compare_solo_text: "Plan mode and markdown rules clarify intent upfront, but prose conventions drift across PRs and one session still grades its own code."
highbay_compare_speckit: "Python/TS agent SDKs (LangGraph, Agents SDK)"
highbay_compare_speckit_text: "Code-first SDKs wire tools and schemas inside application code. Highbay compiles HTTP, OpenAPI 3, and MCP contracts first and checks behavior in a separate Git copy."
highbay_compare_workspaces: "Parallel worktree runners"
highbay_compare_workspaces_text: "Worktree runners run the same prompt across competing branches that you diff by hand. Highbay pairs one builder and one test writer against one confirmed contract."
highbay_faq_scope_q: "How does Highbay fit existing repos, gRPC, and PR/CI workflows?"
highbay_faq_scope_a: "Highbay starts new services or extends existing Goa repos. It does not retrofit other Go routers in place. Non-Go apps call generated services over HTTP, OpenAPI 3, or MCP. Bundled `highbay gen` rejects `GRPC` designs because `protoc` is not bundled (standalone `goa gen` supports gRPC), and approved changes merge into your branch or a PR for CI."
highbay_faq_holdouts_q: "What keeps the builder from editing the contract or tests?"
highbay_faq_holdouts_a: "Highbay overwrites `design/` from your confirmed revision during codegen and rejects commits that alter `design/` or handwritten tests in `eval/`. External evaluators (`highbay verification set`) can also run redacted holdout scenarios."
highbay_faq_local_q: "Does Highbay require a cloud account or model API key?"
highbay_faq_local_a: "Neither. Coding agents use their existing CLI sign-ins, and `eval/` scenarios run against scripted model doubles unless you opt in to live model calls."
highbay_faq_sandbox_q: "How are local processes and permissions bounded?"
highbay_faq_sandbox_a: "Role-scoped MCP tokens reserve confirmation, approval, and merge for you, and builder checks run inside a local Linux Docker container. Coding agents and candidate binaries run as ordinary processes under your user account, outside any VM sandbox. See the [Ecosystem Guide](../docs/3-ecosystem/highbay/#architecture)."
