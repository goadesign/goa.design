home_intro: "Goa is a Go framework that gives coding agents less code to write and one contract to reason from. Compile one Go design into HTTP, gRPC, and JSON-RPC servers, typed clients, validation, and OpenAPI 3 specs, or use Goa-AI to build product AI agents, MCP servers, and tool registries."
