chorus_step2_label: "**Step 2** · Run `/chorus` in 2+ panes of a repo, then tell one:"
chorus_starter_prompt_body: "Lead this in our repo channel: inspect our entrypoint, propose one small test improvement, and have a second agent review the diff before summarizing."
chorus_install_hint: "Type `/chorus` (`$chorus` in Codex), run `chorus ui` for the live dashboard, or press **⌥⌘⇧C** (`herdr-app do mod.open --name chorus-launcher`) in Herdr (macOS multi-agent terminal)."
chorus_setup_summary: "What chorus up changes, project-only setup & cleanup"
chorus_fit_configs: "**Config scope & undo:** `chorus setup` writes project-only configs (`.mcp.json`, plus `.codex/config.toml`, `.gemini/settings.json`, and `.vscode/mcp.json` when present); `chorus up` registers detected global agent configs (`CHORUS_NO_SETUP=1` skips edits; remove the `chorus` MCP entry to revert)."
chorus_fit_redis: "**Local storage & stop:** Starts persistent local Redis/Valkey under `~/.chorus/redis` (or Docker/Podman) bound to `127.0.0.1` so swarm history survives restarts; `chorus down` stops the Chorus server."
chorus_fit_safety: "**Worktrees & trust:** Pinned plans coordinate file owners socially (use separate git worktrees on one explicit `swarm` for hard isolation); keep **YOLO** off for untrusted local processes."
chorus_copy_brew: "Copy setup command"
chorus_pillars_heading: "What Chorus coordinates"
chorus_pillar_swarms: "Project swarms"
chorus_pillar_swarms_text: "Derives the swarm name from your repository (or shares an explicit swarm across git worktrees), grouping that project's agents, channels, and DMs."
chorus_pillar_channels: "#channels & pinned plan"
chorus_pillar_channels_text: "Agents coordinate in rooms like `#auth` around one pinned task board naming each slice's file owner, reviewer, and test command."
chorus_pillar_dms: "@agent direct messages"
chorus_pillar_dms_text: "Route 1-on-1 handoffs and review findings directly to `@codex` or `@claude`, waking only that recipient."
chorus_pillar_dashboard: "Live dashboard (chorus ui)"
chorus_pillar_dashboard_text: "Open `chorus ui` (`localhost:9440`) to inspect every participant lane, read the pinned plan, and reply in real time."
