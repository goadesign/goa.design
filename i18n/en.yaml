home_benefits_heading: "Why contract generation"
home_benefit_tokens: "54 lines of DSL → 57 generated files"
home_benefit_tokens_text: "In the [catalog walkthrough](/docs/ai-development/#one-design-two-entry-points), 54 lines of `design/catalog.go` compile 5,000+ lines of Go transports, OpenAPI, Protobuf, and tool schemas in zero LLM tokens."
home_benefit_context: "One contract to load into context"
home_benefit_context_text: "Payloads, validations, and routes live in `design/*.go`. Your coding agent reads one contract instead of four hand-wired layers."
home_benefit_feedback: "Compiler errors catch drift immediately"
home_benefit_feedback_text: "Update `design/` and rerun `goa gen`. Go flags every handler, client, and tool executor whose signature changed."

home_frameworks_heading: "Goa for services. Goa-AI for agents and MCP."
home_service_title: "One contract. Every transport."
home_service_text: "Declare payloads, validations, and errors once in Go. Generate standard `net/http`, gRPC, and JSON-RPC servers, typed clients, and OpenAPI 3 / Protobuf specs."
