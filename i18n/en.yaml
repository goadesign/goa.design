highbay_cap_heading: "Production defaults included"
highbay_cap_intro: "Stateless services ship as one Go binary. Add Redis or Temporal only when a contract needs them."
highbay_cap_auth_title: "Auth ([Goa](/))"
highbay_cap_auth_body: "Validates JWT, OAuth2, and API keys at the edge before handlers run."
highbay_cap_obs_title: "Telemetry ([Clue](/docs/3-ecosystem/clue/))"
highbay_cap_obs_body: "Emits OpenTelemetry traces, metrics, and `/healthz` checks out of the box."
highbay_cap_stream_title: "Streams & workers ([Pulse](/docs/3-ecosystem/pulse/))"
highbay_cap_stream_body: "Typed Redis streams, rate-limit maps, and rebalancing worker pools."
highbay_cap_durable_title: "Agents & workflows ([Goa-AI](/docs/2-goa-ai/))"
highbay_cap_durable_body: "Tool-call budgets, human approval pauses, and durable Temporal runs."
highbay_compare_heading: "How Highbay compares"
highbay_compare_solo: "Plan Mode & rules files"
highbay_compare_solo_text: "Markdown rules drift across PRs, and the same agent still grades its own code."
highbay_compare_speckit: "Code-first agent SDKs"
highbay_compare_speckit_text: "Schemas live inside app code. Highbay compiles HTTP, OpenAPI 3, and MCP from one contract."
highbay_compare_workspaces: "Parallel worktree runners"
highbay_compare_workspaces_text: "Instead of diffing competing solo branches by hand, one builder and one tester share a contract."
highbay_faq_scope_q: "Can Python, TypeScript, or web apps call Highbay services?"
highbay_faq_scope_a: "Yes. Highbay compiles plain Go binaries with standard HTTP, OpenAPI 3, and MCP endpoints any client can call."
highbay_faq_holdouts_q: "What stops the builder agent from editing the contract or tests?"
highbay_faq_holdouts_a: "Highbay regenerates `design/` from your confirmed revision and rejects builder commits that modify `design/` or `eval/`."
highbay_faq_local_q: "Does Highbay need a cloud account or model API key?"
highbay_faq_local_a: "No. Coding agents use their existing CLI sign-ins, and `eval/` tests run locally against deterministic mocks by default."
highbay_faq_sandbox_q: "Does it work on existing repos, and how do checks run locally?"
highbay_faq_sandbox_a: "Highbay creates new services or extends existing Goa repos, runs builder checks in Docker, and merges into your branch or PR. See [Architecture & setup](../docs/3-ecosystem/highbay/#architecture)."
