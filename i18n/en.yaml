home_compare_heading: "How Goa & Goa-AI compare"
home_compare_specs: "Protobuf & OpenAPI toolchains (buf/Connect, oapi-codegen)"
home_compare_specs_text: "`buf` targets `.proto` while `oapi-codegen` targets YAML. Goa compiles HTTP, gRPC, JSON-RPC, OpenAPI 3.2, and MCP toolsets from one Go package."
home_compare_mcp_sdk: "Hand-wired Go MCP SDKs (go-sdk, mcp-go)"
home_compare_mcp_sdk_text: "Struct-tag handlers duplicate rules already in your API. Adding `MCP(...)` to a Goa service reuses the same validated types and handlers."
home_compare_agent_sdk: "Python/TS agent SDKs (LangGraph, OpenAI Agents SDK)"
home_compare_agent_sdk_text: "Goa-AI compiles typed Go tool codecs, server-injected context, approval gates, and Temporal activities into one static Go binary."

home_faq_heading: "Questions before you start"
home_faq_codegen_q: "Can I adopt Goa incrementally, and do I commit gen/?"
home_faq_codegen_a: "Yes to both. `goa gen` emits standard `net/http` and `google.golang.org/grpc` code you can mount alongside existing routes and commit in `gen/`."
home_faq_difference_q: "How do non-Go clients call Goa, and when do I add Goa-AI?"
home_faq_difference_a: "TypeScript, Python, and mobile apps use the generated OpenAPI 3.2 and `.proto` specs. Add Goa-AI when exposing MCP tools or running product agents."
home_faq_tokens_q: "When is Goa not a fit, and how should we evaluate it?"
home_faq_tokens_a: "Skip Goa for throwaway scripts. For multi-endpoint services, compare one real feature end to end starting from the [catalog walkthrough](/docs/ai-development/#one-design-two-entry-points)."
home_faq_mcp_q: "Can I use Goa-AI just to expose an MCP server?"
home_faq_mcp_a: "Yes. Add `MCP(...)` and `Tool(...)` to a Goa service to generate JSON Schemas and Streamable HTTP handlers without an agent loop."

