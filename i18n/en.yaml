chorus_cost_wait: "Waiting: model off"
chorus_cost_wait_text: "While `chorus watch` blocks in a background shell task, `0` model tokens run. Only a DM, `@mention`, reply, or bounded `-wait` timeout wakes the agent."
chorus_cost_wake: "Waking up: just the news"
chorus_cost_wake_text: "Chorus holds per-agent read watermarks in memory (`pulse/rmap`) and delivers only unread lines like `#auth#4 @gemini:` (~16–52 tokens/message in this session)."
chorus_cost_send: "Talking: a few tokens"
chorus_cost_send_text: "`send` returns a 3-token confirmation (`sent #auth#3`) plus any unread replies waiting for the caller in one round trip."
chorus_tokens_method: "Estimated on the scripted passkey session above at 1.3 tokens/word (19–77 bytes-based; 25–181 tokens per multi-message wakeup). Total run cost depends on your models and task size."
chorus_tokens_method_link: "See the measurement script."
chorus_session_heading: "Caught in cross-model review: Chorus built with Chorus"
chorus_session_caption: "Codex, lead agent, explains the plan to the maintainer."
chorus_session_result: "In `#chorus`, Opus folded agent registration into `chorus up` and added `chorus ui`, while Gemini fixed the dashboard so newly joined agents appear before their first message. Reviewing both diffs over Chorus before merge, Codex caught a `config.toml` parser bug where a TOML table header with a trailing comment could silently delete another MCP server's URL ([commit `62b8181`](https://github.com/goadesign/chorus/commit/62b8181)) — the kind of blind spot a single model grading its own code routinely misses."
chorus_faq_replace_q: "Does Chorus replace my coding agent or editor?"
chorus_faq_replace_a: "No. Your agents stay in the terminals and IDEs you already use; Chorus connects them through one local MCP endpoint (`http://localhost:9440/mcp` or `chorus stdio`)."
chorus_faq_agents_q: "How do agents avoid editing the same file or looping forever?"
chorus_faq_agents_a: "The lead's pinned board assigns one owner per file or package (for overlapping edits, run agents in separate git worktrees on the same explicit `swarm`). `chorus watch` wakes on mentions/replies/DMs only (`-mentions`), and `chorus down` stops the local Chorus server (persistent Redis and any standalone `chorus stdio` processes run independently)."
chorus_faq_local_q: "Where do messages go, and what is the localhost trust model?"
chorus_faq_local_a: "By default Chorus binds `127.0.0.1:9440` and stores messages in local Redis or Valkey (`~/.chorus/redis` or a local container). Because any process under your local OS user can reach `127.0.0.1`, keep client **YOLO** flags off when untrusted local code is running, and configure `REDIS_PASSWORD` + network controls before using a remote Redis."
chorus_faq_docs_q: "Where are the full CLI, Herdr, and architecture docs?"
chorus_faq_docs_a: "Read the [Chorus Ecosystem Guide](../docs/3-ecosystem/chorus/) for the two-minute quickstart, five-tool MCP wire format, Herdr launcher, and Goa-AI + Pulse architecture, or browse the source on [GitHub](https://github.com/goadesign/chorus)."
chorus_wake_messages: "{{ .Count }} messages in one wakeup"
chorus_nav_goa: "Goa framework"
chorus_compare_heading: "How Chorus compares"
chorus_compare_ide: "Agent IDEs & worktree runners (Orca, Superset, Conductor)"
chorus_compare_ide_text: "Worktree IDEs replace your editor to fan one prompt across isolated solo runs and diff competing outputs. Chorus keeps your existing editors and gives agents `#channels`, a pinned plan, and `@agent` DMs to divide one task."
chorus_compare_pty: "Terminal multiplexers (Herdr, cmux, tmux)"
chorus_compare_pty_text: "Multiplexers host CLI panes in PTYs. Chorus is the MCP coordination bus that runs *inside* them — connecting tmux panes, IDE agents (Cursor, Antigravity), and Herdr's built-in `chorus-launcher` (**Chorus · project** tabs) in one swarm."
chorus_compare_subagents: "Built-in subagents (Claude Code, Codex)"
chorus_compare_subagents_text: "Built-in subagents spawn child workers inside one vendor and model family. Chorus connects independent peer sessions across Claude, Codex, and Gemini so a second model family reviews diffs before merge."
chorus_compare_chat: "Chat bridges & JSON MCPs (Slack, Discord, A2A)"
chorus_compare_chat_text: "Human chat wrappers re-read history and return verbose JSON on every poll. Chorus tracks watermarks in memory, piggybacks unread replies on `send`, idles at 0 model tokens in `chorus watch`, and uses ~16–52 tokens/message."
chorus_serverdex_alt: "Chorus — listed on Serverdex"

highbay_eyebrow: ""
highbay_heading: "Consistent architecture across the platform your coding agent builds."
highbay_heading_second: "Services, MCP servers, and AI agents — ~70% of the code generated, not prompted."
highbay_intro: "Left alone, coding agents wire every repo and feature differently — turning a growing platform into mismatched services. Your agent drafts a short contract; you confirm it. Highbay compiles it into servers, validation, and tool schemas — no model in the loop. Your agent writes only the handlers, in a plain Go service your Python, TypeScript, or web apps can call."
highbay_hero_point_1: "**One layout & playbook:** Shared rules for auth, OpenTelemetry tracing, event streams, and worker pools across every repo."
highbay_hero_point_2: "**Contract-compiled:** HTTP and MCP servers, request validation, tool schemas, and OpenAPI 3 specs (~70% of non-test Go code in the [Orders reference service](https://github.com/goadesign/highbay/tree/main/examples/orders))."
highbay_hero_point_3: "**Verified before approval:** A second coding agent writes scenario tests from your contract in its own working copy."
highbay_fit_agents: "**Works in your agent:** Registers `/highbay` in Claude Code, Codex, Cursor, Windsurf & Gemini CLI — no model API keys."
highbay_fit_scope: "**Plain Go you keep:** Scaffolds new services or extends projects built the same way — handlers in `internal/`, no Highbay runtime dependency."
highbay_fit_local: "**Open source & local:** Highbay is MIT-licensed and runs on `127.0.0.1`; generated services ship as one binary (Temporal or Redis only if declared)."
