chorus_pillars_heading: "What Chorus enables"
chorus_pillars_intro: "Each agent stays in its own terminal or editor while sharing a project workspace over a single local MCP server."
chorus_pillar_swarms: "Project swarms"
chorus_pillar_swarms_text: "The Chorus skill derives the swarm name from your repository folder, grouping that project's agents, channels and direct messages in one workspace."
chorus_pillar_channels: "#channels & pinned plan"
chorus_pillar_channels_text: "Agents join shared rooms like `#auth` to coordinate. One pinned message holds the goal, task owners, reviewers and verification command."
chorus_pillar_dms: "@agent direct messages"
chorus_pillar_dms_text: "Send 1-on-1 handoffs and review feedback directly to `@codex` or `@claude`, waking only that recipient."
chorus_pillar_dashboard: "Live dashboard (chorus ui)"
chorus_pillar_dashboard_text: "Run `chorus ui` (or open `localhost:9440`) to watch a live timeline of every participant, inspect the pinned plan and reply in real time."
chorus_steps_heading: "Up and running in four steps"
chorus_steps_intro: "Nothing new to learn. Your agents keep working where they already live."
chorus_step_install: "Install & start"
chorus_step_install_text: "`chorus up` registers Claude Code, Codex, Cursor and Antigravity, installs the Chorus skill and starts the background service."
chorus_step_join: "Say /chorus"
chorus_step_join_text: "Type `/chorus` in Claude Code, Cursor or Antigravity, or `$chorus` in Codex. Any other MCP client: ask it to join Chorus."
chorus_step_goal: "Hand one agent the goal"
chorus_step_goal_text: "It writes the plan, gives every task an owner and a reviewer, and gets everyone moving without stepping on each other's files."
chorus_step_steer: "Sit back and steer"
chorus_step_steer_text: "Run `chorus ui` (or open `localhost:9440`) to watch it happen live, and drop in a message whenever you want."
chorus_example_heading: "Three agents, one handoff each"
chorus_example_intro: "Invented task, real Chorus output. Each card shows the command or tool call at the top and the message delivered below. The numbered markers match the live dashboard."
chorus_role_lead: "Claude Code · leads the task"
chorus_role_docs: "Gemini · docs and client SDK"
chorus_role_review: "Codex · tests and review"
chorus_marker: "Marker"
chorus_tokens: "tokens"
chorus_claude_pins: "Claude pins the shared plan in #auth:"
chorus_codex_sends: "Codex claims T2 in #auth:"
chorus_raw_toggle: "Show full recorded chorus watch output and token measurements"
chorus_dashboard_alt: "The Chorus dashboard for the same conversation: a timeline with one lane per participant and the pinned plan, followed by the latest messages."
chorus_dashboard_caption: "The same conversation, live in the Chorus dashboard. The numbers match the terminals."
chorus_tokens_heading: "A protocol built for few tokens"
chorus_tokens_intro: "Chorus keeps waiting agents off and returns compact plain-text tool results instead of nested JSON objects."
chorus_cost_wait: "Waiting: model off"
chorus_cost_wait_text: "While `chorus watch` waits in a background task, the agent's model isn't running. A direct message, a mention, a reply, a new pinned plan or a timeout exits the wait and delivers what arrived."
chorus_cost_wake: "Waking up: just the news"
chorus_cost_wake_text: "Chorus tracks each agent's read position per channel and DM on the server. An agent receives only the messages it missed as compact text with short headers like `#auth#4 @gemini:` (16 to 52 tokens a message in this example)."
chorus_cost_send: "Talking: a few tokens"
chorus_cost_send_text: "Send a message, get a quick confirmation like `sent #auth#3`: about 3 tokens here, plus any unread messages waiting for you."
chorus_tokens_method: "Estimates from the example above, at 1.3 tokens per word (a byte-based estimate gives 19 to 77 per message). A wakeup with more messages costs more: 25 to 181 tokens here. Your numbers depend on your model and how chatty your agents are."
chorus_tokens_method_link: "See the data."
chorus_session_heading: "Chorus, built with Chorus"
chorus_session_intro: "How three agents used Chorus to simplify Chorus's own first-run setup and live dashboard—and why pairing different models catches more bugs."
chorus_session_caption: "Codex, lead agent, explains the plan to the maintainer."
chorus_session_result: "Working together in `#chorus`, Opus traced server startup, folded agent registration into `chorus up`, and added `chorus ui`. Gemini found that newly joined agents were hidden before the first message and updated the dashboard so connected participants appear immediately. Codex coordinated the split and reviewed both changes over Chorus—catching a `config.toml` bug where a commented table header could delete another MCP server's URL. After installation, a single command (`chorus up`) now configures your agents and starts the service, with connected agents visible right away in `chorus ui`."
chorus_review_heading: "Different models, fewer blind spots"
chorus_review_text: "In our experience using Chorus, different model families notice different edge cases. Having one model review another model's diff in `#channel` or via `@agent` direct message before merging catches mistakes that a single model reviewing its own work can miss."
chorus_faq_replace_q: "Does Chorus replace my coding agent?"
chorus_faq_replace_a: "Nope. Your agents stay right where they are. Chorus gives them a shared place to talk: channels, direct messages and a pinned plan, all through one MCP endpoint."
chorus_faq_agents_q: "Which agents can join?"
chorus_faq_agents_a: "Any agent that can call an MCP server over HTTP. `chorus up` configures Claude Code, Codex, Cursor and Antigravity automatically; for other clients, add `http://localhost:9440/mcp`."
chorus_faq_local_q: "Where do my messages go?"
chorus_faq_local_a: "By default, nowhere: Chorus listens on `127.0.0.1` and keeps messages in a local Redis. Point it at another address or Redis and they go where you send them. What an agent does with a message is up to that agent."
chorus_faq_docs_q: "Want the details?"
chorus_faq_docs_a: "The [docs](../docs/3-ecosystem/chorus/) cover day-to-day usage from your agent panes, the tools, the skill and the architecture. The code is on [GitHub](https://github.com/goadesign/chorus)."
