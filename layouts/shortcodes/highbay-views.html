<div class="highbay-doc-views">
  <figure class="highbay-doc-shot">
    <div class="highbay-doc-shot__card">
      <div class="highbay-doc-shot__bar">
        <strong>{{ T "highbay_tab_agree" }}</strong>
        <a class="highbay-window__zoom" href="{{ "img/highbay/agree-desktop-light.webp" | relURL }}" target="_blank" rel="noopener">{{ T "highbay_zoom_label" }}</a>
      </div>
      <div class="chorus-shot highbay-window">
        <picture class="chorus-shot--light">
          <source media="(max-width: 600px)" srcset="{{ "img/highbay/agree-mobile-light.webp" | relURL }}" width="390" height="740">
          <img src="{{ "img/highbay/agree-desktop-light.webp" | relURL }}" alt="{{ T "highbay_agree_alt" }}" width="1040" height="845" loading="lazy" decoding="async">
        </picture>
        <picture class="chorus-shot--dark">
          <source media="(max-width: 600px)" srcset="{{ "img/highbay/agree-mobile-dark.webp" | relURL }}" width="390" height="740">
          <img src="{{ "img/highbay/agree-desktop-dark.webp" | relURL }}" alt="{{ T "highbay_agree_alt" }}" width="1040" height="845" loading="lazy" decoding="async">
        </picture>
      </div>
    </div>
    <figcaption>{{ T "highbay_agree_pin_1" | markdownify }}</figcaption>
  </figure>
  <figure class="highbay-doc-shot">
    <div class="highbay-doc-shot__card">
      <div class="highbay-doc-shot__bar">
        <strong>{{ T "highbay_tab_approve" }}</strong>
        <a class="highbay-window__zoom" href="{{ "img/highbay/approve-desktop-light.webp" | relURL }}" target="_blank" rel="noopener">{{ T "highbay_zoom_label" }}</a>
      </div>
      <div class="chorus-shot highbay-window">
        <picture class="chorus-shot--light">
          <source media="(max-width: 600px)" srcset="{{ "img/highbay/approve-mobile-light.webp" | relURL }}" width="390" height="740">
          <img src="{{ "img/highbay/approve-desktop-light.webp" | relURL }}" alt="{{ T "highbay_approve_alt" }}" width="1040" height="845" loading="lazy" decoding="async">
        </picture>
        <picture class="chorus-shot--dark">
          <source media="(max-width: 600px)" srcset="{{ "img/highbay/approve-mobile-dark.webp" | relURL }}" width="390" height="740">
          <img src="{{ "img/highbay/approve-desktop-dark.webp" | relURL }}" alt="{{ T "highbay_approve_alt" }}" width="1040" height="845" loading="lazy" decoding="async">
        </picture>
      </div>
    </div>
    <figcaption>{{ T "highbay_approve_pin_1" | markdownify }}</figcaption>
  </figure>
</div>
