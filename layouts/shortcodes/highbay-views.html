<div class="highbay-doc-views">
  <figure class="highbay-doc-shot">
    <div class="chorus-shot highbay-window">
      <div class="highbay-window__bar" aria-hidden="true">
        <span class="highbay-window__dots"><i></i><i></i><i></i></span>
        <span class="highbay-window__url">127.0.0.1 · Highbay / refunds-service — Agree</span>
      </div>
      <picture class="chorus-shot--light">
        <source media="(max-width: 600px)" srcset="{{ "img/highbay/agree-mobile-light.webp" | relURL }}" width="390" height="780">
        <img src="{{ "img/highbay/agree-desktop-light.webp" | relURL }}" alt="{{ T "highbay_agree_alt" }}" width="1440" height="960" loading="lazy" decoding="async">
      </picture>
      <picture class="chorus-shot--dark">
        <source media="(max-width: 600px)" srcset="{{ "img/highbay/agree-mobile-dark.webp" | relURL }}" width="390" height="780">
        <img src="{{ "img/highbay/agree-desktop-dark.webp" | relURL }}" alt="{{ T "highbay_agree_alt" }}" width="1440" height="960" loading="lazy" decoding="async">
      </picture>
    </div>
    <figcaption>{{ T "highbay_tab_agree" }} — {{ T "highbay_tab_agree_sub" }}</figcaption>
  </figure>
